<style>
:root{
  /* Uygulamanın koyu temasıyla aynı palet — index.html ile birebir */
  --bg:#0A0C11; --bg2:#0E1117; --card:#12151C; --card2:#161B23; --raise:#1B212C;
  --ink:#E9ECF2; --soft:#A4ACBA; --faint:#727C8C; --line:#232A36; --hover:#171D27;

  /* eski isimler korunuyor ki mevcut kod bozulmasın */
  --brass:#8B92FA; --brass-soft:rgba(99,102,241,.15);
  --acc:#6366F1; --acc2:#8B92FA;
  --paid:#43D583; --paid-bg:rgba(47,203,118,.12);
  --unpaid:#FF6E85; --unpaid-bg:rgba(241,85,108,.12);
  --ok:#2FCB76; --ok-tx:#43D583;
  --no:#F1556C; --no-tx:#FF6E85;
  --wa:#F5A524; --wa-tx:#FFB84D;
  --dec:#8B92FA;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -16px rgba(0,0,0,.7);
  --spring:cubic-bezier(.34,1.4,.4,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
.num{font-family:"Instrument Serif",Georgia,serif;font-feature-settings:"tnum";letter-spacing:.2px}
h1,h2,h3,.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:.2px}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card2);color:var(--ink);font-family:inherit}

/* ——— şifre göster/gizle ——— */
.sifre-kutu{position:relative}
.sifre-kutu .inp{padding-right:46px}
.goz{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;color:var(--faint);
  border-radius:8px;transition:color .18s,background .18s;padding:0;
}
.goz:hover{color:var(--ink);background:var(--hover,rgba(127,127,127,.12))}
.goz svg{width:20px;height:20px;pointer-events:none}

.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--acc);background:var(--raise)}
.inp option{background:var(--card2);color:var(--ink)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--acc)}
input[type="date"],input[type="datetime-local"]{color-scheme:dark}
.inp:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.field{margin-bottom:13px}.field label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:6px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--ink);color:var(--bg);transition:transform .12s var(--spring)}
.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.55}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.brass{background:linear-gradient(120deg,#8E93FF,#6366F1 60%,#8B37E8);color:#fff}.btn.danger{background:var(--unpaid);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}.btn.full{width:100%}
.spin{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ————— YÖNETİM PANELİ HUZURLU YÜKLEME ANİMASYONLARI ————— */
.loading{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--brass);padding:32px 16px;animation:admFadeIn .3s ease-out}
.loading .spin{
  width:42px;height:42px;border:3px solid rgba(200,165,92,.18);
  border-top-color:var(--brass);border-right-color:rgba(235,210,145,.8);
  border-radius:50%;animation:admSpin 1.1s cubic-bezier(.45,.05,.55,.95) infinite;
  box-shadow:0 0 24px -2px rgba(200,165,92,.28);position:relative
}
.loading .spin::after{
  content:"";position:absolute;inset:5px;
  border:2.5px solid transparent;border-bottom-color:#8e93ff;border-left-color:rgba(142,147,255,.5);
  border-radius:50%;animation:admSpinRev 1.6s cubic-bezier(.45,.05,.55,.95) infinite
}
.loading::after{
  content:"Veriler hazırlanıyor…";font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.02em;
  animation:admPulseText 2.2s ease-in-out infinite
}

.btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;box-shadow:none;animation:sp .6s linear infinite}
.btn .spin::after{display:none}

/* Admin Splash Ekranı — Fütüristik & Şık Yönetici Deneyimi */
.adm-splash{position:relative;max-width:420px;width:100%;text-align:center;z-index:1;animation:admFadeIn .6s cubic-bezier(.16,1,.3,1);transition:opacity .35s ease,transform .35s cubic-bezier(.16,1,.3,1),filter .35s ease}
.adm-splash.splash-leaving{opacity:0;transform:scale(1.03) translateY(-8px);filter:blur(6px);pointer-events:none}
.adm-splash-glow{
  position:absolute;inset:-50px;
  background:radial-gradient(circle,rgba(200,165,92,.25) 0%,rgba(99,102,241,.16) 40%,rgba(235,210,145,.1) 65%,transparent 75%);
  filter:blur(40px);pointer-events:none;animation:admGlow 4.5s ease-in-out infinite alternate
}
.adm-splash-card{
  background:rgba(16,18,25,.90);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(200,165,92,.25);border-radius:28px;padding:34px 26px 28px;
  box-shadow:0 30px 80px -16px rgba(0,0,0,.75),0 0 0 1px rgba(200,165,92,.1) inset;
  display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;overflow:hidden
}
.adm-splash-card::before{
  content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(200,165,92,.08) 60deg,transparent 120deg);
  animation:admRadarSweep 8s linear infinite;pointer-events:none
}
@keyframes admRadarSweep{to{transform:rotate(360deg)}}
.adm-logo-wrap{position:relative;width:84px;height:84px;display:grid;place-items:center;margin-top:4px}
.adm-aura{
  position:absolute;inset:2px;border-radius:22px;
  background:linear-gradient(135deg,rgba(200,165,92,.55),rgba(99,102,241,.4));
  filter:blur(16px);animation:admAura 3.2s ease-in-out infinite alternate
}
.adm-orbit{
  position:absolute;inset:-10px;border:1px dashed rgba(200,165,92,.35);
  border-radius:50%;animation:admOrbitSpin 10s linear infinite
}
.adm-orbit::after{
  content:"";position:absolute;top:-3px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;background:#ebd291;box-shadow:0 0 8px #ebd291
}
@keyframes admOrbitSpin{to{transform:rotate(360deg)}}
.adm-ripple{
  position:absolute;inset:-6px;border:1.5px solid rgba(200,165,92,.35);
  border-radius:26px;animation:admRipple 3.2s cubic-bezier(.2,.8,.4,1) infinite
}
.adm-ripple.r2{animation-delay:1.6s}
.adm-logo-box{position:relative;z-index:2;animation:admFloat 3.6s ease-in-out infinite}
.adm-title{font-size:24px;font-weight:700;letter-spacing:-.02em;color:#fff;font-family:"Space Grotesk",sans-serif;margin-bottom:2px}
.adm-tagline{font-size:12.5px;color:rgba(200,165,92,.75);font-weight:500;margin-bottom:8px}

.adm-quote-wrap{min-height:24px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.adm-quote{font-size:13px;color:#e6cf9b;font-weight:500;transition:opacity .35s ease,transform .35s ease;letter-spacing:.01em}

/* Fütüristik İlerleme Çubuğu ve Sayaç */
.adm-progress-container{width:100%;max-width:240px;display:flex;flex-direction:column;gap:6px;align-items:center}
.adm-progress-meta{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-family:"JetBrains Mono",monospace;color:rgba(255,255,255,.5)}
.adm-pct{color:#ebd291;font-weight:700}
.adm-progress-box{width:100%;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.adm-progress-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#c8a55c,#ebd291,#6366f1,#ebd291,#c8a55c);
  box-shadow:0 0 12px rgba(200,165,92,.6);
  transition:width .25s ease-out
}

/* Yönetici Güvenlik & Sistem Rozetleri */
.adm-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.adm-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(200,165,92,.2);
  color:rgba(235,210,145,.8);font-family:"JetBrains Mono",monospace
}
.adm-badge.pulse{border-color:rgba(200,165,92,.45);color:#ebd291}
.adm-badge-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}

.adm-harmonic-bars{display:flex;gap:4px;align-items:center;justify-content:center;height:14px;margin-top:2px}
.adm-hbar{width:3.5px;height:12px;background:var(--brass);border-radius:999px;animation:harmonicBounce 1.4s ease-in-out infinite}
.adm-hbar.b1{animation-delay:0s;background:#c8a55c}
.adm-hbar.b2{animation-delay:.15s;background:#ebd291}
.adm-hbar.b3{animation-delay:.3s;background:#8e93ff}
.adm-hbar.b4{animation-delay:.45s;background:#ebd291}
.adm-hbar.b5{animation-delay:.6s;background:#c8a55c}

@keyframes admFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes admSpin{to{transform:rotate(360deg)}}
@keyframes admSpinRev{to{transform:rotate(-360deg)}}
@keyframes admPulseText{0%,100%{opacity:.6;transform:scale(.99)}50%{opacity:1;transform:scale(1);color:#fff}}
@keyframes admGlow{0%{opacity:.6;transform:scale(.95)}100%{opacity:1;transform:scale(1.05)}}
@keyframes admAura{0%{opacity:.5;transform:scale(.92)}100%{opacity:1;transform:scale(1.08)}}
@keyframes admFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes admRipple{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.28);opacity:0}}
@keyframes gradientSlide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes harmonicBounce{0%,100%{transform:scaleY(.35);opacity:.4}50%{transform:scaleY(1.1);opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.muted{color:var(--soft)}.faint{color:var(--faint)}.small{font-size:12.5px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:12px}.wrap{flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.tag.paid{color:var(--paid);background:var(--paid-bg)}.tag.unpaid{color:var(--unpaid);background:var(--unpaid-bg)}
.tag.brass{color:var(--brass);background:var(--brass-soft)}
header.top{border-bottom:1px solid var(--line);background:rgba(10,12,17,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topin{max-width:1080px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:8px}
main{max-width:1080px;margin:0 auto;padding:24px 22px 60px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{position:relative;overflow:hidden}.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
.kpi .v{font-size:34px;line-height:1;margin:8px 0 2px}
.slist{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;cursor:pointer;transition:box-shadow .15s,transform .12s}
.srow:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.metrics{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:6px}
.metrics b{color:var(--ink);font-family:"Instrument Serif",serif;font-size:15px}
.churn{color:var(--unpaid);font-weight:600}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.hr{height:1px;background:var(--line);margin:16px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.3s var(--spring)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:var(--unpaid)}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:480px;border-radius:16px;padding:22px;box-shadow:var(--shadow);animation:up .3s var(--spring);max-height:calc(100dvh - 36px);overflow-y:auto;margin:auto}
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.dz{border:1px solid #e8cdc9;background:var(--unpaid-bg);border-radius:var(--r);padding:16px}
.hide{display:none}
/* ---- mobil uyum: dokunma hedefleri ve dar ekran yerlesimi ---- */
@media(max-width:600px){
  .btn.sm{padding:10px 14px;font-size:13px;min-height:40px}
  .list-item{flex-wrap:wrap;align-items:flex-start}
  .list-item .btn.sm{min-height:40px}
  .row.wrap{gap:8px}
  .row.wrap .btn.sm{flex:1 1 auto}
  .inp{font-size:16px}          /* iOS'ta odaklaninca sayfa zoomlanmasin */
  select.inp{min-height:44px}
  .card.pad{padding:16px}
}
/* prefers-reduced-motion kaldırıldı */
</style>

/* Havalı Yönetici Açılış Kontrolcüsü */
(function(){
  var notEl = document.getElementById("admNot");
  var pctEl = document.getElementById("admPct");
  var barEl = document.getElementById("admBar");
  var splashEl = document.getElementById("admSplash");
  
  var currentPct = 0;
  var targetPct = 15;
  var isFinished = false;
  var startTime = Date.now();

  var stages = [
    { at: 0,  msg: "Yetkili oturum ve güvenlik katmanı doğrulanıyor…" },
    { at: 30, msg: "Tüm siteler, portföy ve kasa kayıtları derleniyor…" },
    { at: 65, msg: "Merkezi konsol ve denetim modülleri hazırlanıyor…" },
    { at: 90, msg: "Yönetim Paneli hazır · Hoş geldiniz" }
  ];

  function updateStageMsg(val){
    if(!notEl) return;
    for(var i = stages.length - 1; i >= 0; i--){
      if(val >= stages[i].at){
        if(notEl.textContent !== stages[i].msg){
          notEl.textContent = stages[i].msg;
        }
        break;
      }
    }
  }

  var timer = setInterval(function(){
    if(!splashEl || !document.body.contains(splashEl)){ clearInterval(timer); return; }
    
    var elapsed = Date.now() - startTime;
    if(!isFinished){
      if(elapsed < 600) targetPct = 25;
      else if(elapsed < 1400) targetPct = 65;
      else if(elapsed < 2100) targetPct = 88;
    } else {
      targetPct = 100;
    }

    if(currentPct < targetPct){
      currentPct += Math.max(1, Math.round((targetPct - currentPct) * 0.22));
      if(currentPct > 100) currentPct = 100;
      if(pctEl) pctEl.textContent = currentPct + "%";
      if(barEl) barEl.style.width = currentPct + "%";
      updateStageMsg(currentPct);
    }
  }, 40);

  window.__admSplashFinish = function(){
    return new Promise(function(resolve){
      isFinished = true;
      targetPct = 100;
      
      var minDuration = 2200;
      var elapsed = Date.now() - startTime;
      var remaining = Math.max(0, minDuration - elapsed);

      setTimeout(function(){
        currentPct = 100;
        if(pctEl) pctEl.textContent = "100%";
        if(barEl) barEl.style.width = "100%";
        updateStageMsg(100);
        
        setTimeout(function(){
          if(splashEl){
            splashEl.classList.add("splash-leaving");
          }
          setTimeout(function(){
            clearInterval(timer);
            resolve();
          }, 320);
        }, 260);
      }, remaining);
    });
  };
})();

/* ================= CSV: kurulum bilgileri dışa/içe aktarım (yalnız süper-admin) =================
   Sütunlar: site_id (anahtar, salt-okunur), ad, adres, aidat_tutari, iban, iban_sahibi,
   abonelik_durumu (pilot|odeyen|pasif), abonelik_daire_ucreti,
   takip_baslangic (salt-okunur), daire_sayisi (salt-okunur).
   İçe aktarma yalnızca MEVCUT siteleri günceller; asla yeni site oluşturmaz/silmez. */
const CSV_COLS=[
  {k:"site_id",        ro:true},
  {k:"ad"},
  {k:"adres"},
  {k:"aidat_tutari",   num:true},
  {k:"iban"},
  {k:"iban_sahibi"},
  {k:"abonelik_durumu"},
  {k:"abonelik_daire_ucreti", num:true},
  {k:"takip_baslangic",ro:true},
  {k:"daire_sayisi",   ro:true},
];
const CSV_EDITABLE=CSV_COLS.filter(c=>!c.ro).map(c=>c.k);
const DURUMLAR=["pilot","odeyen","pasif"];

// TR/EN sayı ayrıştırma: "1.234,56" -> 1234.56 ; "1234.56" -> 1234.56 ; boş -> null
function parseNum(v){
  if(v==null) return null;
  let s=(""+v).trim().replace(/[₺\s]/g,"");
  if(!s) return null;
  if(s.includes(",")&&s.includes(".")){ s=s.replace(/\./g,"").replace(",","."); }   // 1.234,56
  else if(s.includes(",")){ s=s.replace(",","."); }                                   // 1234,56
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
// Bir hücreyi CSV için kaçışla (RFC 4180)
function csvCell(v,delim){
  const s=(v==null?"":""+v);
  return /["\r\n]|[;,\t]/.test(s)||s.includes(delim) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows,delim=";"){
  const head=CSV_COLS.map(c=>c.k).join(delim);
  const body=rows.map(r=>CSV_COLS.map(c=>csvCell(r[c.k],delim)).join(delim)).join("\r\n");
  return "\uFEFF"+head+"\r\n"+body;                                                    // BOM: Excel'de Türkçe/UTF-8
}
// Ayraç algıla + RFC 4180 ayrıştır
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const first=(text.split(/\r?\n/,1)[0])||"";
  const counts={";":(first.match(/;/g)||[]).length,",":(first.match(/,/g)||[]).length,"\t":(first.match(/\t/g)||[]).length};
  const delim=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||",";
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else{ if(ch==='"') q=true;
      else if(ch===delim){ row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(ch==="\r"){ /* skip */ }
      else cell+=ch; }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  const clean=rows.filter(r=>r.some(c=>(c||"").trim()!==""));
  if(!clean.length) return {header:[],rows:[]};
  const header=clean[0].map(x=>(x||"").trim());
  const out=clean.slice(1).map(r=>{ const o={}; header.forEach((hn,i)=>o[hn]=(r[i]??"").trim()); return o; });
  return {header,rows:out};
}
function downloadFile(name,text){
  const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},0);
}
const csvStamp=()=>new Date().toISOString().slice(0,10);

// Süper-admin için tüm sitelerin ham kurulum satırlarını çek (siteDetay ile aynı erişim)
async function csvFetchRows(){
  const list=await rpc("admin_site_listesi");              // id, ad, daire_sayisi ...
  const ids=(list||[]).map(x=>x.id);
  const dmap={}; (list||[]).forEach(x=>dmap[x.id]=x.daire_sayisi);
  let full=[];
  if(ids.length){
    const {data,error}=await sb.from("siteler").select("*").in("id",ids);
    if(error) throw error; full=data||[];
  }
  full.sort((a,b)=>(a.ad||"").localeCompare(b.ad||"","tr"));
  return full.map(s=>({
    site_id:s.id,
    ad:s.ad??"",
    adres:s.adres??"",
    aidat_tutari:s.aidat_tutari??"",
    iban:s.iban??"",
    iban_sahibi:s.iban_sahibi??"",
    abonelik_durumu:s.abonelik_durumu??"",
    abonelik_daire_ucreti:s.abonelik_daire_ucreti??"",
    takip_baslangic:s.takip_baslangic?(""+s.takip_baslangic).slice(0,10):"",
    daire_sayisi:dmap[s.id]??"",
  }));
}
async function csvExport(){
  const rows=await csvFetchRows();
  if(!rows.length){ toast("Aktarılacak site yok.","err"); return; }
  downloadFile(`ortak-alan-siteler-${csvStamp()}.csv`, toCSV(rows));
  toast(`${rows.length} site dışa aktarıldı ✓`);
}
function csvTemplate(){
  const ornek={ site_id:"BURAYA-mevcut-site_id-yapistir", ad:"Örnek Sitesi", adres:"Örnek Mah. 1. Sok. No:2",
    aidat_tutari:"1500", iban:"TR00 0000 0000 0000 0000 0000 00", iban_sahibi:"Site Yönetimi",

  downloadFile("ortak-alan-sablon.csv", toCSV([ornek]));
  toast("Şablon indirildi ✓");
}

// Tek bir sitenin kurulumunu uygula. Önce birleşik RPC; yoksa mevcut abonelik RPC + doğrudan güncelleme.
async function csvApplyRow(id,d){
  try{
    await rpc("admin_site_kurulum_guncelle",{
      p_site:id, p_ad:d.ad, p_adres:d.adres||null, p_aidat:d.aidat_tutari,
      p_iban:d.iban||null, p_iban_sahibi:d.iban_sahibi||null,
      p_durum:d.abonelik_durumu, p_ucret:d.abonelik_daire_ucreti,
    });
    return {ok:true};
  }catch(e){
    const m=((e&&(e.message||e.msg))||""+e);
    const missing=/schema cache|Could not find the function|does not exist|PGRST202/i.test(m);
    if(!missing) return {ok:false, err:niceError(e)};   // RPC var ama hata verdi → bildir
  }
  // Yedek yol: abonelik alanları mevcut RPC ile; diğer kurulum alanları doğrudan güncelleme ile
  const errs=[];
  try{ await rpc("admin_abonelik_guncelle",{p_site:id,p_durum:d.abonelik_durumu,p_ucret:d.abonelik_daire_ucreti}); }
  catch(e){ errs.push("abonelik: "+niceError(e)); }
  const {error}=await sb.from("siteler").update({
    ad:d.ad, adres:d.adres||null, aidat_tutari:d.aidat_tutari, iban:d.iban||null, iban_sahibi:d.iban_sahibi||null
  }).eq("id",id);
  if(error) errs.push("bilgiler: "+niceError(error));
  return errs.length?{ok:false,err:errs.join(" · ")}:{ok:true};
}

// Yüklenen CSV'yi mevcut durumla karşılaştır → değişiklik/atlama listesi çıkar
async function csvBuildPlan(text){
  const {header,rows}=parseCSV(text);
  if(!header.includes("site_id")) throw new Error("CSV'de 'site_id' sütunu yok. Önce 'Şablon indir' veya 'Dışa aktar' ile doğru başlıkları alın.");
  const current=await csvFetchRows();
  const cmap={}; current.forEach(r=>cmap[r.site_id]=r);
  const changes=[], skipped=[];
  rows.forEach((r,idx)=>{
    const id=(r.site_id||"").trim();
    const line=idx+2;
    if(!id){ skipped.push({line, ad:r.ad||"—", reason:"site_id boş"}); return; }
    const cur=cmap[id];
    if(!cur){ skipped.push({line, ad:r.ad||id, reason:"bu site_id bulunamadı (içe aktarma yeni site oluşturmaz)"}); return; }
    // İstenen değerler (sadece düzenlenebilir alanlar). Eksik sütun varsa mevcut değeri koru.
    const has=(k)=>Object.prototype.hasOwnProperty.call(r,k);
    const d={
      ad:              has("ad")?              (r.ad||"").trim()          : cur.ad,
      adres:           has("adres")?           (r.adres||"").trim()       : cur.adres,
      iban:            has("iban")?            (r.iban||"").trim()        : cur.iban,
      iban_sahibi:     has("iban_sahibi")?     (r.iban_sahibi||"").trim() : cur.iban_sahibi,
      abonelik_durumu: has("abonelik_durumu")? (r.abonelik_durumu||"").trim().toLowerCase() : cur.abonelik_durumu,
      aidat_tutari:    has("aidat_tutari")?    parseNum(r.aidat_tutari)   : parseNum(cur.aidat_tutari),
      abonelik_daire_ucreti: has("abonelik_daire_ucreti")? parseNum(r.abonelik_daire_ucreti) : parseNum(cur.abonelik_daire_ucreti),
    };
    // Doğrulama
    const probs=[];
    if(!d.ad) probs.push("ad boş olamaz");
    if(!(d.aidat_tutari>0)) probs.push("aidat_tutari geçerli ve 0'dan büyük olmalı");
    if(d.abonelik_daire_ucreti==null||d.abonelik_daire_ucreti<0) probs.push("abonelik_daire_ucreti geçersiz");
    if(!DURUMLAR.includes(d.abonelik_durumu)) probs.push("abonelik_durumu: pilot | odeyen | pasif olmalı");
    if(probs.length){ skipped.push({line, ad:d.ad||id, reason:probs.join("; ")}); return; }
    // Değişen alanları bul
    const diffs=[];
    const curCmp={ad:cur.ad, adres:cur.adres, iban:cur.iban, iban_sahibi:cur.iban_sahibi,
      abonelik_durumu:cur.abonelik_durumu, aidat_tutari:parseNum(cur.aidat_tutari), abonelik_daire_ucreti:parseNum(cur.abonelik_daire_ucreti)};
    CSV_EDITABLE.forEach(k=>{
      let a=curCmp[k], b=d[k];
      if(k==="adres"||k==="iban"||k==="iban_sahibi"){ a=a||""; b=b||""; }
      const same=(a==null&&b==null)|| (""+a)===(""+b);
      if(!same) diffs.push({k, from:a, to:b});
    });
    if(diffs.length) changes.push({id, ad:d.ad, d, diffs});
  });
  return {changes, skipped, total:rows.length};
}

function csvImportOpen(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".csv,text/csv"; inp.style.display="none";
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; inp.remove();
    if(!file) return;
    let text; try{ text=await file.text(); }catch(e){ toast("Dosya okunamadı.","err"); return; }
    let plan; try{ plan=await csvBuildPlan(text); }catch(e){ toast(niceError(e),"err"); return; }
    csvPreviewModal(plan);
  };
  inp.click();
}

function fmtVal(k,v){
  if(v==null||v==="") return '<span class="faint">—</span>';
  if(k==="aidat_tutari"||k==="abonelik_daire_ucreti") return esc(money(v));
  return esc(v);
}
function csvPreviewModal(plan){
  const {changes,skipped,total}=plan;
  const changeHtml = changes.length ? changes.map(c=>`
    <div class="list-item" style="display:block">

/* ================= TAM VERİ: bir sitenin bütün tabloları · Excel (.xlsx) =================
   admin_site_disa_aktar / admin_site_ice_aktar RPC'lerini kullanır (admin_site_tam_veri.sql).
   İçe aktarma id ile eşleştirir; günceller veya ekler, HİÇBİR satırı silmez. */
const FULL_TABLES=["siteler","daireler","profiller","daire_detay","gorevli_detay","davet_kodlari","duyurular","rutinler","talepler","odemeler","kasa_hareketleri","toplantilar","toplanti_katilim","ziyaretciler"];
const PK_MAP={siteler:["id"],daireler:["id"],profiller:["id"],daire_detay:["daire_id"],gorevli_detay:["profil_id"],davet_kodlari:["id"],duyurular:["id"],rutinler:["id"],talepler:["id"],odemeler:["id"],kasa_hareketleri:["id"],toplantilar:["id"],toplanti_katilim:["toplanti_id","profil_id"],ziyaretciler:["id"]};
const TEMPLATES={
  siteler:["id","ad","adres","aidat_tutari","iban","iban_sahibi","abonelik_durumu","abonelik_daire_ucreti","takip_baslangic","kurallar"],
  daireler:["id","site_id","blok","no","sira"], profiller:["id","site_id","ad","rol","daire_id"],
  daire_detay:["daire_id","dolduruldu","aciklama"], gorevli_detay:["profil_id","dolduruldu","telefon"],
  davet_kodlari:["id","site_id","kod","rol","iptal","kullanildi"], duyurular:["id","site_id","baslik","metin"],
  rutinler:["id","site_id","baslik","siklik","aktif"], talepler:["id","site_id","metin","durum"],
  odemeler:["id","site_id","yil","ay","durum"], kasa_hareketleri:["id","site_id","tip","tutar","aciklama"],
  toplantilar:["id","site_id","baslik","zaman"], toplanti_katilim:["toplanti_id","profil_id","site_id","durum"],
  ziyaretciler:["id","site_id","ad","durum"],
};
const TABLE_TR={siteler:"Site ayarları",daireler:"Daireler",profiller:"Sakinler/Hesaplar",daire_detay:"Daire detayları",gorevli_detay:"Görevli detayları",davet_kodlari:"Davet kodları",duyurular:"Duyurular",rutinler:"Rutinler",talepler:"Talepler",odemeler:"Ödemeler",kasa_hareketleri:"Kasa hareketleri",toplantilar:"Toplantılar",toplanti_katilim:"Toplantı katılım",ziyaretciler:"Ziyaretçiler"};
const pkOf=(t,row)=>PK_MAP[t].map(k=>row[k]).join("|");
const missingRpc=(e)=>{const m=((e&&(e.message||e.msg))||""+e);return /schema cache|Could not find the function|does not exist|PGRST202/i.test(m);};

function buildWorkbook(data){
  const wb=XLSX.utils.book_new();
  FULL_TABLES.forEach(t=>{
    let rows = t==="siteler" ? (data.siteler?[data.siteler]:[]) : (data[t]||[]);
    let ws;
    if(rows.length) ws=XLSX.utils.json_to_sheet(rows);
    else ws=XLSX.utils.aoa_to_sheet([TEMPLATES[t]||["id"]]);   // boş tablo: sadece başlık satırı
    XLSX.utils.book_append_sheet(wb, ws, t.slice(0,31));
  });
  return wb;
}
function normalizeVal(v){
  if(v instanceof Date) return v.toISOString();
  if(v==="") return null;
  return v;
}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const data={};
  wb.SheetNames.forEach(name=>{
    if(!FULL_TABLES.includes(name)) return;
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:null,raw:true});
    const rows=raw.map(r=>{const o={};for(const k in r)o[k]=normalizeVal(r[k]);return o;})
                  .filter(r=>Object.values(r).some(v=>v!=null&&v!==""));
    // id anahtarlı tablolarda yeni satıra id yoksa üret (kullanıcı uuid yazmak zorunda kalmasın).
    // profiller HARİÇ: profiller.id = Auth hesabının id'sidir, uydurulamaz.
    if(name!=="profiller" && PK_MAP[name].length===1 && PK_MAP[name][0]==="id"){
      rows.forEach(r=>{ if(!r.id) r.id=(crypto.randomUUID?crypto.randomUUID():("x"+Date.now()+Math.random().toString(16).slice(2))); });
    }
    if(name==="siteler") data.siteler=rows[0]||null;
    else data[name]=rows;
  });
  return data;
}

async function siteFullExport(siteId, siteAd){
  let data;
  try{ data=await rpc("admin_site_disa_aktar",{p_site:siteId}); }
  catch(e){
    if(missingRpc(e)){ toast("Sunucu fonksiyonu yok — admin_site_tam_veri.sql çalıştırılmalı.","err"); return; }
    throw e;
  }
  const wb=buildWorkbook(data);
  const arr=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const safe=(siteAd||"site").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"").slice(0,40)||"site";
  const blob=new Blob([arr],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`ortak-alan-${safe}-${csvStamp()}.xlsx`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},0);
  const n=FULL_TABLES.reduce((s,t)=>s+(t==="siteler"?(data.siteler?1:0):(data[t]||[]).length),0);
  toast(`${n} kayıt dışa aktarıldı ✓`);
}

function siteFullImportOpen(siteId, siteAd){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".xlsx,.xls"; inp.style.display="none"; document.body.appendChild(inp);
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; inp.remove(); if(!file)return;
    let plan;
    try{
      const buf=await file.arrayBuffer();
      const parsed=parseWorkbook(buf);
      // mevcut durumu çek (yeni/mevcut ayrımı için)
      let current;
      try{ current=await rpc("admin_site_disa_aktar",{p_site:siteId}); }
      catch(e){ if(missingRpc(e)){ toast("Sunucu fonksiyonu yok — admin_site_tam_veri.sql çalıştırılmalı.","err"); return; } throw e; }
      plan=buildFullPlan(parsed,current);
      plan.siteId=siteId; plan.payload=parsed;
    }catch(e){ toast(niceError(e),"err"); return; }
    fullPreviewModal(plan);
  };
  inp.click();
}
function buildFullPlan(parsed,current){
  const lines=[];
  FULL_TABLES.forEach(t=>{
    let rows = t==="siteler" ? (parsed.siteler?[parsed.siteler]:[]) : (parsed[t]||[]);
    if(!rows.length) return;
    let curRows = t==="siteler" ? (current.siteler?[current.siteler]:[]) : (current[t]||[]);
    const curSet=new Set(curRows.map(r=>pkOf(t,r)));
    let yeni=0, guncel=0;
    rows.forEach(r=>{ if(curSet.has(pkOf(t,r))) guncel++; else yeni++; });
    lines.push({t, yeni, guncel, toplam:rows.length});
  });
  return {lines};
}
function fullPreviewModal(plan){
  const rowsHtml = plan.lines.length ? plan.lines.map(l=>`

  const m=modal(`

  m.querySelector("#fimc").onclick=closeModal;
  const btn = plan.lines.length
    ? guard(h(`<button class="btn brass full">İçe aktar</button>`), async()=>{ await runFullImport(plan); })
    : h(`<button class="btn full" disabled>İçe aktarılacak veri yok</button>`);
  m.querySelector("#fimx").appendChild(btn);

async function runFullImport(plan){
  let report;
  try{ report=await rpc("admin_site_ice_aktar",{p_site:plan.siteId,p_payload:plan.payload}); }
  catch(e){ closeModal(); if(missingRpc(e)){ toast("Sunucu fonksiyonu yok — admin_site_tam_veri.sql çalıştırılmalı.","err"); return; } toast(niceError(e),"err"); return; }

      ${okRows.map(([t,v])=>`<div class="small" style="margin-bottom:3px">${esc(TABLE_TR[t]||t)}: <b>${v.eklenen||0}</b> yeni, <b>${v.guncellenen||0}</b> güncel</div>`).join("")}
      ${errs.map(([t,v])=>`<div class="small" style="color:var(--unpaid);margin-bottom:3px">${esc(TABLE_TR[t]||t)}: ${esc(v.hata)}</div>`).join("")}

  m.querySelector("#fdone").onclick=closeModal;
}

const ROL_TR={yonetici:"Yönetici",sakin:"Sakin",gorevli:"Görevli"};

  try{ siteler=await rpc("admin_site_listesi")||[]; }catch(e){ toast(niceError(e),"err"); return; }
  const yoneticiSayisi=(profiller||[]).filter(x=>x.rol==="yonetici").length;

  const m=modal(`

      <div class="small faint" style="margin-top:4px">Başka siteye taşırsan daire bağı otomatik kopar; yeni siteden daire seçebilirsin.</div></div>
    ${sonYonetici?`<div class="small" style="color:var(--unpaid);margin:10px 0">Dikkat: bu hesap sitenin <b>tek yöneticisi</b>. Rolünü veya sitesini değiştirirsen bu sitede yönetici kalmaz.</div>`:""}
    <div id="hdx" style="margin-top:16px"></div>
    <button class="btn ghost full" id="hdc" style="margin-top:8px">Vazgeç</button>`);
  m.querySelector("#hdc").onclick=closeModal;

  const rolSel=m.querySelector("#hdRol"), siteSel=m.querySelector("#hdSite"), daireSel=m.querySelector("#hdDaire");
  async function daireleriYukle(){
    daireSel.innerHTML=`<option value="">Yükleniyor…</option>`;
    const {data,error}=await sb.from("daireler").select("id,blok,no,sira").eq("site_id",siteSel.value).order("sira");
    if(error){ daireSel.innerHTML=`<option value="">(daireler okunamadı)</option>`; return; }
    const ayniSite=siteSel.value===mevcutSite;
    daireSel.innerHTML=`<option value="">— Daire yok —</option>`+
      (data||[]).map(d=>{
        const et=(d.blok?d.blok+"-":"")+d.no;
        const sec = ayniSite && p.daire_id===d.id ? "selected" : "";
        return `<option value="${d.id}" ${sec}>${esc(et)}</option>`;
      }).join("");
  }
  siteSel.onchange=daireleriYukle;
  await daireleriYukle();

  m.querySelector("#hdx").appendChild(guard(h(`<button class="btn brass full">Kaydet</button>`), async()=>{
    await rpc("admin_profil_tasi",{
      p_profil:p.id, p_site:siteSel.value, p_rol:rolSel.value,
      p_daire:daireSel.value||null
    });
    closeModal();
    toast(siteSel.value===mevcutSite ? "Hesap güncellendi ✓" : "Hesap taşındı ✓");
    if(refresh) refresh();
  }));
}

async function boot(){

    if(!session) return { act:"login" };
    const {data:prof}=await sb.from("profiller").select("rol,ad").eq("id",session.user.id).maybeSingle();
    if(!prof || (prof.rol !== "superadmin" && prof.rol !== "yonetici")) return { act:"denied" };
    return { act:"dash", prof };

  const res = await bootPromise;
  if(window.__admSplashFinish){

          <div class="small faint" style="margin-top:4px">SEO için yayınlanan yazılar. Markdown ile yazılır, sunucuda HTML'e dönüşür. Yayındakiler <b>/blog</b> ve <b>/y/&lt;adres&gt;</b> altında görünür.</div></div>
        <div class="row" style="gap:8px">
          <button class="btn brass sm" id="mkAi">Yapay zekâ ile üret</button>
          <button class="btn ghost sm" id="mkYeni">Yeni yazı</button>

        </div>
      </div>
      <div id="mkListe" style="display:none"></div>
    </div>

    <div class="between" style="margin-bottom:12px"><h2 style="font-size:20px">Siteler</h2><div class="small faint">${sites.length} kayıt</div></div>
    <div class="slist" id="slist"></div>
  </main>`;
  $("#lo").onclick=async()=>{await sb.auth.signOut();boot();};
  const accBtn=$("#accToggle"), accBox=$("#allAccs");
  let accYuklu=false;
  accBtn.onclick=async()=>{
    const acik = accBox.style.display!=="none";
    if(acik){ accBox.style.display="none"; accBtn.textContent="Göster"; return; }
    accBox.style.display=""; accBtn.textContent="Gizle";
    if(accYuklu) return;
    accBox.innerHTML=`<p class="small faint">Yükleniyor…</p>`;
    try{
      const hesaplar=await rpc("admin_tum_hesaplar")||[];
      accYuklu=true;
      if(!hesaplar.length){ accBox.innerHTML=`<p class="muted small">Hesap yok.</p>`; return; }
      const ROLTR={yonetici:"Yönetici",sakin:"Sakin",gorevli:"Görevli",superadmin:"Süper-admin"};
      accBox.innerHTML=`<div class="row wrap" style="gap:8px;margin-bottom:10px">
        <input class="inp" id="accQ" placeholder="İsim veya site ara…" style="flex:1;min-width:180px">
        <select class="inp" id="accRol" style="width:150px">
          <option value="">Tüm roller</option>
          <option value="yonetici">Yönetici</option>
          <option value="gorevli">Görevli</option>
          <option value="sakin">Sakin</option>
        </select></div><div id="accList"></div>`;
      const liste=$("#accList"), qIn=$("#accQ"), rolIn=$("#accRol");
      const ciz=()=>{
        const term=(qIn.value||"").toLocaleLowerCase("tr"), rolF=rolIn.value;
        const gor=hesaplar.filter(x=>{
          if(rolF && x.rol!==rolF) return false;
          if(!term) return true;
          return ((x.ad||"")+" "+(x.site_ad||"")).toLocaleLowerCase("tr").includes(term);
        });
        liste.innerHTML="";
        if(!gor.length){ liste.innerHTML=`<p class="muted small">Eşleşen hesap yok.</p>`; return; }
        gor.slice(0,200).forEach(x=>{
          const row=h(`<div class="list-item">
            <div><div style="font-weight:500">${esc(x.ad||"—")} <span class="faint small">${x.daire_et?"· "+esc(x.daire_et):""}</span></div>
              <div class="small muted">${ROLTR[x.rol]||esc(x.rol||"")} · ${esc(x.site_ad||"site yok")}</div></div>
            <button class="btn ghost sm" data-e ${x.rol==="superadmin"?"disabled":""}>Düzenle</button></div>`);
          row.querySelector("[data-e]").onclick=()=>hesapDuzenle(
            {id:x.id, ad:x.ad, rol:x.rol, daire_id:x.daire_id},
            x.site_id,
            hesaplar.filter(y=>y.site_id===x.site_id),
            ()=>{ accYuklu=false; accBox.style.display="none"; accBtn.textContent="Göster"; accBtn.click(); }
          );
          liste.appendChild(row);
        });
        if(gor.length>200) liste.appendChild(h(`<p class="small faint" style="margin-top:8px">${gor.length} sonuçtan ilk 200'ü gösteriliyor — aramayı daraltın.</p>`));
      };
      qIn.oninput=ciz; rolIn.onchange=ciz; ciz();
    }catch(e){
      accBox.innerHTML=`<p class="small" style="color:var(--unpaid)">${esc(niceError(e))}</p>
        <p class="small faint" style="margin-top:6px">Sunucu fonksiyonu eksikse admin_tum_hesaplar.sql dosyasını çalıştırın.</p>`;
    }
  };
  $("#csvTpl").onclick=csvTemplate;
  guard($("#csvExp"), csvExport);
  $("#csvImp").onclick=csvImportOpen;
  const sl=$("#slist");
  if(!sites.length){ sl.innerHTML=`<div class="card pad muted">Henüz site yok.</div>`; }
  sites.forEach(s=>{
    const sonHareket=new Date(s.son_hareket);
    const gunFarki=(Date.now()-sonHareket.getTime())/86400000;
    const churn=gunFarki>7;
    const durumTag=s.abonelik_durumu==="odeyen"?'<span class="tag paid">Ödeyen</span>':s.abonelik_durumu==="pilot"?'<span class="tag brass">Pilot</span>':'<span class="tag unpaid">Pasif</span>';
    const row=h(`<div class="card pad srow">
      <div>
        <div class="row wrap" style="gap:10px"><span style="font-weight:600;font-size:15px">${esc(s.ad)}</span>${durumTag}
          ${churn?`<span class="churn small">● ${Math.floor(gunFarki)} gündür sessiz · ara</span>`:""}</div>
        <div class="metrics">
          <span>Tahsilat <b>${s.tahsilat_orani}%</b></span>
          <span>Kayıt <b>${s.kayit_yuzdesi}%</b></span>
          <span>Açık talep <b>${s.acik_talep}</b></span>
          <span>Daire <b>${s.daire_sayisi}</b></span>
          <span>Aylık <b>${money(s.aylik_bedel)}</b></span>
        </div>
      </div>
      <div class="faint" style="font-size:20px">›</div>
    </div>`);
    row.onclick=()=>siteDetay(s.id, ()=>renderDash(prof));
    sl.appendChild(row);
  });

  /* ————— Pano kartlarının aç/kapa düğmeleri —————
     Bu bağlantılar renderDash içinde olmak zorunda: kartların HTML'i burada
     çiziliyor. Daha önce siteDetay içindeydi ve hiç bağlanmıyordu. */
  panoKartlariniBagla();
}

/* Pano üzerindeki üç açılır bölümü çalıştırır.
   Her biri bağımsız: biri hata verse diğerleri çalışmaya devam eder. */
function panoKartlariniBagla(){
  const ac = (dugmeId, listeId, ciz) => {
    const btn = $("#"+dugmeId), kutu = $("#"+listeId);
    if(!btn || !kutu) return;
    let acik = false;
    btn.onclick = async () => {
      acik = !acik;
      kutu.style.display = acik ? "block" : "none";
      btn.textContent = acik ? "Gizle" : "Göster";
      if(acik){
        try { await ciz(); }
        catch(e){
          kutu.innerHTML = `<p class="small" style="color:var(--unpaid)">${esc(niceError(e))}</p>
            <p class="small faint" style="margin-top:6px">Fonksiyon eksikse <b>sql/konutpanel-kurulum.sql</b> dosyasını Supabase SQL Editor'de çalıştırın.</p>`;
        }
      }
    };
  };

  ac("dtToggle", "dtListe", () => demoTalepCiz());
  ac("lsToggle", "lsListe", () => lisansCiz());
  ac("mkToggle", "mkListe", () => makaleListesiCiz());

  const yeni = $("#mkYeni");
  if(yeni) yeni.onclick = () => makaleDuzenle(null);
  const ai = $("#mkAi");
  if(ai) ai.onclick = () => makaleAiModal();

  demoSayacTazele();
}

async function siteDetay(siteId, back){
  const [{data:site},{data:profiller},{data:daireler},{data:kodlar},borclular]=await Promise.all([
    sb.from("siteler").select("*").eq("id",siteId).maybeSingle(),
    sb.from("profiller").select("*").eq("site_id",siteId),
    sb.from("daireler").select("*").eq("site_id",siteId).order("sira"),
    sb.from("davet_kodlari").select("*").eq("site_id",siteId).eq("iptal",false).order("created_at",{ascending:false}),
    // borclular RPC uses caller's site; as superadmin we compute per-daire instead:
    Promise.resolve(null)
  ]);
  const daireMap={}; (daireler||[]).forEach(d=>daireMap[d.id]=(d.blok?d.blok+"-":"")+d.no);
  const bedel=(site.abonelik_daire_ucreti||0)*(daireler?.length||0);
  const root=$("#root");
  root.innerHTML=`<header class="top"><div class="topin">
    <button class="btn ghost sm" id="bk">‹ Siteler</button>
    <div class="serif" style="font-size:18px">${esc(site.ad)}</div><div style="width:70px"></div></div></header>
  <main>
    <div class="card pad" style="margin-bottom:16px">
      <div class="eyebrow">Abonelik (bana ödenen) — aidattan ayrıdır</div>
      <div class="row wrap" style="gap:16px;margin-top:10px;align-items:flex-end">
        <div class="field" style="margin:0"><label>Durum</label><select class="inp" id="ad" style="min-width:130px">
          <option value="pilot" ${site.abonelik_durumu==="pilot"?"selected":""}>Pilot</option>
          <option value="odeyen" ${site.abonelik_durumu==="odeyen"?"selected":""}>Ödeyen</option>
          <option value="pasif" ${site.abonelik_durumu==="pasif"?"selected":""}>Pasif</option></select></div>
        <div class="field" style="margin:0"><label>Daire başı (₺)</label><input class="inp num" id="au" value="${site.abonelik_daire_ucreti}" style="width:110px"></div>
        <div class="field" style="margin:0"><label>Hesaplanan aylık</label><div class="num" id="calc" style="font-size:24px">${money(bedel)}</div></div>
        <div id="asx"></div>
      </div></div>

    <div class="card pad" style="margin-bottom:16px">
      <div class="eyebrow" style="margin-bottom:6px">Aidat (siteye ödenen) — salt okunur</div>
      <div class="num" style="font-size:22px">${money(site.aidat_tutari)} <span class="faint" style="font-size:13px;font-family:Inter">/ ay / daire · ${daireler?.length||0} daire</span></div>
    </div>

    <div class="card pad" style="margin-bottom:16px"><div class="eyebrow" style="margin-bottom:6px">Hesaplar (${profiller?.length||0})</div><div id="accs"></div></div>
    <div class="card pad" style="margin-bottom:16px"><div class="eyebrow" style="margin-bottom:6px">Aktif davet kodları (${kodlar?.length||0})</div><div id="codes"></div></div>

    <div class="card pad" style="margin-bottom:16px">
      <div class="eyebrow" style="margin-bottom:6px">Tüm veri · Excel</div>
      <p class="small muted" style="margin-bottom:12px">Bu sitenin bütün tablolarını (sakinler, daireler, talepler, ödemeler, duyurular, kasa, toplantılar…) tek Excel dosyasında indir, düzenle, geri yükle. Her tablo ayrı bir sekmedir. İçe aktarma <b>id ile eşleşir</b>; günceller veya ekler, <b>hiçbir satırı silmez</b>.</p>
      <div class="row wrap" style="gap:10px">
        <button class="btn ghost sm" id="fexp">Dışa aktar (.xlsx)</button>
        <button class="btn brass sm" id="fimp">İçe aktar (.xlsx)</button>
      </div>
    </div>

    <div class="dz"><div class="serif" style="font-size:18px;color:var(--unpaid);margin-bottom:6px">Tehlikeli alan</div>
      <p class="small" style="margin-bottom:12px">Siteyi ve tüm verisini kalıcı olarak sil. Onay için site adını yazman gerekir.</p>
      <button class="btn danger" id="del">Siteyi sil</button></div>
  </main>`;
  $("#bk").onclick=back;
  guard($("#fexp"), ()=>siteFullExport(siteId, site.ad));
  $("#fimp").onclick=()=>siteFullImportOpen(siteId, site.ad);
  const au=$("#au"), calc=$("#calc"), adSel=$("#ad");
  const recalc=()=>calc.textContent=money((+au.value||0)*(daireler?.length||0));
  au.oninput=recalc;
  $("#asx").appendChild(guard(h(`<button class="btn brass sm">Kaydet</button>`),async()=>{
    await rpc("admin_abonelik_guncelle",{p_site:siteId,p_durum:adSel.value,p_ucret:+au.value||0});
    toast("Abonelik güncellendi ✓");
  }));

  const accs=$("#accs");
  if(!profiller?.length){ accs.innerHTML=`<p class="muted small">Hesap yok.</p>`; }
  (profiller||[]).forEach(p=>{
    const row=h(`<div class="list-item">
      <div><div style="font-weight:500">${esc(p.ad||"—")} <span class="faint small">${p.daire_id?"· "+esc(daireMap[p.daire_id]||""):""}</span></div>
        <div class="small muted">${({yonetici:"Yönetici",sakin:"Sakin",gorevli:"Görevli",superadmin:"Süper-admin"}[p.rol])||esc(p.rol||"")}</div></div>
      <button class="btn ghost sm" data-e ${p.rol==="superadmin"?"disabled":""}>Düzenle</button></div>`);
    row.querySelector("[data-e]").onclick=()=>hesapDuzenle(p, siteId, profiller, ()=>siteDetay(siteId,back));
    accs.appendChild(row);
  });

  const codes=$("#codes");

  if(!kodlar?.length){ codes.innerHTML=`<p class="muted small">Aktif kod yok.</p>`; }
  (kodlar||[]).forEach(k=>{
    const row=h(`<div class="list-item">
      <div><div class="num" style="font-size:18px;letter-spacing:2px">${k.kod}</div>
        <div class="small muted">${k.rol}${k.ad?" · "+esc(k.ad):""} ${k.kullanildi?"· kullanıldı":"· bekliyor"}</div></div>
      <button class="btn ghost sm" data-x>İptal</button></div>`);
    row.querySelector("[data-x]").onclick=async()=>{ try{ await rpc("admin_kod_iptal",{p_kod:k.id}); toast("İptal edildi"); siteDetay(siteId,back);}catch(e){toast(niceError(e),"err");} };
    codes.appendChild(row);
  });

  $("#del").onclick=()=>{
    const m=modal(`<div class="serif" style="font-size:22px;color:var(--unpaid);margin-bottom:8px">Siteyi sil</div>
      <p class="small muted" style="margin-bottom:14px">Bu işlem geri alınamaz. Onaylamak için site adını birebir yaz: <b>${esc(site.ad)}</b></p>
      <div class="field"><input class="inp" id="onay" placeholder="${esc(site.ad)}"></div>
      <div id="dx"></div><button class="btn ghost full" id="cx" style="margin-top:8px">Vazgeç</button>`);
    m.querySelector("#cx").onclick=closeModal;
    m.querySelector("#dx").appendChild(guard(h(`<button class="btn danger full">Kalıcı olarak sil</button>`),async()=>{
      await rpc("admin_site_sil",{p_site:siteId,p_onay_ad:m.querySelector("#onay").value.trim()});
      closeModal(); toast("Site silindi"); back();
    }));
  };
}


/* =============================================================================
   MAKALE (BLOG) YÖNETİMİ
   - İçerik Markdown olarak saklanır; HTML'e sunucuda çevrilir.
   - Ekrana basılan her metin esc() ile kaçışlanır (XSS koruması).
   ========================================================================== */

function mkTarih(t){
  if(!t) return "—";
  try{ return new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"}); }
  catch(e){ return "—"; }
}

async function makaleListesiCiz(arama){
  const kutu=$("#mkListe");
  kutu.innerHTML=`<div class="center" style="padding:20px"><span class="spin"></span></div>`;
  let liste=[];
  try{ liste=await rpc("admin_makale_listesi",{p_arama:arama||null,p_limit:200})||[]; }
  catch(e){
    kutu.innerHTML=`<p class="small" style="color:var(--unpaid)">${esc(niceError(e))}</p>
      <p class="small faint" style="margin-top:6px">Sunucu fonksiyonu eksikse <b>sql/konutpanel-blog.sql</b> dosyasını Supabase SQL Editor'de çalıştırın.</p>`;
    return;
  }

  const ust=h(`<div class="row" style="gap:8px;margin-bottom:12px">
    <input class="inp" id="mkAra" placeholder="Başlık veya adreste ara…" style="flex:1">
    <button class="btn ghost sm" id="mkSitemap">Site haritasını yenile</button></div>`);
  kutu.innerHTML=""; kutu.appendChild(ust);
  let zaman;
  ust.querySelector("#mkAra").value=arama||"";
  ust.querySelector("#mkAra").oninput=(e)=>{
    clearTimeout(zaman);
    const v=e.target.value.trim();
    zaman=setTimeout(()=>makaleListesiCiz(v||null),350);
  };
  ust.querySelector("#mkSitemap").onclick=()=>{
    toast("Site haritası her istekte otomatik üretilir: /sitemap.xml");
  };

  if(!liste.length){
    kutu.appendChild(h(`<p class="muted small">Henüz yazı yok. “Yeni yazı” ile başlayın.</p>`));
    return;
  }

  liste.forEach(m=>{
    const row=h(`<div class="list-item">
      <div style="min-width:0">
        <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.baslik)}</div>
        <div class="small muted">/y/${esc(m.slug)} · ${mkTarih(m.yayin_tarihi)} · ${m.goruntulenme||0} okunma
          ${m.yayinda?'<span style="color:var(--ok-tx)">· yayında</span>':'<span style="color:var(--wa-tx)">· taslak</span>'}</div>
      </div>
      <div class="row" style="gap:6px;flex:0 0 auto">
        <button class="btn ghost sm" data-y>${m.yayinda?"Yayından al":"Yayınla"}</button>
        <button class="btn ghost sm" data-d>Düzenle</button>
        <button class="btn ghost sm" data-x style="color:var(--unpaid)">Sil</button>
      </div></div>`);
    row.querySelector("[data-d]").onclick=()=>makaleDuzenle(m.id);
    row.querySelector("[data-y]").onclick=async()=>{
      try{ await rpc("admin_makale_yayin",{p_id:m.id,p_yayinda:!m.yayinda});
        toast(m.yayinda?"Yayından alındı":"Yayınlandı ✓"); makaleListesiCiz(arama);
      }catch(e){ toast(niceError(e),"err"); }
    };
    row.querySelector("[data-x]").onclick=()=>{
      const mo=modal(`<div class="serif" style="font-size:20px;color:var(--unpaid);margin-bottom:8px">Yazıyı sil</div>
        <p class="small muted" style="margin-bottom:14px">“${esc(m.baslik)}” kalıcı olarak silinecek.</p>
        <div id="mx"></div><button class="btn ghost full" id="mc" style="margin-top:8px">Vazgeç</button>`);
      mo.querySelector("#mc").onclick=closeModal;
      mo.querySelector("#mx").appendChild(guard(h(`<button class="btn danger full">Sil</button>`),async()=>{
        await rpc("admin_makale_sil",{p_id:m.id});
        closeModal(); toast("Silindi"); makaleListesiCiz(arama);
      }));
    };
    kutu.appendChild(row);
  });
}

async function makaleDuzenle(id){
  let v={baslik:"",slug:"",ozet:"",icerik:"",kapak_url:"",etiketler:[],
         meta_baslik:"",meta_aciklama:"",yayinda:false};
  if(id){
    try{ v=await rpc("admin_makale_getir",{p_id:id})||v; }
    catch(e){ return toast(niceError(e),"err"); }
  }

  const mo=modal(`
    <div class="serif" style="font-size:22px;margin-bottom:4px">${id?"Yazıyı düzenle":"Yeni yazı"}</div>
    <p class="small faint" style="margin-bottom:16px">İçerik <b>Markdown</b> ile yazılır: ## başlık, **kalın**, - madde, [bağlantı](adres). HTML etiketi yazmayın, güvenlik için yok sayılır.</p>

    <div class="field"><label>Başlık</label>
      <input class="inp" id="mB" maxlength="200" value="${esc(v.baslik||"")}"></div>

    <div class="field"><label>Adres (boş bırakırsanız başlıktan üretilir)</label>
      <input class="inp" id="mS" maxlength="120" placeholder="site-aidat-hesaplama" value="${esc(v.slug||"")}"></div>

    <div class="field"><label>Özet · arama sonucunda görünür (150-160 karakter ideal)</label>
      <textarea class="inp" id="mO" rows="2" maxlength="300">${esc(v.ozet||"")}</textarea>
      <div class="small faint" id="mOsay" style="margin-top:4px"></div></div>

    <div class="field"><label>İçerik (Markdown)</label>
      <textarea class="inp" id="mI" rows="14" style="font-family:ui-monospace,monospace;font-size:13.5px;line-height:1.6">${esc(v.icerik||"")}</textarea>
      <div class="small faint" id="mIsay" style="margin-top:4px"></div></div>

    <div class="field"><label>Etiketler (virgülle ayırın)</label>
      <input class="inp" id="mE" placeholder="aidat, kat mülkiyeti, yönetim" value="${esc((v.etiketler||[]).join(", "))}"></div>

    <div class="field"><label>Kapak görseli adresi (isteğe bağlı)</label>
      <input class="inp" id="mK" placeholder="https://…" value="${esc(v.kapak_url||"")}"></div>

    <details style="margin-bottom:14px">
      <summary class="small" style="cursor:pointer;padding:8px 0">Gelişmiş SEO alanları</summary>
      <div class="field"><label>Meta başlık (boşsa yazının başlığı kullanılır)</label>
        <input class="inp" id="mMB" maxlength="120" value="${esc(v.meta_baslik||"")}"></div>
      <div class="field"><label>Meta açıklama (boşsa özet kullanılır)</label>
        <input class="inp" id="mMA" maxlength="200" value="${esc(v.meta_aciklama||"")}"></div>
    </details>

    <label class="row" style="gap:10px;align-items:center;margin-bottom:16px;cursor:pointer">
      <input type="checkbox" id="mY" ${v.yayinda?"checked":""} style="width:18px;height:18px">
      <span class="small">Yayında</span></label>

    <div id="mSave"></div>
    <button class="btn ghost full" id="mCancel" style="margin-top:8px">Vazgeç</button>
  `);
  mo.style.maxWidth="720px";

  const say=()=>{
    const o=mo.querySelector("#mO").value.length;
    const i=mo.querySelector("#mI").value;
    const kel=i.split(/\s+/).filter(Boolean).length;
    mo.querySelector("#mOsay").textContent=`${o} karakter${o>0&&(o<120||o>165)?" · 150-160 arası ideal":""}`;
    mo.querySelector("#mIsay").textContent=`${kel} kelime · ~${Math.max(1,Math.round(kel/200))} dk okuma${kel<300?" · SEO için 600+ kelime önerilir":""}`;
  };
  mo.querySelector("#mO").oninput=say;
  mo.querySelector("#mI").oninput=say;
  say();

  mo.querySelector("#mCancel").onclick=closeModal;
  mo.querySelector("#mSave").appendChild(guard(h(`<button class="btn brass full">Kaydet</button>`),async()=>{
    const baslik=mo.querySelector("#mB").value.trim();
    if(baslik.length<3) throw new Error("Başlık en az 3 karakter olmalı");
    const etk=mo.querySelector("#mE").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,10);
    const yeni=await rpc("admin_makale_kaydet",{
      p_id:id||null,
      p_baslik:baslik,
      p_slug:mo.querySelector("#mS").value.trim()||null,
      p_ozet:mo.querySelector("#mO").value.trim()||null,
      p_icerik:mo.querySelector("#mI").value,
      p_kapak_url:mo.querySelector("#mK").value.trim()||null,

      p_meta_aciklama:mo.querySelector("#mMA").value.trim()||null,

    });

    toast(id?"Güncellendi ✓":"Yazı eklendi ✓");
    makaleListesiCiz();
  }));
}

      <p class="small faint" style="margin-top:6px">Fonksiyon yoksa <b>sql/konutpanel-kurulum.sql</b> dosyasını çalıştırın.</p>`;

  }

/* =============================================================================
   LİSANS YÖNETİMİ
   ========================================================================== */
const LS_DURUM={deneme:["wa","Deneme"],aktif:["ok","Aktif"],
  askida:["unpaid","Askıda"],iptal:["unpaid","İptal"]};
const LS_PAKET={demo:"Demo",aylik:"Aylık",yillik:"Yıllık"};

async function lisansCiz(){
  const kutu=$("#lsListe");
  kutu.innerHTML=`<div class="center" style="padding:20px"><span class="spin"></span></div>`;
  let liste=[];
  try{ liste=await rpc("admin_lisans_listesi")||[]; }
  catch(e){
    kutu.innerHTML=`<p class="small" style="color:var(--unpaid)">${esc(niceError(e))}</p>
      <p class="small faint" style="margin-top:6px">Fonksiyon yoksa <b>sql/konutpanel-kurulum.sql</b> dosyasını çalıştırın.</p>`;
    return;
  }
  kutu.innerHTML="";
  if(!liste.length){ kutu.innerHTML=`<p class="muted small">Site yok.</p>`; return; }

  const sorunlu=liste.filter(x=>!x.gecerli).length;
  const yaklasan=liste.filter(x=>x.gecerli&&x.kalan_gun!=null&&x.kalan_gun<=7).length;
  kutu.appendChild(h(`<div class="small faint" style="margin-bottom:12px">
    ${liste.length} site · ${sorunlu?`<b style="color:var(--unpaid)">${sorunlu} okunur modda</b>`:"hepsi aktif"}${yaklasan?` · ${yaklasan} sitenin süresi bir haftadan az`:""}</div>`));

  liste.forEach(x=>{
    const [dc,dl]=LS_DURUM[x.durum]||["mutb",x.durum];
    const row=h(`<div class="list-item">
      <div style="min-width:0">
        <div style="font-weight:500">${esc(x.site_ad)} <span class="badge ${dc}">${dl}</span>
          ${x.gecerli?"":`<span class="badge unpaid">okunur mod</span>`}</div>
        <div class="small muted">${x.daire_sayisi} daire · ${esc(LS_PAKET[x.paket]||x.paket||"—")}
          ${x.bitis?` · bitiş ${new Date(x.bitis).toLocaleDateString("tr-TR")}`:" · süresiz"}
          ${x.kalan_gun!=null?(x.kalan_gun<0?` · <span style="color:var(--unpaid)">${Math.abs(x.kalan_gun)} gün geçti</span>`:` · ${x.kalan_gun} gün kaldı`):""}</div>
        ${x.notu?`<div class="small faint" style="margin-top:3px">${esc(x.notu)}</div>`:""}
      </div>
      <div class="row" style="gap:6px;flex:0 0 auto"><button class="btn ghost sm" data-l>Düzenle</button></div></div>`);
    row.querySelector("[data-l]").onclick=()=>lisansModal(x,lisansCiz);
    kutu.appendChild(row);
  });

function lisansModal(x,refresh){
  const bugun=new Date();
  const iso=(d)=>d.toISOString().slice(0,10);
  const mo=modal(`<div class="serif" style="font-size:20px;margin-bottom:4px">${esc(x.site_ad)}</div>
    <div class="small faint" style="margin-bottom:16px">${x.daire_sayisi} daire</div>
    <div class="field"><label>Durum</label>
      <select class="inp" id="l1">${Object.entries(LS_DURUM).map(([k,v])=>`<option value="${k}" ${x.durum===k?"selected":""}>${v[1]}</option>`).join("")}</select></div>
    <div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>Paket</label>
        <select class="inp" id="l2">${Object.entries(LS_PAKET).map(([k,v])=>`<option value="${k}" ${x.paket===k?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field" style="flex:1"><label>Bitiş tarihi</label>
        <input class="inp" id="l3" type="date" value="${x.bitis||""}"></div></div>
    <div class="row" style="gap:6px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn ghost sm" data-ekle="14">+14 gün</button>
      <button class="btn ghost sm" data-ekle="30">+1 ay</button>
      <button class="btn ghost sm" data-ekle="365">+1 yıl</button>
      <button class="btn ghost sm" data-suresiz>Süresiz</button></div>
    <div class="field"><label>Not</label>
      <textarea class="inp" id="l4" rows="2" maxlength="500" placeholder="Ödeme tarihi, fatura no, özel anlaşma">${esc(x.notu||"")}</textarea></div>
    <div id="l5"></div>
    <button class="btn ghost full" id="l6" style="margin-top:8px">Vazgeç</button>`);

  mo.querySelectorAll("[data-ekle]").forEach(b=>b.onclick=()=>{
    const g=parseInt(b.dataset.ekle,10);
    const bas=mo.querySelector("#l3").value ? new Date(mo.querySelector("#l3").value) : bugun;
    const yeni=new Date(Math.max(bas.getTime(),bugun.getTime()));
    yeni.setDate(yeni.getDate()+g);
    mo.querySelector("#l3").value=iso(yeni);
    if(mo.querySelector("#l1").value!=="aktif") mo.querySelector("#l1").value="aktif";
  });
  mo.querySelector("[data-suresiz]").onclick=()=>{ mo.querySelector("#l3").value=""; };
  mo.querySelector("#l6").onclick=closeModal;
  mo.querySelector("#l5").appendChild(guard(h(`<button class="btn brass full">Kaydet</button>`),async()=>{
    await rpc("admin_lisans_guncelle",{p_site_id:x.site_id,
      p_durum:mo.querySelector("#l1").value,
      p_bitis:mo.querySelector("#l3").value||null,
      p_paket:mo.querySelector("#l2").value,
      p_not:mo.querySelector("#l4").value.trim()||null});
    closeModal(); toast("Lisans güncellendi ✓"); refresh();
  }));
}


/* Şifre alanlarına göz düğmesi ekler. Düğmeye basılı tutulduğu sürece değil,
   tıklandığında kalıcı olarak açar/kapatır — telefonda tek elle kullanılabilsin. */
const GOZ_ACIK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const GOZ_KAPALI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 7 10 7a17 17 0 0 1-2.7 3.5M6.6 6.7A16.6 16.6 0 0 0 2 13s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

function gozEkle(kap){
  (kap||document).querySelectorAll('input[type="password"]').forEach(inp=>{
    if(inp.dataset.gozlu) return;
    inp.dataset.gozlu="1";
    const sar=document.createElement("div");
    sar.className="sifre-kutu";
    inp.parentNode.insertBefore(sar,inp);
    sar.appendChild(inp);
    const b=document.createElement("button");
    b.type="button"; b.className="goz"; b.innerHTML=GOZ_KAPALI;
    b.setAttribute("aria-label","Şifreyi göster");
    b.setAttribute("tabindex","-1");
    b.onclick=()=>{
      const acik = inp.type==="text";
      inp.type = acik ? "password" : "text";
      b.innerHTML = acik ? GOZ_KAPALI : GOZ_ACIK;
      b.setAttribute("aria-label", acik ? "Şifreyi göster" : "Şifreyi gizle");
      inp.focus();
    };
    sar.appendChild(b);
  });
}

/* Ekran her değiştiğinde yeni şifre alanları da yakalansın */
if(typeof MutationObserver!=="undefined"){
  new MutationObserver(()=>gozEkle()).observe(document.documentElement,{childList:true,subtree:true});
}
document.addEventListener("DOMContentLoaded",()=>gozEkle());
setTimeout(()=>gozEkle(),300);


/* =============================================================================
   YAPAY ZEKÂ İLE MAKALE ÜRETİMİ
   Anahtar tarayıcıda değil — istek Netlify Function üzerinden gider.
   Üretilen yazı her zaman TASLAK olarak kaydedilir; okunmadan yayınlanmaz.
   ========================================================================== */
function makaleAiModal(){
  const mo=modal(`
    <div class="serif" style="font-size:20px;margin-bottom:4px">Yapay zekâ ile makale üret</div>
    <div class="small faint" style="margin-bottom:18px">Üretilen yazı taslak olarak kaydedilir. Okuyup düzenledikten sonra yayınlarsınız.</div>

    <div class="row" style="gap:8px;margin-bottom:14px">
      <button type="button" class="btn brass sm" id="aiModManuel" style="flex:1">Konuyu ben yazayım</button>
      <button type="button" class="btn ghost sm" id="aiModOto" style="flex:1">Konuyu AI seçsin (SEO)</button>
    </div>

    <div id="aiManuelAlan">
      <div class="field"><label>Konu</label>
        <input class="inp" id="aiKonu" maxlength="200"
          placeholder="Örn. Apartman aidatı nasıl hesaplanır?"></div>

      <div class="field"><label>Odak anahtar kelime</label>
        <input class="inp" id="aiKelime" maxlength="80" placeholder="Örn. aidat hesaplama">
        <div class="small faint" style="margin-top:5px">Google'da hangi aramada çıkmasını istiyorsunuz?</div></div>
    </div>

    <div id="aiOtoAlan" style="display:none;margin-bottom:14px">
      <div class="small" style="background:var(--brass-soft);border-radius:var(--r-sm);padding:11px 13px;line-height:1.6">
        Yapay zekâ, sitedeki mevcut makale <b>başlıklarını</b> okuyup (içerikleri değil)
        onlardan farklı, Türkiye'de site/apartman yönetimi aramalarında üst sıraya
        çıkma ihtimali yüksek, dar ve spesifik bir konu seçecek. Hangi konuyu
        seçtiği üretim bittiğinde gösterilecek.
      </div>
    </div>

    <div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>Uzunluk</label>
        <select class="inp" id="aiUzun">
          <option value="kisa">Kısa · ~600 kelime</option>
          <option value="orta" selected>Orta · ~1000 kelime</option>
          <option value="uzun">Uzun · ~1400 kelime</option>
        </select></div>
      <div class="field" style="flex:1"><label>Üslup</label>
        <select class="inp" id="aiTon">
          <option value="bilgilendirici">Bilgilendirici</option>
          <option value="rehber">Adım adım rehber</option>
          <option value="soru_cevap">Soru - cevap</option>
        </select></div>
    </div>

    <div class="small faint" style="margin-bottom:14px;line-height:1.6">
      Yapay zekâ hata yapabilir. Kanun maddesi, oran ve rakamları
      yayınlamadan önce mutlaka kontrol edin.
    </div>

    <div id="aiDurum" style="display:none;margin-bottom:12px"></div>
    <div id="aiSv"></div>
    <button class="btn ghost full" id="aiCx" style="margin-top:8px">Vazgeç</button>
  `);
  mo.querySelector("#aiCx").onclick=closeModal;

  /* İki mod: konuyu kendin yaz / AI seçsin. Buton görünümüyle değişir,
     üretim çağrısında konu alanı boş gönderilirse backend otomatik moda geçer. */
  let otoMod=false;
  const btnManuel=mo.querySelector("#aiModManuel"), btnOto=mo.querySelector("#aiModOto");
  const alanManuel=mo.querySelector("#aiManuelAlan"), alanOto=mo.querySelector("#aiOtoAlan");
  function modAyarla(oto){
    otoMod=oto;
    btnManuel.classList.toggle("brass",!oto);
    btnManuel.classList.toggle("ghost",oto);
    btnOto.classList.toggle("brass",oto);
    btnOto.classList.toggle("ghost",!oto);
    alanManuel.style.display=oto?"none":"block";
    alanOto.style.display=oto?"block":"none";
  }
  btnManuel.onclick=()=>modAyarla(false);
  btnOto.onclick=()=>modAyarla(true);

  mo.querySelector("#aiSv").appendChild(guard(h(`<button class="btn brass full">Üret</button>`),async()=>{
    const konu = otoMod ? "" : mo.querySelector("#aiKonu").value.trim();
    if(!otoMod && konu.length<5) throw new Error("Konuyu biraz daha açık yazın");

    const durum=mo.querySelector("#aiDurum");
    durum.style.display="block";
    durum.innerHTML=`<div class="row" style="gap:10px;align-items:center">
      <span class="spin"></span>
      <span class="small">${otoMod?"Uygun konu aranıyor ve makale yazılıyor":"Makale yazılıyor"}… bu 20-40 saniye sürebilir.</span></div>`;

    const {data:{session}}=await sb.auth.getSession();
    const y=await fetch("/api/makale-uret",{
      method:"POST",
      headers:{ "Content-Type":"application/json",
                Authorization:"Bearer "+(session?.access_token||"") },
      body:JSON.stringify({
        konu,
        anahtar: otoMod ? null : (mo.querySelector("#aiKelime").value.trim()||null),
        uzunluk: mo.querySelector("#aiUzun").value,
        ton:     mo.querySelector("#aiTon").value })
    });

    const j=await y.json().catch(()=>({}));
    durum.style.display="none";
    if(!y.ok) {
      const detay = [j.hata, j.ipucu || j.ayrinti].filter(Boolean).join(" — ");
      throw new Error(detay || "Üretilemedi");
    }

    closeModal();
    toast(j.otomatik_konu
      ? `Konu AI tarafından seçildi: "${j.otomatik_konu}" · ${j.kelime||"?"} kelime`
      : `Taslak hazır · ${j.kelime||"?"} kelime`);
    
    // Blog listesini görünür yap ve tazele
    const mkKutu = $("#mkListe");
    const mkBtn = $("#mkToggle");
    if(mkKutu && mkBtn){
      mkKutu.style.display = "block";
      mkBtn.textContent = "Gizle";
    }
    if(typeof makaleListesiCiz==="function") await makaleListesiCiz();
    if(j.id && typeof makaleDuzenle==="function") makaleDuzenle(j.id);
  }));
}

    navigator.serviceWorker.register('/sw.js').catch(err => {
