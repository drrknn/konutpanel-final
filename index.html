        }
      };

      grid.appendChild(item);
    });
  }
}

function belgeModal(refresh){
  const mdl=modal(`<h2 style="font-size:19px;margin-bottom:14px">${t("b_yukle")}</h2>
    <div class="field"><label>Başlık</label><input class="inp" id="bb" placeholder="Örn. 2026 Yönetim Planı" maxlength="200"></div>
    <div class="row" style="gap:10px">
      <div class="field grow"><label>${t("b_kategori")}</label>
        <select class="inp" id="bk">${Object.entries(BELGE_KAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Açıklama <span class="faint">(${t("optional")})</span></label><input class="inp" id="ba" maxlength="300"></div>
    <div class="field"><label>${t("b_dosya")} <span class="faint">(en fazla 25 MB)</span></label>
      <input class="inp" id="bd" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip"></div>
    <label class="row" style="gap:10px;align-items:center;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="bh" style="width:18px;height:18px"><span class="small">${t("b_gizli")}</span></label>
    <div class="row" style="gap:10px"><div id="bs" class="grow"></div>
      <button class="btn ghost" id="bc">${t("cancel")}</button></div>`);
  mdl.querySelector("#bc").onclick=closeModal;
  mdl.querySelector("#bs").appendChild(guard(h(`<button class="btn full">${t("save")}</button>`),async()=>{
    const baslik=$("#bb").value.trim();
    if(baslik.length<2) throw new Error("Başlık girin");
    const f=$("#bd").files&&$("#bd").files[0];
    if(!f) throw new Error("Dosya seçin");
    if(f.size>25*1024*1024) throw new Error("Dosya 25 MB'ı aşamaz");

    const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
    const yol=`${S.site.id}/${crypto.randomUUID()}.${ext}`;
    const {error:ue}=await sb.storage.from("belgeler").upload(yol,f,{upsert:false});
    if(ue) throw ue;

    const {error:ie}=await sb.from("belgeler").insert({
      site_id:S.site.id, baslik, aciklama:$("#ba").value.trim()||null,
      kategori:$("#bk").value, dosya_yolu:yol, dosya_adi:f.name,
      dosya_boyut:f.size, mime:f.type||null,
      herkese_acik:!$("#bh").checked, yukleyen:S.user.id });
    if(ie){ await sb.storage.from("belgeler").remove([yol]); throw ie; }
    closeModal(); toast("Yüklendi ✓"); refresh();
  }));
}


/* ═══════════════════════════════════════════════════════════════
   ANKET VE OYLAMA
   Oylar ham hâlde okunamaz; sonuçlar yalnızca anket_sonuc RPC'siyle
   gelir. Gizli anketlerde kimin ne oy verdiği hiçbir yerde görünmez.
   ═══════════════════════════════════════════════════════════════ */
async function scrAnket(c){
  c.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  const {data,error}=await sb.from("anketler").select("*").eq("site_id",S.site.id)
    .order("created_at",{ascending:false});
  if(error){ c.innerHTML=`<div class="card pad"><p class="small" style="color:var(--no)">${esc(niceError(error))}</p></div>`; return; }
  const anketler=data||[];

  c.innerHTML=`<div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="small faint">${anketler.filter(a=>a.aktif&&(!a.bitis||new Date(a.bitis)>new Date())).length} açık anket</div>
      ${isYon()?`<button class="btn sm" id="anew">${I.plus} ${t("a_yeni")}</button>`:""}</div>
    <div class="note" style="margin-bottom:14px">Havuz saatleri, çatı onarımı, aidat artışı… Kararları toplantı beklemeden sorun. Oyunuzu anket kapanana kadar değiştirebilirsiniz.</div>
    <div id="al" class="kolon2"></div>`;
  if($("#anew")) $("#anew").onclick=()=>anketModal(()=>scrAnket(c));

  const al=$("#al");
  if(!anketler.length){ al.innerHTML=`<div class="card pad">${empty(t("a_bos"))}</div>`; return; }
  for(const a of anketler){ al.appendChild(await anketKart(a,()=>scrAnket(c))); }
}

async function anketKart(a,refresh){
  const bitti = !a.aktif || (a.bitis && new Date(a.bitis)<new Date());
  const kart=h(`<div class="card pad" style="margin-bottom:12px">
    <div class="between" style="align-items:flex-start;gap:10px;margin-bottom:6px">
      <div style="min-width:0">
        <div style="font-weight:600;font-size:16px">${esc(a.baslik)}</div>
        ${a.aciklama?`<div class="small muted" style="margin-top:3px">${esc(a.aciklama)}</div>`:""}
      </div>
      <span class="badge ${bitti?"mutb":"ok"}">${bitti?(a.aktif?t("a_suresi_doldu"):t("a_kapali")):"Açık"}</span>
    </div>
    <div class="small faint" style="margin-bottom:12px">
      ${a.gizli?"Gizli oylama · ":""}${a.coklu_secim?"Çoklu seçim · ":"Tek seçim · "}${a.bitis?"Bitiş: "+fmtDateTime(a.bitis):"Süresiz"}</div>
    <div id="ak-${a.id}"><div class="loading" style="min-height:60px"><span class="spin"></span></div></div>
    <div class="vact" id="ay-${a.id}" style="justify-content:flex-start;margin-top:12px"></div></div>`);

  setTimeout(async()=>{
    const govde=kart.querySelector(`#ak-${a.id}`);
    const eylem=kart.querySelector(`#ay-${a.id}`);
    let sonuc;
    try{ const r=await sb.rpc("anket_sonuc",{p_anket_id:a.id}); if(r.error) throw r.error; sonuc=r.data||[]; }
    catch(e){ govde.innerHTML=`<p class="small" style="color:var(--no)">${esc(niceError(e))}</p>`; return; }

    const toplam=sonuc.reduce((x,s)=>x+Number(s.oy_sayisi||0),0);
    const oyVerdim=sonuc.some(s=>s.benim_oyum);
    let secili=new Set(sonuc.filter(s=>s.benim_oyum).map(s=>s.secenek_id));
    let duzenleme=!oyVerdim && !bitti;

    function ciz(){
      if(duzenleme){
        govde.innerHTML=sonuc.map(s=>`
          <label class="row" style="gap:10px;align-items:center;padding:9px 0;cursor:pointer;border-bottom:1px solid var(--line)">
            <input type="${a.coklu_secim?"checkbox":"radio"}" name="an-${a.id}" value="${s.secenek_id}"
              ${secili.has(s.secenek_id)?"checked":""} style="width:18px;height:18px;flex:none">
            <span>${esc(s.metin)}</span></label>`).join("");
        govde.querySelectorAll("input").forEach(i=>i.onchange=()=>{
          if(!a.coklu_secim) secili=new Set([i.value]);
          else { i.checked?secili.add(i.value):secili.delete(i.value); }
        });
      } else {
        govde.innerHTML=sonuc.map(s=>{
          const n=Number(s.oy_sayisi||0);
          const yuzde=toplam?Math.round(n/toplam*100):0;
          return `<div style="margin-bottom:10px">
            <div class="between" style="font-size:14px;margin-bottom:4px">
              <span>${esc(s.metin)}${s.benim_oyum?` <span class="badge ok" style="margin-left:4px">${t("a_oyum")}</span>`:""}</span>
              <span class="m faint">${n} · %${yuzde}</span></div>
            <div class="prog"><i style="width:${yuzde}%;background:var(--acc)"></i></div></div>`;
        }).join("")+`<div class="small faint" style="margin-top:8px">${toplam} ${t("a_toplam")}</div>`;
      }

      eylem.innerHTML="";
      if(duzenleme){
        eylem.appendChild(guard(h(`<button class="btn sm">${t("a_oyver")}</button>`),async()=>{
          if(!secili.size) throw new Error("Bir seçenek işaretleyin");
          const r=await sb.rpc("anket_oy_ver",{p_anket_id:a.id,p_secenekler:[...secili]});
          if(r.error) throw r.error;
          toast("Oyunuz kaydedildi ✓"); refresh();
        }));
        if(oyVerdim){
          const v=h(`<button class="btn sm ghost">${t("cancel")}</button>`);
          v.onclick=()=>{ duzenleme=false; ciz(); }; eylem.appendChild(v);
        }
      } else if(!bitti){
        const d=h(`<button class="btn sm ghost">${oyVerdim?t("a_degistir"):t("a_oyver")}</button>`);
        d.onclick=()=>{ duzenleme=true; ciz(); }; eylem.appendChild(d);
      }

      if(!a.gizli && toplam>0){
        const k=h(`<button class="btn sm ghost">${t("a_kimler")}</button>`);
        k.onclick=async()=>{
          try{
            const r=await sb.rpc("anket_katilimcilar",{p_anket_id:a.id});
            if(r.error) throw r.error;
            modal(`<h2 style="font-size:19px;margin-bottom:12px">${t("a_kimler")}</h2>
              <div style="max-height:50vh;overflow:auto">${(r.data||[]).map(x=>
                `<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)">
                   <span>${esc(x.ad||"—")}</span>
                   <span class="small faint">${esc(x.secenek)} · ${fmtDate(x.zaman)}</span></div>`).join("")||empty()}</div>
              <button class="btn ghost full" style="margin-top:12px" onclick="document.getElementById('modalHost').innerHTML=''">${t("close")}</button>`);
          }catch(e){ toast(niceError(e),"err"); }
        };
        eylem.appendChild(k);
      }

      if(isYon()){
        const kapat=h(`<button class="btn sm ghost">${a.aktif?"Kapat":"Yeniden aç"}</button>`);
        kapat.onclick=async()=>{
          try{ const {error}=await sb.from("anketler").update({aktif:!a.aktif}).eq("id",a.id);
            if(error) throw error; toast("✓"); refresh();
          }catch(e){ toast(niceError(e),"err"); }
        };
        eylem.appendChild(kapat);
        const sil=h(`<button class="iconbtn">${I.trash}</button>`);
        sil.onclick=async()=>{
          if(!confirm("Anket ve bütün oylar silinsin mi?"))return;
          try{ const {error}=await sb.from("anketler").delete().eq("id",a.id);
            if(error) throw error; toast("Silindi"); refresh();
          }catch(e){ toast(niceError(e),"err"); }
        };
        eylem.appendChild(sil);
      }
    }
    ciz();
  },0);
  return kart;
}

  /* Dinamik seçenek satırları. Metin alanı yerine ayrı ayrı satırlar —
     telefonda satır başı yapmak zor ve hangi satırın seçenek olduğu
     görünmüyordu. */
  const SEC_MAX=20;
  const liste=mdl.querySelector("#secListe");

  function sayGuncelle(){
    const n=liste.children.length;
    mdl.querySelector("#secSay").textContent = n+" / "+SEC_MAX+" seçenek";
    mdl.querySelector("#secEkle").style.display = n>=SEC_MAX ? "none" : "";
    /* İki satır kalınca silme düğmeleri gizlenir; en az iki seçenek şart. */
    liste.querySelectorAll(".sec-sil").forEach(b=>b.style.visibility = n<=2 ? "hidden" : "visible");
  }

  function secEkle(deger, odakla){
    if(liste.children.length>=SEC_MAX) return;
    const sira=liste.children.length+1;
    const satir=h(`<div class="sec-satir">
      <input class="inp" maxlength="200" placeholder="${sira}. seçenek" value="${esc(deger||"")}">
      <button type="button" class="sec-sil" title="Bu seçeneği kaldır">
        ${SV('<path d="M18 6L6 18M6 6l12 12"/>')}</button></div>`);
    satir.querySelector(".sec-sil").onclick=()=>{ satir.remove(); sayGuncelle(); };
    satir.querySelector("input").addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault(); secEkle("", true); }
    });
    liste.appendChild(satir);
    sayGuncelle();
    if(odakla) satir.querySelector("input").focus();
  }

  secEkle(); secEkle();                       /* başlangıçta iki boş satır */
  mdl.querySelector("#secEkle").onclick=()=>secEkle("", true);
  mdl.querySelector("#asv").appendChild(guard(h(`<button class="btn full">${t("save")}</button>`),async()=>{
    const baslik=$("#ab").value.trim();
    if(baslik.length<3) throw new Error("Soru yazın");
    const secenekler=[...liste.querySelectorAll("input")]
      .map(i=>i.value.trim()).filter(Boolean);
    if(secenekler.length<2) throw new Error("En az iki seçenek yazın");
    if(new Set(secenekler.map(x=>x.toLocaleLowerCase("tr"))).size !== secenekler.length)
      throw new Error("Aynı seçenek birden fazla kez yazılmış");
    const bx=$("#ax").value;
    const r=await sb.rpc("anket_olustur",{
      p_baslik:baslik, p_aciklama:$("#aa").value.trim()||null,
      p_secenekler:secenekler, p_coklu:$("#ac").checked, p_gizli:$("#ag").checked,
      p_bitis:bx?new Date(bx).toISOString():null });
    if(r.error) throw r.error;
    closeModal(); toast("Anket açıldı ✓"); refresh();
  }));
}


/* ═══════════════════════════════════════════════════════════════
   ORTAK ALAN REZERVASYONU
   Çakışma engeli veritabanı seviyesindedir (EXCLUDE kısıtı);
   iki kişi aynı anda tıklasa bile ikinci kayıt reddedilir.
   ═══════════════════════════════════════════════════════════════ */
let REZ_ALAN=null, REZ_GUN=null;

/* Rezervasyon durumunu rozet olarak gösterir. Boş bırakılmıyor —
   sakin onaylandığını da görmek istiyor. */
function rezRozet(durum){
  const m={
    bekliyor:   ["wa",  "onay bekliyor"],
    onayli:     ["ok",  "onaylandı"],
    reddedildi: ["no",  "reddedildi"],
    iptal:      ["mutb","iptal edildi"]
  };
  const r=m[durum]; if(!r) return "";
  return ` · <span class="badge ${r[0]}">${r[1]}</span>`;
}

function ymd(d){ const x=new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function ss(d){ const x=new Date(d);
  return String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0"); }

function slotUret(alan,gun){
  const out=[];
  const [ah,am]=String(alan.acilis).split(":").map(Number);
  const [kh,km]=String(alan.kapanis).split(":").map(Number);
  const bas=new Date(gun+"T00:00:00"); bas.setHours(ah,am||0,0,0);
  const son=new Date(gun+"T00:00:00"); son.setHours(kh,km||0,0,0);
  let cur=new Date(bas);
  let kalkan=0;
  while(cur.getTime()+alan.slot_dk*60000<=son.getTime() && kalkan++<200){
    const bit=new Date(cur.getTime()+alan.slot_dk*60000);
    out.push({bas:new Date(cur),bit});
    cur=bit;
  }
  return out;
}

async function scrRezerve(c){
  c.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  const {data,error}=await sb.from("ortak_alanlar").select("*").eq("site_id",S.site.id).order("ad");
  if(error){ c.innerHTML=`<div class="card pad"><p class="small" style="color:var(--no)">${esc(niceError(error))}</p></div>`; return; }
  const alanlar=(data||[]).filter(a=>a.aktif||isYon());

  if(!alanlar.length){
    c.innerHTML=`<div class="card pad">${empty(t("r_bos"))}
      ${isYon()?`<div class="center" style="margin-top:14px"><button class="btn" id="anew2">${I.plus} ${t("r_alan_ekle")}</button></div>`:""}</div>`;
    if($("#anew2")) $("#anew2").onclick=()=>alanModal(null,()=>scrRezerve(c));
    return;
  }
  if(!REZ_ALAN||!alanlar.some(a=>a.id===REZ_ALAN)) REZ_ALAN=alanlar[0].id;
  if(!REZ_GUN) REZ_GUN=ymd(new Date());
  const alan=alanlar.find(a=>a.id===REZ_ALAN);

  c.innerHTML=`<div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="chips" id="raf">${alanlar.map(a=>
        `<button class="fchip ${REZ_ALAN===a.id?'on':''}" data-a="${a.id}">${esc(a.ad)}${a.aktif?"":" (kapalı)"}</button>`).join("")}</div>
      ${isYon()?`<div class="row" style="gap:8px">
        <button class="btn sm ghost" id="aedit">Alanı düzenle</button>
        <button class="btn sm" id="anew2">${I.plus} ${t("r_alan_ekle")}</button></div>`:""}</div>

    <div class="card pad" style="margin-bottom:14px">
      <div class="between" style="flex-wrap:wrap;gap:10px;margin-bottom:12px">
        <div>
          <div style="font-weight:600;font-size:16px">${esc(alan.ad)}</div>
          <div class="small faint">${String(alan.acilis).slice(0,5)} – ${String(alan.kapanis).slice(0,5)}${alan.onay_gerekir?" · yönetici onaylı":""} · <b>Kapasite: ${alan.kapasite||1} kişi / saat</b></div>
          ${alan.aciklama?`<div class="small muted" style="margin-top:6px;white-space:pre-wrap;max-width:640px">${esc(alan.aciklama)}</div>`:""}
        </div>
        <div class="row" style="gap:8px;align-items:center">
          <button class="iconbtn" id="gp">${SV('<path d="M15 6l-6 6 6 6"/>')}</button>
          <input class="inp" id="gd" type="date" value="${REZ_GUN}" style="width:158px">
          <button class="iconbtn" id="gn">${SV('<path d="M9 6l6 6-6 6"/>')}</button>
        </div></div>

      <div class="row wrap" style="gap:14px;margin-bottom:14px;padding:8px 12px;background:var(--card2);border-radius:10px;border:1px solid var(--line);font-size:12px">
        <span class="legend"><i style="background:var(--ok)"></i> ${LANG==="tr"?"Rezervasyonunuz Var (Yeşil)":"Your Booking"}</span>
        <span class="legend"><i style="background:var(--wa)"></i> ${LANG==="tr"?"Onay Bekliyor / Kısmi Dolu (Sarı)":"Pending / Partial"}</span>
        <span class="legend"><i style="background:var(--no)"></i> ${LANG==="tr"?"Tamamen Dolu / Kapalı (Kırmızı)":"Full / Closed"}</span>
        <span class="legend"><i style="background:var(--line)"></i> ${LANG==="tr"?"Boş / Müsait":"Available"}</span>
      </div>

      <div id="slots"><div class="loading" style="min-height:80px"><span class="spin"></span></div></div>
    </div>

    ${isYon()?`<div class="card pad" style="margin-bottom:14px" id="bekKart" hidden>
      <div class="between" style="margin-bottom:10px">
        <h2 style="font-size:16px">Onay bekleyen rezervasyonlar</h2>
        <span class="badge wa" id="bekSay"></span></div>
      <div id="bekListe"></div></div>`:""}
    <div class="card pad"><h2 style="font-size:16px;margin-bottom:10px">${t("r_benim_rez")}</h2><div id="myrez"></div></div>`;

  c.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{REZ_ALAN=b.dataset.a;scrRezerve(c);});
  if($("#anew2")) $("#anew2").onclick=()=>alanModal(null,()=>scrRezerve(c));
  if($("#aedit")) $("#aedit").onclick=()=>alanModal(alan,()=>scrRezerve(c));
  $("#gd").onchange=(e)=>{REZ_GUN=e.target.value;scrRezerve(c);};
  $("#gp").onclick=()=>{const d=new Date(REZ_GUN+"T12:00:00");d.setDate(d.getDate()-1);REZ_GUN=ymd(d);scrRezerve(c);};
  $("#gn").onclick=()=>{const d=new Date(REZ_GUN+"T12:00:00");d.setDate(d.getDate()+1);REZ_GUN=ymd(d);scrRezerve(c);};

  /* ——— gün görünümü ——— */
  const sl=$("#slots");
  try{
    const maxKapasite=Math.max(1, alan.kapasite||1);
    const [rRpc, rDirect]=await Promise.all([
      sb.rpc("rezervasyon_gun",{p_alan_id:alan.id,p_gun:REZ_GUN}),
      sb.from("rezervasyonlar")
        .select("id,profil_id,baslangic,bitis,durum,aciklama,profiller(ad,daire_id,daireler(kapi_no,blok))")
        .eq("alan_id",alan.id)
        .gte("baslangic",REZ_GUN+"T00:00:00")
        .lte("baslangic",REZ_GUN+"T23:59:59")
        .neq("durum","iptal")
        .neq("durum","reddedildi")
    ]);
    
    // Doğrudan tablodan tüm aktif/bekleyen rezervasyonları ve kişi sayılarını al
    const aktifRezervasyonlar=(rDirect.data||[]).map(rx=>{
      let kSayisi=1;
      if(rx.aciklama && rx.aciklama.includes("[kisi:")){
        const m=rx.aciklama.match(/\[kisi:(\d+)\]/);
        if(m) kSayisi=parseInt(m[1])||1;
      }
      const daireStr=rx.profiller?.daireler ? (rx.profiller.daireler.blok?rx.profiller.daireler.blok+"-":"")+rx.profiller.daireler.kapi_no : "";
      return {
        id: rx.id,
        profil_id: rx.profil_id,
        benim: rx.profil_id===S.user.id,
        baslangic: rx.baslangic,
        bitis: rx.bitis,
        durum: rx.durum,
        kisi_sayisi: kSayisi,
        ad: rx.profiller?.ad || (LANG==="tr"?"Sakin":"Resident"),
        daire: daireStr,
        aciklama: rx.aciklama
      };
    });

    const slotlar=slotUret(alan,REZ_GUN);
    if(!slotlar.length){ sl.innerHTML=`<p class="small faint">Bu alan için saat aralığı tanımlı değil.</p>`; return; }

    sl.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px" id="sg"></div>`;
    const sg=$("#sg");
    const simdi=Date.now();

    slotlar.forEach(s=>{
      const buSlottakiRezler=aktifRezervasyonlar.filter(d=>
        (d.durum==="onayli"||d.durum==="bekliyor") &&
        new Date(d.baslangic)<s.bit && new Date(d.bitis)>s.bas);

      // Toplam kullanılan ve bekleyen kişi sayısını hesapla
      let kullanilanKapasite=0;
      let bekleyenVar=false;
      let benimRez=null;

      buSlottakiRezler.forEach(r=>{
        kullanilanKapasite+=r.kisi_sayisi;
        if(r.durum==="bekliyor") bekleyenVar=true;
        if(r.benim) benimRez=r;
      });

      const kalanKapasite=Math.max(0, maxKapasite - kullanilanKapasite);
      const dolulukYuzdesi=Math.min(100, Math.round((kullanilanKapasite / maxKapasite) * 100));
      const gecmis=s.bit.getTime()<simdi;
      const dolu=kullanilanKapasite>=maxKapasite;

      let cls="btn sm ghost", metin=`${ss(s.bas)} – ${ss(s.bit)}`, alt="", tik=null;

      if(gecmis){
        alt="geçti";
      } else if(benimRez){
        // Kullanıcının rezervasyonu var
        const isMinePending=benimRez.durum==="bekliyor";
        cls=isMinePending ? "btn sm wa" : "btn sm ok";
        alt=`${isMinePending?"Onay Bekliyor":"Sizin"} · ${benimRez.kisi_sayisi} kişi`;
        tik=()=>{
          // Detay modalı veya iptal seçeneği aç
          rezSlotDetayModal(s, alan, maxKapasite, buSlottakiRezler, c);
        };
      } else if(dolu){
        // Tamamen dolu (kırmızı)
        cls="btn sm danger";
        alt=`Dolu (${kullanilanKapasite}/${maxKapasite})`;
        tik=()=>{
          rezSlotDetayModal(s, alan, maxKapasite, buSlottakiRezler, c);
        };
      } else if(kullanilanKapasite>0 || bekleyenVar){
        // Kısmi dolu veya onay bekleyen var (sarı)
        cls="btn sm wa";
        alt=`Kalan: ${kalanKapasite} kişi`;
        tik=()=>{
          rezervasyonYapModal(s, alan, maxKapasite, kalanKapasite, buSlottakiRezler, c);
        };
      } else {
        // Tamamen boş ve müsait (nötr)
        alt=`Müsait (${maxKapasite} kişi)`;
        tik=()=>{
          rezervasyonYapModal(s, alan, maxKapasite, kalanKapasite, buSlottakiRezler, c);
        };
      }

      const b=h(`<button class="${cls}" style="flex-direction:column;height:auto;padding:10px 8px;line-height:1.3;position:relative;overflow:hidden;border-radius:10px;text-align:center">
        <span style="font-weight:600;font-size:13px">${metin}</span>
        <span style="font-size:11px;margin-top:2px;font-weight:500">${esc(alt)}</span>
        ${maxKapasite>1 && !gecmis ? `
          <div style="width:100%;height:3px;background:rgba(0,0,0,0.15);margin-top:6px;border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${dolulukYuzdesi}%;background:currentColor;opacity:.85"></div>
          </div>
          <div style="font-size:10px;opacity:.8;margin-top:3px">${kullanilanKapasite}/${maxKapasite} kişi</div>` : ""}
      </button>`);
      if(tik) b.onclick=tik; else b.disabled=true;
      sg.appendChild(b);
    });
  }catch(e){ sl.innerHTML=`<p class="small" style="color:var(--no)">${esc(niceError(e))}</p>`; }

  /* ——— onay bekleyenler (yalnızca yönetici) ——— */
  if(isYon() && $("#bekKart")){
    try{
      const br=await sb.rpc("rezervasyon_bekleyenler");
      if(br.error) throw br.error;
      const bek=br.data||[];
      if(bek.length){
        $("#bekKart").hidden=false;
        $("#bekSay").textContent=bek.length;
        const bl=$("#bekListe"); bl.innerHTML="";
        bek.forEach(x=>{
          let kisiSay=1;
          let temizAciklama=x.aciklama||"";
          if(x.aciklama && x.aciklama.includes("[kisi:")){
            const m=x.aciklama.match(/\[kisi:(\d+)\]/);
            if(m) kisiSay=parseInt(m[1])||1;
            temizAciklama=x.aciklama.replace(/\[kisi:\d+\]\s*/,"");
          }
          const row=h(`<div class="vcard">
            <div class="vhead"><div class="grow" style="min-width:0">
              <div class="t1">${esc(x.alan_ad)} <span class="badge wa" style="font-size:11px;margin-left:4px">${kisiSay} Kişi</span></div>
              <div class="t2">${esc(x.kisi||"—")}${x.daire?" · "+esc(x.daire):""}</div>
              <div class="t2">${fmtDate(x.baslangic)} · ${ss(x.baslangic)} – ${ss(x.bitis)}</div>
              ${temizAciklama?`<div class="t2">Not: ${esc(temizAciklama)}</div>`:""}
            </div></div>
            <div class="vact" id="bk-${x.id}"></div></div>`);
          const a=row.querySelector(`#bk-${x.id}`);

          a.appendChild(guard(h(`<button class="btn sm ok">Onayla</button>`),async()=>{
            const r=await sb.rpc("rezervasyon_karar",{p_id:x.id,p_durum:"onayli",p_not:null});
            if(r.error) throw r.error;
            toast("Onaylandı ✓"); scrRezerve(c);
          }));

          const red=h(`<button class="btn sm ghost">Reddet</button>`);
          red.onclick=()=>{
            const m2=modal(`<h2 style="font-size:19px;margin-bottom:4px">Rezervasyonu reddet</h2>
              <p class="small mut" style="margin-bottom:14px">${esc(x.kisi||"")} · ${fmtDate(x.baslangic)} ${ss(x.baslangic)}</p>
              <div class="field"><label>Gerekçe <span class="faint">(sakine gösterilir)</span></label>
                <textarea class="inp" id="rdn" rows="3" maxlength="300" placeholder="Örn. O saatte bakım çalışması var"></textarea></div>
              <div id="rds"></div>
              <button class="btn ghost full" id="rdc" style="margin-top:8px">${t("cancel")}</button>`);
            m2.querySelector("#rdc").onclick=closeModal;
            m2.querySelector("#rds").appendChild(guard(h(`<button class="btn danger full">Reddet</button>`),async()=>{
              const r=await sb.rpc("rezervasyon_karar",{p_id:x.id,p_durum:"reddedildi",
                p_not:m2.querySelector("#rdn").value.trim()||null});
              if(r.error) throw r.error;
              closeModal(); toast("Reddedildi"); scrRezerve(c);
            }));
          };
          a.appendChild(red);
          bl.appendChild(row);
        });
      }
    }catch(e){ /* fonksiyon yoksa bölüm gizli kalır */ }
  }

  /* ——— kendi rezervasyonlarım ——— */
  const mr=$("#myrez");
  const {data:mine}=await sb.from("rezervasyonlar").select("*,ortak_alanlar(ad)")
    .eq("site_id",S.site.id).eq("profil_id",S.user.id).neq("durum","iptal")
    .gte("baslangic",new Date(Date.now()-7*86400000).toISOString())
    .order("baslangic");
  const liste=mine||[];
  if(!liste.length){ mr.innerHTML=empty("Yaklaşan rezervasyonunuz yok."); }
  else liste.forEach(x=>{
    const gecti=new Date(x.bitis)<new Date();
    let kisiSay=1;
    let temizAciklama=x.aciklama||"";
    if(x.aciklama && x.aciklama.includes("[kisi:")){
      const m=x.aciklama.match(/\[kisi:(\d+)\]/);
      if(m) kisiSay=parseInt(m[1])||1;
      temizAciklama=x.aciklama.replace(/\[kisi:\d+\]\s*/,"");
    }
    const row=h(`<div class="vcard">
      <div class="vhead">
        <div class="feed-dot" style="width:34px;height:34px;flex:none;background:var(--card2);color:var(--ink2)">${I.cal}</div>
        <div class="grow" style="min-width:0">
          <div class="t1">${esc((x.ortak_alanlar&&x.ortak_alanlar.ad)||"—")} <span class="badge ${x.durum==='onayli'?'ok':(x.durum==='bekliyor'?'wa':'mutb')}" style="font-size:11px;margin-left:4px">${kisiSay} Kişi</span></div>
          <div class="t2">${fmtDate(x.baslangic)} · ${ss(x.baslangic)} – ${ss(x.bitis)}${rezRozet(x.durum)}${gecti&&x.durum==="onayli"?" · geçti":""}</div>
          ${temizAciklama?`<div class="t2 faint">Not: ${esc(temizAciklama)}</div>`:""}
          ${x.karar_notu?`<div class="t2" style="color:${x.durum==="reddedildi"?"var(--no-tx)":"var(--mut)"}">Yönetici notu: ${esc(x.karar_notu)}</div>`:""}
        </div></div>
      <div class="vact" id="mr-${x.id}"></div></div>`);
    if(!gecti && (x.durum==="bekliyor" || x.durum==="onayli")){
      const ip=h(`<button class="btn sm ghost">${t("r_iptal")}</button>`);
      ip.onclick=async()=>{
        if(!confirm("İptal edilsin mi?"))return;
        try{
          const {error}=await sb.from("rezervasyonlar").update({durum:"iptal"}).eq("id",x.id);
          if(error){
            const r=await sb.rpc("rezervasyon_iptal",{p_id:x.id});
            if(r.error) throw r.error;
          }
          toast("İptal edildi");
          x.durum="iptal";
          await scrRezerve(c);
        }catch(e){ toast(niceError(e),"err"); }
      };
      row.querySelector(`#mr-${x.id}`).appendChild(ip);
    }
    mr.appendChild(row);
  });
}

function rezervasyonYapModal(s, alan, maxKapasite, kalanKapasite, buSlottakiRezler, container){
  const defaultKisi = Math.min(1, kalanKapasite);
  const mdl=modal(`<h2 style="font-size:19px;margin-bottom:6px">${esc(alan.ad)} Rezervasyonu</h2>
    <div class="small faint" style="margin-bottom:14px">
      📅 <b>${fmtDate(s.bas)}</b> &nbsp;·&nbsp; ⏰ <b>${ss(s.bas)} – ${ss(s.bit)}</b>
    </div>

    <div class="card pad" style="background:var(--card2);border:1px solid var(--line);margin-bottom:14px">
      <div class="between" style="font-size:13px;margin-bottom:4px">
        <span class="faint">Toplam Kontenjan:</span>
        <b>${maxKapasite} Kişi</b>
      </div>
      <div class="between" style="font-size:13px;margin-bottom:4px">
        <span class="faint">Şu Anki Kalan Kontenjan:</span>
        <b style="color:var(--ok)">${kalanKapasite} Kişi Boş</b>
      </div>
      <div class="between" style="font-size:13px">
        <span class="faint">Onay Durumu:</span>
        <span>${alan.onay_gerekir ? "Yönetici onayı gerekiyor" : "Anında onaylı"}</span>
      </div>
    </div>

    <div class="field">
      <label><b>Bu Rezervasyona Kaç Kişi Katılacaksınız?</b></label>
      <input class="inp" id="r_kisi_sayisi" type="number" min="1" max="${kalanKapasite}" value="${defaultKisi}" style="font-size:16px;font-weight:600">
      <div class="small faint" style="margin-top:4px">Dairenizden bu alana gidecek kişi sayısını girin (Maksimum ${kalanKapasite} kişi seçebilirsiniz).</div>
    </div>

    <div class="field">
      <label>Rezervasyon Notu / Açıklama <span class="faint">(${t("optional")})</span></label>
      <input class="inp" id="r_aciklama" placeholder="Varsa eklemek istediğiniz not veya misafir bilgisi" maxlength="150">
    </div>

    ${buSlottakiRezler.length ? `
      <div style="margin-top:14px;margin-bottom:14px">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px" class="faint">AYNI SAATTE REZERVASYONU OLAN DİĞER SAKİNLER:</div>
        <div style="max-height:110px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)">
          ${buSlottakiRezler.map(r=>`
            <div class="between" style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--line2)">
              <span>${esc(r.ad)} ${r.daire?`(${esc(r.daire)})`:""}</span>
              <span class="faint">${r.kisi_sayisi} kişi ${r.durum==="bekliyor"?"(Onay bekliyor)":""}</span>
            </div>
          `).join("")}
        </div>
      </div>
    ` : ""}

    <div id="r_btn_wrap" style="margin-top:14px"></div>
    <button class="btn ghost full" id="r_cancel_btn" style="margin-top:8px">${t("cancel")}</button>`);

  mdl.querySelector("#r_cancel_btn").onclick=closeModal;

  mdl.querySelector("#r_btn_wrap").appendChild(guard(h(`<button class="btn full ok" style="font-weight:600">${alan.onay_gerekir && !isYon() ? "Onaya Gönder" : "Rezervasyonu Onayla"}</button>`), async()=>{
    const kSayisi = parseInt($("#r_kisi_sayisi").value) || 1;
    if(kSayisi < 1) throw new Error("En az 1 kişi girmelisiniz");
    if(kSayisi > kalanKapasite) throw new Error(`Kalan kontenjan (${kalanKapasite} kişi) aşılamaz`);

    const aciklamaMetni = ($("#r_aciklama").value.trim() || "");
    const tamAciklama = `[kisi:${kSayisi}]` + (aciklamaMetni ? ` ${aciklamaMetni}` : "");

    // Doğrudan supabase insert kullanarak kayıt oluştur (böylece birden fazla daire aynı saate kayıt açabilir)
    const yeniRez = {
      site_id: S.site.id,
      alan_id: alan.id,
      profil_id: S.user.id,
      baslangic: s.bas.toISOString(),
      bitis: s.bit.toISOString(),
      durum: (alan.onay_gerekir && !isYon()) ? "bekliyor" : "onayli",
      aciklama: tamAciklama
    };

    const {error}=await sb.from("rezervasyonlar").insert(yeniRez);
    if(error){
      // RPC fallback denemesi
      const x=await sb.rpc("rezervasyon_yap",{
        p_alan_id: alan.id,
        p_baslangic: s.bas.toISOString(),
        p_bitis: s.bit.toISOString(),
        p_aciklama: tamAciklama
      });
      if(x.error) throw x.error;
    }

    closeModal();
    toast(alan.onay_gerekir && !isYon() ? "Talebiniz yönetici onayına gönderildi ✓" : "Rezervasyonunuz oluşturuldu ✓");
    scrRezerve(container);
  }));
}

function rezSlotDetayModal(s, alan, maxKapasite, buSlottakiRezler, container){
  let toplamKullanilan = 0;
  buSlottakiRezler.forEach(r => toplamKullanilan += r.kisi_sayisi);
  const kalanKapasite = Math.max(0, maxKapasite - toplamKullanilan);
  const benimRez = buSlottakiRezler.find(r => r.benim);

  const mdl = modal(`<h2 style="font-size:19px;margin-bottom:6px">${esc(alan.ad)} Detayı</h2>
    <div class="small faint" style="margin-bottom:14px">
      📅 <b>${fmtDate(s.bas)}</b> &nbsp;·&nbsp; ⏰ <b>${ss(s.bas)} – ${ss(s.bit)}</b>
    </div>

    <div class="card pad" style="background:var(--card2);border:1px solid var(--line);margin-bottom:14px">
      <div class="between" style="font-size:13px;margin-bottom:4px">
        <span class="faint">Kapasite Durumu:</span>
        <b>${toplamKullanilan} / ${maxKapasite} Kişi Dolu</b>
      </div>
      <div class="prog" style="margin-top:6px;height:8px"><i style="width:${Math.min(100, Math.round((toplamKullanilan/maxKapasite)*100))}%;background:${toplamKullanilan>=maxKapasite?'var(--no)':'var(--acc)'}"></i></div>
      <div class="small faint" style="margin-top:6px">Kalan boş yer: <b>${kalanKapasite} kişi</b></div>
    </div>

    <div style="margin-bottom:14px">
      <div style="font-weight:600;font-size:14px;margin-bottom:8px">Bu Saatteki Rezervasyonlar:</div>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)">
        ${buSlottakiRezler.map(r=>`
          <div class="between" style="padding:7px 0;border-bottom:1px solid var(--line2)">
            <div>
              <span style="font-weight:500">${esc(r.ad)}</span>
              ${r.daire ? `<span class="small faint" style="margin-left:4px">· ${esc(r.daire)}</span>` : ""}
              ${r.benim ? `<span class="badge ok" style="margin-left:6px;font-size:10px">Sizin</span>` : ""}
              ${r.durum==="bekliyor" ? `<span class="badge wa" style="margin-left:6px;font-size:10px">Onay Bekliyor</span>` : ""}
            </div>
            <span style="font-weight:600;font-size:13px">${r.kisi_sayisi} kişi</span>
          </div>
        `).join("") || `<div class="faint small">Henüz rezervasyon yok</div>`}
      </div>
    </div>

    ${benimRez ? `
      <div class="card pad" style="border:1px dashed var(--line);margin-bottom:12px;background:var(--card2)">
        <div class="between">
          <div>
            <div style="font-weight:600;font-size:13px">Sizin Rezervasyonunuz</div>
            <div class="small faint">${benimRez.kisi_sayisi} Kişi · ${benimRez.durum==="bekliyor"?"Onay Bekliyor":"Onaylandı"}</div>
          </div>
          <button class="btn sm danger ghost" id="r_iptal_btn">İptal Et</button>
        </div>
      </div>
    ` : (kalanKapasite > 0 ? `
      <button class="btn full ok" id="r_yeni_ekle_btn" style="margin-bottom:8px">+ ${kalanKapasite} Kişilik Kalan Yere Rezervasyon Yap</button>
    ` : "")}

    <button class="btn ghost full" id="r_detay_kapat">${t("close")}</button>`);

  mdl.querySelector("#r_detay_kapat").onclick = closeModal;

  if(mdl.querySelector("#r_iptal_btn")){
    mdl.querySelector("#r_iptal_btn").onclick = async()=>{
      if(!confirm("Rezervasyonunuz iptal edilsin mi?")) return;
      try{
        const {error}=await sb.from("rezervasyonlar").update({durum:"iptal"}).eq("id",benimRez.id);
        if(error) throw error;
        closeModal();
        toast("Rezervasyonunuz iptal edildi ✓");
        scrRezerve(container);
      }catch(e){ toast(niceError(e),"err"); }
    };
  }

  if(mdl.querySelector("#r_yeni_ekle_btn")){
    mdl.querySelector("#r_yeni_ekle_btn").onclick = ()=>{
      closeModal();
      rezervasyonYapModal(s, alan, maxKapasite, kalanKapasite, buSlottakiRezler, container);
    };
  }
}

function alanModal(alan,refresh){
  const v=alan||{ad:"",aciklama:"",kapasite:1,acilis:"08:00",kapanis:"22:00",slot_dk:60,gunluk_limit:99,onay_gerekir:false,aktif:true};
  const mdl=modal(`<h2 style="font-size:19px;margin-bottom:14px">${alan?"Ortak alanı düzenle":t("r_alan_ekle")}</h2>
    <div class="field"><label>Alan adı</label>
      <input class="inp" id="ra" value="${esc(v.ad)}" placeholder="Örn. Havuz, Spor Salonu, Barbekü Alanı" maxlength="80"></div>
    <div class="field"><label>Açıklama <span class="faint">(${t("optional")})</span></label>
      <textarea class="inp" id="rd" rows="3" maxlength="400" placeholder="Kullanım kuralları, kıyafet zorunluluğu, bilgilendirme…">${esc(v.aciklama||"")}</textarea></div>
    
    <div class="field">
      <label>Maksimum Eşzamanlı Kapasite / Kontenjan <span class="faint">(Aynı saatte en fazla kaç kişi)</span></label>
      <input class="inp" id="r_kap" type="number" min="1" max="500" value="${v.kapasite||1}" placeholder="Örn: 50">
      <div class="small faint" style="margin-top:4px">Örnek: 50 kişilik bir havuz için 50 girin. Birden fazla daire aynı saate kişi sayısıyla rezervasyon yapabilir.</div>
    </div>

    <div class="row" style="gap:10px">
      <div class="field grow"><label>Açılış</label><input class="inp" id="r1" type="time" value="${String(v.acilis).slice(0,5)}"></div>
      <div class="field grow"><label>Kapanış</label><input class="inp" id="r2" type="time" value="${String(v.kapanis).slice(0,5)}"></div></div>
    <label class="row" style="gap:10px;align-items:center;margin-bottom:8px;cursor:pointer">
      <input type="checkbox" id="r6" ${v.onay_gerekir?"checked":""} style="width:18px;height:18px">
      <span class="small">Yönetici onayı gereksin</span></label>
    <label class="row" style="gap:10px;align-items:center;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="r7" ${v.aktif?"checked":""} style="width:18px;height:18px">
      <span class="small">Kullanıma açık</span></label>
    <div class="row" style="gap:10px"><div id="rsv" class="grow"></div>
      ${alan?`<button class="btn ghost" id="rdel" style="color:var(--no)">${t("delete")}</button>`:""}
      <button class="btn ghost" id="rcx">${t("cancel")}</button></div>`,true);
  mdl.querySelector("#rcx").onclick=closeModal;
  if(mdl.querySelector("#rdel")) mdl.querySelector("#rdel").onclick=async()=>{
    if(!confirm("Alan ve bütün rezervasyonları silinsin mi?"))return;
    try{ const {error}=await sb.from("ortak_alanlar").delete().eq("id",alan.id);
      if(error) throw error; closeModal(); toast("Silindi"); refresh();
    }catch(e){ toast(niceError(e),"err"); }
  };
  mdl.querySelector("#rsv").appendChild(guard(h(`<button class="btn full">${t("save")}</button>`),async()=>{
    const ad=$("#ra").value.trim();
    if(ad.length<2) throw new Error("Alan adı girin");
    if($("#r2").value<=$("#r1").value) throw new Error("Kapanış, açılıştan sonra olmalı");
    const kapVal=Math.max(1, parseInt($("#r_kap").value)||1);
    const rec={site_id:S.site.id, ad, aciklama:$("#rd").value.trim()||null,
      kapasite:kapVal,
      acilis:$("#r1").value, kapanis:$("#r2").value,
      onay_gerekir:$("#r6").checked, aktif:$("#r7").checked};
    if(!alan){ rec.slot_dk=60; rec.gunluk_limit=99; }
    const {error}= alan ? await sb.from("ortak_alanlar").update(rec).eq("id",alan.id)
                        : await sb.from("ortak_alanlar").insert(rec);
    if(error) throw error;
    closeModal(); toast(t("save")+" ✓"); refresh();
  }));
}


/* ═══════════════════════════════════════════════════════════════
   DEMİRBAŞ VE BAKIM TAKİBİ
   (Kamera ve güvenlik ekipmanları "Kamera / Güvenlik" kategorisi altında yönetilir)
   ═══════════════════════════════════════════════════════════════ */
const DB_KAT={asansor:"Asansör",jenerator:"Jeneratör",hidrofor:"Hidrofor",yangin:"Yangın sistemi",
  kamera:"Kamera / Güvenlik",isitma:"Isıtma - soğutma",havuz:"Havuz",bahce:"Bahçe",arac:"Araç",diger:"Diğer"};
const DB_DURUM={calisiyor:["ok","Çalışıyor"],arizali:["no","Arızalı"],bakimda:["wa","Bakımda"],hurda:["mutb","Hurda"]};
let DB_F="hepsi";

function parseKameraNotlar(str){
  if(!str) return null;
  try{
    if(str.startsWith("{") && str.endsWith("}")){
      const j = JSON.parse(str);
      if(j && (j.kam_ip || j.kam_tip || j.kam_url || j.kam_alan)) return j;
    }
  }catch(e){}
  return null;
}

async function scrDemirbas(c){
  c.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  const [dR,tR]=await Promise.all([
    sb.from("demirbaslar").select("*").eq("site_id",S.site.id).order("kategori").order("ad"),
    sb.rpc("demirbas_bakim_takvimi",{p_gun:45})
  ]);
  if(dR.error){ c.innerHTML=`<div class="card pad"><p class="small" style="color:var(--no)">${esc(niceError(dR.error))}</p></div>`; return; }
  const hepsi=dR.data||[];
  const takvim=(tR&&tR.data)||[];
  const gecikmis=takvim.filter(x=>x.kalan_gun<0);
  const yaklasan=takvim.filter(x=>x.kalan_gun>=0);
  const katlar=[...new Set(hepsi.map(d=>d.kategori))];

  c.innerHTML=`
    ${takvim.length?`<div class="card pad" style="margin-bottom:14px;border-color:${gecikmis.length?"var(--no)":"var(--wa)"}">
      <div style="font-weight:600;margin-bottom:8px">${gecikmis.length?"⚠ "+t("d_gecikmis")+" bakımlar":t("d_yaklasan")}</div>
      ${takvim.slice(0,6).map(x=>`<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span>${esc(x.ad)}${x.konum?` <span class="faint small">· ${esc(x.konum)}</span>`:""}</span>
        <span class="small ${x.kalan_gun<0?"":"faint"}" style="${x.kalan_gun<0?"color:var(--no)":""}">
          ${fmtDate(x.sonraki_bakim)} · ${x.kalan_gun<0?Math.abs(x.kalan_gun)+" gün gecikti":x.kalan_gun+" gün kaldı"}</span></div>`).join("")}
    </div>`:""}

    <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="chips" id="df">
        <button class="fchip ${DB_F==='hepsi'?'on':''}" data-f="hepsi">${t("all")} · ${hepsi.length}</button>
        ${katlar.map(k=>`<button class="fchip ${DB_F===k?'on':''}" data-f="${k}">${k==='kamera'?'📹 ':''}${esc(DB_KAT[k]||k)} · ${hepsi.filter(d=>d.kategori===k).length}</button>`).join("")}
      </div>
      ${isYon()?`<button class="btn sm" id="dnew">${I.plus} ${t("d_yeni")}</button>`:""}</div>
    <div class="card pad"><div id="dl" class="kolon2"></div></div>`;

  c.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{DB_F=b.dataset.f;scrDemirbas(c);});
  if($("#dnew")) $("#dnew").onclick=()=>demirbasModal(null,()=>scrDemirbas(c));

  const list=DB_F==="hepsi"?hepsi:hepsi.filter(d=>d.kategori===DB_F);
  const dl=$("#dl");
  if(!list.length){ dl.innerHTML=empty(t("d_bos")); return; }

  list.forEach(d=>{
    const [dc,dlbl]=DB_DURUM[d.durum]||["mutb",d.durum];
    const gecikti=d.sonraki_bakim && new Date(d.sonraki_bakim)<new Date();
    const isKamera = d.kategori === "kamera";
    const kamData = isKamera ? parseKameraNotlar(d.notlar) : null;
    const temizNot = kamData ? (kamData.kam_not || "") : (d.notlar || "");

    const row=h(`<div class="vcard ${isKamera?'kamera-card':''}">
      <div class="vhead">
        <div class="feed-dot" style="width:38px;height:38px;flex:none;background:${isKamera?'var(--acc-soft)':'var(--card2)'};color:${isKamera?'var(--acc2)':'var(--ink2)'}">
          ${isKamera ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>` : I.asset}
        </div>
        <div class="grow" style="min-width:0">
          <div class="t1">
            ${esc(d.ad)}
            ${isKamera ? `<span class="badge ok" style="font-size:10.5px;margin-left:5px">📹 Kamera / Güvenlik</span>` : ''}
          </div>
          <div class="t2">
            ${esc(DB_KAT[d.kategori]||d.kategori)}${d.konum?" · "+esc(d.konum):""}${d.marka?" · "+esc(d.marka):""}${d.model?" "+esc(d.model):""}
          </div>
          ${kamData ? `
            <div class="t2" style="color:var(--ink2);font-size:12px;margin-top:2px">
              ${kamData.kam_tip ? `<span class="badge mutb" style="font-size:10px;margin-right:4px">${esc(kamData.kam_tip)}</span>` : ''}
              ${kamData.kam_mekan ? `<span class="badge mutb" style="font-size:10px;margin-right:4px">${esc(kamData.kam_mekan)}</span>` : ''}
              ${kamData.kam_ip ? `IP: <b class="m">${esc(kamData.kam_ip)}</b>` : ''}
              ${kamData.kam_alan ? ` · Gördüğü Alan: ${esc(kamData.kam_alan)}` : ''}
            </div>
          ` : ''}
          <div class="t2">${d.sonraki_bakim?`${t("d_sonraki")}: <span style="${gecikti?"color:var(--no);font-weight:600":""}">${fmtDate(d.sonraki_bakim)}</span>`:"Bakım periyodu tanımsız"}${d.son_bakim?` · son: ${fmtDate(d.son_bakim)}`:""}</div>
        </div>
        <span class="badge ${dc}">${dlbl}</span></div>
      <div class="vact" id="da-${d.id}"></div></div>`);
    const a=row.querySelector(`#da-${d.id}`);

    if(isYon()){
      const bk=h(`<button class="btn sm ok">${t("d_bakim_ekle")}</button>`);
      bk.onclick=()=>bakimModal(d,()=>scrDemirbas(c));
      a.appendChild(bk);
    }
    const gm=h(`<button class="btn sm ghost">${isKamera?"Detay & Geçmiş":t("d_gecmisi")}</button>`);
    gm.onclick=async()=>{
      const {data:bs}=await sb.from("demirbas_bakim").select("*").eq("demirbas_id",d.id).order("tarih",{ascending:false});
      modal(`<h2 style="font-size:19px;margin-bottom:4px">${esc(d.ad)}</h2>
        <div class="small faint" style="margin-bottom:12px">${esc(DB_KAT[d.kategori]||d.kategori)}${d.konum?" · "+esc(d.konum):""}</div>
        ${isKamera && kamData ? `
          <div class="card pad" style="background:var(--card2);border:1px solid var(--line);margin-bottom:14px;font-size:13px">
            <div style="font-weight:600;margin-bottom:6px">📹 Kamera & Güvenlik Künyesi</div>
            <div class="between" style="padding:4px 0;border-bottom:1px solid var(--line2)"><span class="faint">Kamera / Ekipman Tipi:</span><b>${esc(kamData.kam_tip||"—")}</b></div>
            <div class="between" style="padding:4px 0;border-bottom:1px solid var(--line2)"><span class="faint">Mekân:</span><b>${esc(kamData.kam_mekan||"—")}</b></div>
            <div class="between" style="padding:4px 0;border-bottom:1px solid var(--line2)"><span class="faint">IP Adresi:</span><b class="m">${esc(kamData.kam_ip||"—")}</b></div>
            <div class="between" style="padding:4px 0;border-bottom:1px solid var(--line2)"><span class="faint">Yayın / RTSP URL:</span><span class="m faint" style="font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(kamData.kam_url||"—")}</span></div>
            <div class="between" style="padding:4px 0"><span class="faint">Gördüğü Alan / Açı:</span><b>${esc(kamData.kam_alan||"—")}</b></div>
          </div>
        ` : ''}
        <div style="font-weight:600;font-size:14px;margin-bottom:8px">${t("d_gecmisi")}</div>
        <div style="max-height:40vh;overflow:auto">${(bs||[]).map(x=>
          `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
             <div class="between"><span style="font-weight:500">${fmtDate(x.tarih)}</span>
               <span class="m faint">${x.tutar?money(x.tutar):""}</span></div>
             <div class="small muted">${esc(x.yapan||"—")}${x.aciklama?" · "+esc(x.aciklama):""}</div></div>`).join("")||empty("Bakım kaydı yok.")}</div>
        <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">${t("close")}</button>`,true);
    };
    a.appendChild(gm);

    if(isYon()){
      const ed=h(`<button class="iconbtn" title="Düzenle">${I.settings||I.edit}</button>`);
      ed.onclick=()=>demirbasModal(d,()=>scrDemirbas(c));
      a.appendChild(ed);
    }
    if(isYon()){
      const sl=h(`<button class="iconbtn" title="Sil">${I.trash}</button>`);
      sl.onclick=async()=>{
        if(!confirm(`"${d.ad}" ve bakım geçmişi silinsin mi?`))return;
        try{ const {error}=await sb.from("demirbaslar").delete().eq("id",d.id);
          if(error) throw error; toast("Silindi"); scrDemirbas(c);
        }catch(e){ toast(niceError(e),"err"); }
      };
      a.appendChild(sl);
    }
    dl.appendChild(row);
  });
}

function demirbasModal(d,refresh){
  const v=d||{ad:"",kategori:"diger",konum:"",marka:"",model:"",seri_no:"",
    alim_tarihi:"",garanti_bitis:"",bakim_periyot_ay:"",durum:"calisiyor",notlar:""};
  
  const kamData = parseKameraNotlar(v.notlar) || {};
  const temizNot = kamData.kam_not !== undefined ? kamData.kam_not : (v.notlar || "");

   FİŞ & FATURA ARŞİVİ, BELGE TARAYICI (CAMSCANNER) VE MUHASEBECİ ENTEGRASYONU
   - Gelişmiş belge tarama: Perspektif düzeltme, köşe ayarlama, netleştirme filtreleri (Magic Color, B&W, Gri).
   - Çok sayfalı PDF oluşturma (jsPDF).
   - Muhasebeciye ZIP arşivi indirme (JSZip), WhatsApp ve E-posta ile toplu gönderim.
   - Gider ekleme ile tam entegrasyon.
   ═══════════════════════════════════════════════════════════════ */

function getFisFaturalar(){
  try{
    const k = `kp_${S.site?.id}_fis_faturalar`;
    const d = localStorage.getItem(k);
    if(d) return JSON.parse(d);
  }catch(e){}
  return [];
}

function saveFisFatura(fatura){
  try{
    const k = `kp_${S.site?.id}_fis_faturalar`;
    let list = getFisFaturalar();
    const idx = list.findIndex(x => x.id === fatura.id);
    if(idx >= 0){
      list[idx] = fatura;
    } else {
      list.unshift(fatura);
    }
    localStorage.setItem(k, JSON.stringify(list));
  }catch(e){
    console.error("Fis fatura kayit hatasi:", e);
  }
}

function deleteFisFatura(id){
  try{
    const k = `kp_${S.site?.id}_fis_faturalar`;
    let list = getFisFaturalar().filter(x => x.id !== id);
    localStorage.setItem(k, JSON.stringify(list));
  }catch(e){}
}

/* ——— GÜVENLİ ve ESNEK PDF & ZIP KÜTÜPHANE YÜKLEYİCİLERİ ——— */
async function getJsPDFClass(){
  if(window.jspdf && typeof window.jspdf.jsPDF === "function") return window.jspdf.jsPDF;
  if(typeof window.jsPDF === "function") return window.jsPDF;
  if(window.jspdf && typeof window.jspdf === "function") return window.jspdf;

  // ESM Dynamic Import Fallback
  try {
    const mod = await import("https://esm.sh/jspdf@2.5.1");
    if(mod && typeof mod.jsPDF === "function") return mod.jsPDF;
    if(mod && mod.default && typeof mod.default.jsPDF === "function") return mod.default.jsPDF;
    if(mod && typeof mod.default === "function") return mod.default;
  } catch(e){}

  // CDN Script Fallback
  const cdns = [
    "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ];
  for(const src of cdns){
    try {
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
      if(window.jspdf && typeof window.jspdf.jsPDF === "function") return window.jspdf.jsPDF;
      if(typeof window.jsPDF === "function") return window.jsPDF;
      if(typeof window.jspdf === "function") return window.jspdf;
    }catch(err){}
  }
  return null;
}

async function getJSZipClass(){
  if(typeof window.JSZip === "function") return window.JSZip;
  try {
    const mod = await import("https://esm.sh/jszip@3.10.1");
    if(mod && typeof mod.default === "function") return mod.default;
    if(mod && typeof mod.JSZip === "function") return mod.JSZip;
  }catch(e){}
  const cdns = [
    "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
    "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  ];
  for(const src of cdns){
    try {
      await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
      if(typeof window.JSZip === "function") return window.JSZip;
    }catch(err){}
  }
  return null;
}

      <div class="row" style="gap:10px;margin-top:14px">
        <button class="btn full ok" id="btnFinishScan" style="display:none">📄 PDF Oluştur ve Kullan</button>
        <button class="btn ghost" id="btnCancelScan">${t("cancel")}</button>
      </div>
    </div>
  `, true);

  canvas = mdl.querySelector("#scanCanvas");
  ctx = canvas.getContext("2d");
  const editorArea = mdl.querySelector("#scanEditorArea");
  const emptyBox = mdl.querySelector("#scanEmptyBox");
  const pagesArea = mdl.querySelector("#pagesListArea");
  const finishBtn = mdl.querySelector("#btnFinishScan");

  function initImage(fileOrUrl){
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        aktifResim = img;
        rotationDeg = 0;
        emptyBox.style.display = "none";
        editorArea.style.display = "block";
        resetCornersAuto();
        drawCanvas();
      };
      img.src = e.target.result;
    };
    if(typeof fileOrUrl === "string"){
      const img = new Image();
      img.onload = () => {
        aktifResim = img;
        rotationDeg = 0;
        emptyBox.style.display = "none";
        editorArea.style.display = "block";
        resetCornersAuto();
        drawCanvas();
      };
      img.src = fileOrUrl;
    } else if(fileOrUrl) {
      reader.readAsDataURL(fileOrUrl);
    }
  }

  function resetCornersAuto(){
    if(!aktifResim) return;
    const w = aktifResim.width;
    const h = aktifResim.height;
    // Varsayılan %6 kenar payı ile 4 köşe
    const mx = w * 0.06;
    const my = h * 0.06;
    corners = [
      { x: mx, y: my },          // Sol Üst (TL)
      { x: w - mx, y: my },      // Sağ Üst (TR)
      { x: w - mx, y: h - my },  // Sağ Alt (BR)
      { x: mx, y: h - my }       // Sol Alt (BL)
    ];
  }

  function drawCanvas(){
    if(!aktifResim) return;
    const maxW = 700;
    const scale = Math.min(1, maxW / aktifResim.width);
    canvas.width = aktifResim.width * scale;
    canvas.height = aktifResim.height * scale;

    ctx.save();
    ctx.scale(scale, scale);
    ctx.drawImage(aktifResim, 0, 0);

    // Dörtgen poligon ve çizgiler
    ctx.strokeStyle = "rgba(59, 130, 246, 0.9)";
    ctx.lineWidth = 3 / scale;
    ctx.fillStyle = "rgba(59, 130, 246, 0.15)";
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    ctx.lineTo(corners[1].x, corners[1].y);
    ctx.lineTo(corners[2].x, corners[2].y);
    ctx.lineTo(corners[3].x, corners[3].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 4 köşe tutamacı
    corners.forEach((c, idx) => {
      ctx.fillStyle = activeCorner === idx ? "#22c55e" : "#3b82f6";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2 / scale;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 14 / scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // İç nokta
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(c.x, c.y, 4 / scale, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  // Dokunmatik / Fare ile köşe sürükleme
  function getCanvasCoords(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scale = aktifResim.width / canvas.width;
    const x = (clientX - rect.left) * (canvas.width / rect.width) * scale;
    const y = (clientY - rect.top) * (canvas.height / rect.height) * scale;
    return { x, y };
  }

  function handleStart(e){
    if(!aktifResim) return;
    const pos = getCanvasCoords(e);
    let minDist = Infinity;
    let found = -1;
    corners.forEach((c, idx) => {
      const d = Math.hypot(c.x - pos.x, c.y - pos.y);
      if(d < 45 && d < minDist){
        minDist = d;
        found = idx;
      }
    });
    activeCorner = found;
    if(found !== -1){
      e.preventDefault();
      drawCanvas();
    }
  }

  function handleMove(e){
    if(activeCorner === -1 || !aktifResim) return;
    e.preventDefault();
    const pos = getCanvasCoords(e);
    // Sınırlar içinde tut
    corners[activeCorner].x = Math.max(0, Math.min(aktifResim.width, pos.x));
    corners[activeCorner].y = Math.max(0, Math.min(aktifResim.height, pos.y));
    drawCanvas();
  }

  function handleEnd(){
    activeCorner = -1;
    drawCanvas();
  }

  canvas.addEventListener("mousedown", handleStart);
  window.addEventListener("mousemove", handleMove);
  window.addEventListener("mouseup", handleEnd);

  canvas.addEventListener("touchstart", handleStart, { passive: false });
  window.addEventListener("touchmove", handleMove, { passive: false });
  window.addEventListener("touchend", handleEnd);

  // Perspektif Düzeltme & Kırpma Motoru (Bilinear / Homography Transform)
  function warpAndEnhance(){
    if(!aktifResim) return null;
    const [tl, tr, br, bl] = corners;

    // Hedef genişlik ve yükseklik hesaplama
    const widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
    const widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
    const targetW = Math.round(Math.max(widthTop, widthBottom));

    const heightLeft = Math.hypot(bl.x - tl.x, bl.y - tl.y);
    const heightRight = Math.hypot(br.x - tr.x, br.y - tr.y);
    const targetH = Math.round(Math.max(heightLeft, heightRight));

    const outCanvas = document.createElement("canvas");
    outCanvas.width = targetW;
    outCanvas.height = targetH;
    const outCtx = outCanvas.getContext("2d");

    // Kaynak görsel tuvali
    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = aktifResim.width;
    srcCanvas.height = aktifResim.height;
    const sCtx = srcCanvas.getContext("2d");
    sCtx.drawImage(aktifResim, 0, 0);

    const srcData = sCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
    const dstData = outCtx.createImageData(targetW, targetH);

    const sPix = srcData.data;
    const dPix = dstData.data;
    const sW = srcCanvas.width;
    const sH = srcCanvas.height;

    // Bilinear Mapping ile perspektif düzeltme
    for(let y = 0; y < targetH; y++){
      const v = y / (targetH - 1 || 1);
      for(let x = 0; x < targetW; x++){
        const u = x / (targetW - 1 || 1);

        // 4 köşe interpolasyonu
        const srcX = (1 - u) * (1 - v) * tl.x + u * (1 - v) * tr.x + u * v * br.x + (1 - u) * v * bl.x;
        const srcY = (1 - u) * (1 - v) * tl.y + u * (1 - v) * tr.y + u * v * br.y + (1 - u) * v * bl.y;

        const ix = Math.floor(srcX);
        const iy = Math.floor(srcY);

        if(ix >= 0 && ix < sW && iy >= 0 && iy < sH){
          const sIdx = (iy * sW + ix) * 4;
          const dIdx = (y * targetW + x) * 4;

          let r = sPix[sIdx];
          let g = sPix[sIdx + 1];
          let b = sPix[sIdx + 2];
          let a = sPix[sIdx + 3];

          // Filtreler
          if(currentFilter === "magic"){
            // Magic Color: Beyaz dengesini artır, metinleri koyulaştır, kontrast yükselt
            const gray = (r * 0.299 + g * 0.587 + b * 0.114);
            // Kontrast eğrisi
            const factor = 1.35;
            let nr = (r - 128) * factor + 128 + 25;
            let ng = (g - 128) * factor + 128 + 25;
            let nb = (b - 128) * factor + 128 + 25;
            if(gray > 165){ nr += 30; ng += 30; nb += 30; }
            dPix[dIdx] = Math.min(255, Math.max(0, nr));
            dPix[dIdx + 1] = Math.min(255, Math.max(0, ng));
            dPix[dIdx + 2] = Math.min(255, Math.max(0, nb));
            dPix[dIdx + 3] = a;
          } else if(currentFilter === "bw"){
            // Siyah-Beyaz Adaptif Binarization
            const gray = (r * 0.299 + g * 0.587 + b * 0.114);
            const val = gray > 140 ? 255 : 0;
            dPix[dIdx] = val;
            dPix[dIdx + 1] = val;
            dPix[dIdx + 2] = val;
            dPix[dIdx + 3] = a;
          } else if(currentFilter === "gray"){
            // Gri Tonlama
            const gray = (r * 0.299 + g * 0.587 + b * 0.114);
            const enhanced = Math.min(255, Math.max(0, (gray - 128) * 1.3 + 128 + 15));
            dPix[dIdx] = enhanced;
            dPix[dIdx + 1] = enhanced;
            dPix[dIdx + 2] = enhanced;
            dPix[dIdx + 3] = a;
          } else {
            // Orijinal
            dPix[dIdx] = r;
            dPix[dIdx + 1] = g;
            dPix[dIdx + 2] = b;
            dPix[dIdx + 3] = a;
          }
        }
      }
    }

    outCtx.putImageData(dstData, 0, 0);
    return outCanvas.toDataURL("image/jpeg", 0.92);
  }

  // Filtre Değişim Butonları
  mdl.querySelectorAll("[data-filt]").forEach(btn => {
    btn.onclick = () => {
      mdl.querySelectorAll("[data-filt]").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      currentFilter = btn.dataset.filt;
    };
  });

  // Döndürme
  mdl.querySelector("#btnRotate").onclick = () => {
    if(!aktifResim) return;
    const offCanvas = document.createElement("canvas");
    offCanvas.width = aktifResim.height;
    offCanvas.height = aktifResim.width;
    const oCtx = offCanvas.getContext("2d");
    oCtx.translate(offCanvas.width / 2, offCanvas.height / 2);
    oCtx.rotate(Math.PI / 2);
    oCtx.drawImage(aktifResim, -aktifResim.width / 2, -aktifResim.height / 2);
    const nImg = new Image();
    nImg.onload = () => {
      aktifResim = nImg;
      resetCornersAuto();
      drawCanvas();
    };
    nImg.src = offCanvas.toDataURL("image/jpeg");
  };

  mdl.querySelector("#btnAutoCorners").onclick = resetCornersAuto;
  mdl.querySelector("#btnResetCorners").onclick = resetCornersAuto;

  // Dosya Yükleme Olayları
  ["scanCamInput", "scanFileInput", "emptyCamInput", "emptyFileInput", "addPageInput"].forEach(id => {
    const el = mdl.querySelector("#" + id);
    if(el){
      el.onchange = (e) => {
        if(e.target.files && e.target.files[0]){
          initImage(e.target.files[0]);
        }
      };
    }
  });

  // Sayfayı Ekle
  mdl.querySelector("#btnCropPage").onclick = () => {
    const pageData = warpAndEnhance();
    if(!pageData) return;
    sayfaListesi.push(pageData);
    renderPagesList();
    editorArea.style.display = "none";
    emptyBox.style.display = "none";
    toast(`Sayfa ${sayfaListesi.length} eklendi ✓`);
  };

  function renderPagesList(){
    if(!sayfaListesi.length){
      pagesArea.style.display = "none";
      finishBtn.style.display = "none";
      emptyBox.style.display = "block";
      return;
    }
    pagesArea.style.display = "block";
    finishBtn.style.display = "block";
    mdl.querySelector("#pageCount").textContent = sayfaListesi.length;
    const grid = mdl.querySelector("#pagesThumbGrid");
    grid.innerHTML = "";

    sayfaListesi.forEach((pg, idx) => {
      const item = h(`
        <div style="position:relative;flex:none;width:95px;height:125px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000">
          <img src="${pg}" style="width:100%;height:100%;object-fit:cover">
          <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:#fff;font-size:10px;text-align:center;padding:2px 0">Sayfa ${idx + 1}</div>
          <button class="iconbtn" style="position:absolute;top:2px;right:2px;width:22px;height:22px;background:rgba(0,0,0,0.8);border-radius:50%;color:var(--no);padding:0" title="Sil">✕</button>
        </div>
      `);
      item.querySelector("button").onclick = () => {
        sayfaListesi.splice(idx, 1);
        renderPagesList();
      };
      grid.appendChild(item);
    });
  }

  // PDF Oluştur ve Tamamla
  mdl.querySelector("#btnFinishScan").onclick = async() => {
    if(!sayfaListesi.length) return toast("Lütfen en az 1 sayfa ekleyin", "err");
    const finishBtn = mdl.querySelector("#btnFinishScan");
    const origHtml = finishBtn.innerHTML;
    finishBtn.disabled = true;
    finishBtn.innerHTML = `<span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:6px"></span> PDF Hazırlanıyor...`;

    try{
      const JsPdfClass = await getJsPDFClass();
      let pdfDataUrl = "";
      let pdfBlob = null;

      if(JsPdfClass){
        const pdf = new JsPdfClass("p", "mm", "a4");
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        for(let i = 0; i < sayfaListesi.length; i++){
          if(i > 0) pdf.addPage();
          pdf.addImage(sayfaListesi[i], "JPEG", 5, 5, pageWidth - 10, pageHeight - 10, undefined, "FAST");
        }

        pdfDataUrl = pdf.output("datauristring");
        pdfBlob = pdf.output("blob");
      } else {
        // Fallback: İlk sayfayı doğrudan data URL olarak aktar
        pdfDataUrl = sayfaListesi[0];
      }

      closeSubModal();
      if(onComplete){
        onComplete({
          pdfDataUrl,
          pdfBlob,
          pageCount: sayfaListesi.length,
          pages: sayfaListesi,
          fileSize: pdfBlob ? pdfBlob.size : (sayfaListesi[0] ? sayfaListesi[0].length : 0)
        });
      }
    }catch(err){
      console.error(err);
      toast("PDF oluşturulurken hata oluştu: " + err.message, "err");
      finishBtn.disabled = false;
      finishBtn.innerHTML = origHtml;
    }
  };

  mdl.querySelector("#btnCancelScan").onclick = closeSubModal;

  if(initialImage){
    initImage(initialImage);
  }
}

/* ——— FİŞ / FATURA ARŞİVİ DASHBOARD (YÖNETİCİYE ÖZEL) ——— */
async function scrFisFaturaSekmesi(c){
  c.innerHTML = `<div class="loading"><span class="spin"></span></div>`;

  let faturalar = getFisFaturalar();
  const muh = getMuhasebeciBilgileri();

  // Tarih aralığı filtreleri (Varsayılan bu ay)
  const now = new Date();
  const buAyIlk = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  const buAySon = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().slice(0, 10);

  let baslangicTarihi = buAyIlk;
  let bitisTarihi = buAySon;
  let aramaMetni = "";
  let seciliKategori = "hepsi";

  function cizFisFaturaEkran(){
    let filtreli = faturalar;

    if(baslangicTarihi) filtreli = filtreli.filter(f => !f.tarih || f.tarih >= baslangicTarihi);
    if(bitisTarihi) filtreli = filtreli.filter(f => !f.tarih || f.tarih <= bitisTarihi);
    if(seciliKategori !== "hepsi") filtreli = filtreli.filter(f => f.kategori === seciliKategori);
    if(aramaMetni){
      const q = aramaMetni.toLowerCase();
      filtreli = filtreli.filter(f => 
        (f.baslik && f.baslik.toLowerCase().includes(q)) ||
        (f.firma && f.firma.toLowerCase().includes(q)) ||
        (f.aciklama && f.aciklama.toLowerCase().includes(q)) ||
        (f.fis_no && f.fis_no.toLowerCase().includes(q))
      );
    }

    const toplamTutar = filtreli.reduce((a, b) => a + (Number(b.tutar) || 0), 0);
    const katlar = [...new Set(faturalar.map(f => f.kategori).filter(Boolean))];

    c.innerHTML = `
      <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="font-size:17px;display:flex;align-items:center;gap:6px">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Fiş & Fatura Arşivi
          </h2>
          <div class="small faint">Yönetici tarafından taranan fiş/faturalar, kasa gider belgeleri ve muhasebeci arşivi.</div>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn sm ghost" id="btnMuhasebeciExport">📦 Muhasebeciye Gönder / ZIP</button>
          <button class="btn sm" id="btnYeniFisTara">${I.plus} Yeni Fatura / Fiş Tara</button>
        </div>
      </div>

      <!-- İstatistikler ve Filtre Barı -->
      <div class="statline" style="margin-bottom:14px">
        <div class="card stat"><div class="k">Fatura / Fiş Sayısı</div><div class="v display m">${filtreli.length}</div></div>
        <div class="card stat"><div class="k">Toplam Gider Tutarı</div><div class="v display m" style="color:var(--no-tx)">${money(toplamTutar)}</div></div>
        <div class="card stat"><div class="k">Kayıtlı Muhasebeci</div><div class="v" style="font-size:14px">${esc(muh.ad || "Tanımlanmamış")}</div></div>
      </div>

      <!-- Filtreler -->
      <div class="card pad" style="margin-bottom:14px">
        <div class="row" style="gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div class="field grow" style="min-width:140px">
            <label>Başlangıç Tarihi</label>
            <input class="inp" type="date" id="ffBas" value="${baslangicTarihi}">
          </div>
          <div class="field grow" style="min-width:140px">
            <label>Bitiş Tarihi</label>
            <input class="inp" type="date" id="ffBit" value="${bitisTarihi}">
          </div>
          <div class="field grow" style="min-width:180px">
            <label>Arama (Firma, Fiş No, Açıklama)</label>
            <input class="inp" id="ffAra" value="${esc(aramaMetni)}" placeholder="Firma veya fatura no ara...">
          </div>
          <div class="field grow" style="min-width:140px">
            <label>Kategori</label>
            <select class="inp" id="ffKat">
              <option value="hepsi" ${seciliKategori==='hepsi'?'selected':''}>Tüm Kategoriler</option>
              ${katlar.map(k => `<option value="${k}" ${seciliKategori===k?'selected':''}>${esc(k)}</option>`).join("")}
            </select>
          </div>
          <button class="btn ghost sm" id="ffSifirla" style="margin-bottom:2px">Sıfırla</button>
        </div>
      </div>

      <!-- Fatura Listesi -->
      <div class="card pad">
        <div id="ffListe" class="kolon2"></div>
      </div>
    `;

    // Filtre olayları
    c.querySelector("#ffBas").onchange = (e) => { baslangicTarihi = e.target.value; cizFisFaturaEkran(); };
    c.querySelector("#ffBit").onchange = (e) => { bitisTarihi = e.target.value; cizFisFaturaEkran(); };
    c.querySelector("#ffAra").oninput = (e) => { aramaMetni = e.target.value; cizFisFaturaEkran(); };
    c.querySelector("#ffKat").onchange = (e) => { seciliKategori = e.target.value; cizFisFaturaEkran(); };
    c.querySelector("#ffSifirla").onclick = () => {
      baslangicTarihi = buAyIlk;
      bitisTarihi = buAySon;
      aramaMetni = "";
      seciliKategori = "hepsi";
      cizFisFaturaEkran();
    };

    c.querySelector("#btnYeniFisTara").onclick = () => {
      camScannerModal({
        onComplete: (scanRes) => {
          yeniFaturaBilgiModal(scanRes, () => {
            faturalar = getFisFaturalar();
            cizFisFaturaEkran();
          });
        }
      });
    };

    c.querySelector("#btnMuhasebeciExport").onclick = () => {
      muhasebeciExportModal(filtreli, baslangicTarihi, bitisTarihi);
    };

    // Liste Çizimi
    const listeDiv = c.querySelector("#ffListe");
    if(!filtreli.length){
      listeDiv.innerHTML = empty("Seçili kriterlere uygun fiş / fatura bulunamadı.");
      return;
    }

    filtreli.forEach(f => {
      const row = h(`
        <div class="vcard">
          <div class="vhead">
            <div class="feed-dot" style="width:38px;height:38px;flex:none;background:var(--acc-soft);color:var(--acc2)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </div>
            <div class="grow" style="min-width:0">
              <div class="t1">
                ${esc(f.baslik || f.firma || "Fiş / Fatura")}
                ${f.fis_no ? `<span class="badge mutb" style="font-size:10.5px;margin-left:4px">No: ${esc(f.fis_no)}</span>` : ''}
              </div>
              <div class="t2">
                ${f.tarih ? fmtDate(f.tarih) : "Tarih yok"}${f.kategori ? " · " + esc(f.kategori) : ""}${f.firma ? " · " + esc(f.firma) : ""}
              </div>
              <div class="t2" style="color:var(--ink2);font-size:12px">
                ${f.pageCount ? `📄 ${f.pageCount} Sayfa` : ''} · ${boyutYaz(f.fileSize)}
                ${f.aciklama ? ` · ${esc(f.aciklama)}` : ''}
              </div>
            </div>
            ${f.tutar ? `<div class="amt m" style="color:var(--no-tx)">−${moneyM(f.tutar)}</div>` : ''}
          </div>
          <div class="vact" id="fa-${f.id}">
            <button class="btn sm ghost btn-onizle">👁️ Önizle</button>
            <button class="btn sm ghost btn-indir">${I.dl} İndir</button>
            <button class="iconbtn btn-sil" title="Sil">${I.trash}</button>
          </div>
        </div>
      `);

      row.querySelector(".btn-onizle").onclick = () => pdfOnizleModal(f);
      row.querySelector(".btn-indir").onclick = () => pdfIndir(f);
      row.querySelector(".btn-sil").onclick = () => {
        if(!confirm(`"${f.baslik || f.firma || 'Fatura'}" silinsin mi?`)) return;
        deleteFisFatura(f.id);
        faturalar = getFisFaturalar();
        cizFisFaturaEkran();
        toast("Fatura silindi ✓");
      };

      listeDiv.appendChild(row);
    });
  }

  cizFisFaturaEkran();
}

    try{

  }));
}

/* ——— MUHASEBECİYE TOPLU GÖNDERİM & GERÇEK ZIP ARŞİVİ ——— */
async function buildZipPackage(secilenBelgeler, baslangic, bitis){
  const JSZipClass = await getJSZipClass();
  if(!JSZipClass) throw new Error("ZIP modülü yüklenemedi.");
  const zip = new JSZipClass();
  const siteAdi = (S.site?.ad || "Site").replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ]/g, "_");
  const klasorAdi = `${siteAdi}/Fis-Faturalar/${baslangic}_${bitis}`;
  const folder = zip.folder(klasorAdi);

  // Metin döküm dosyası ekle
  let dokumText = `${S.site?.ad || "Site"} — Fiş & Fatura Dökümü\nDönem: ${fmtDate(baslangic)} - ${fmtDate(bitis)}\n\n`;
  let sira = 1;
  let toplam = 0;

  for(const b of secilenBelgeler){
    const tutarSayi = Number(b.tutar) || 0;
    toplam += tutarSayi;
    dokumText += `${sira}. [${fmtDate(b.tarih)}] ${b.firma || b.baslik || 'Gider'} - ${b.kategori || ''}: ${money(tutarSayi)} (Fiş No: ${b.fis_no || '-'})\n`;

    // PDF dosyasını ZIP'e ekle
    if(b.pdfData){
      const isPdf = b.pdfData.startsWith("data:application/pdf");
      const ext = isPdf ? ".pdf" : ".jpg";
      const base64Data = b.pdfData.split(",")[1];
      const fileName = `${String(sira).padStart(3, '0')}_${b.tarih || 'tarih'}_${(b.firma || b.baslik || 'gider').replace(/[^a-zA-Z0-9]/g, '_')}_${tutarSayi}TL${ext}`;
      folder.file(fileName, base64Data, { base64: true });
    }
    sira++;
  }

  dokumText += `\nTOPLAM GİDER TUTARI: ${money(toplam)}\nToplam Belge Sayısı: ${secilenBelgeler.length}\nOluşturulma Tarihi: ${new Date().toLocaleString("tr-TR")}`;
  folder.file("00_DONEM_GIDER_DOKUMU.txt", dokumText);

  const blob = await zip.generateAsync({ type: "blob" });
  const base64 = await zip.generateAsync({ type: "base64" });
  const fileName = `${siteAdi}_Fis_Faturalar_${baslangic}_${bitis}.zip`;
  return { blob, base64, fileName, siteAdi, toplam, dokumText };
}

/* Şifre alanlarına göz düğmesi ekler. Düğmeye basılı tutulduğu sürece değil,
   tıklandığında kalıcı olarak açar/kapatır — telefonda tek elle kullanılabilsin. */
const GOZ_ACIK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const GOZ_KAPALI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 7 10 7a17 17 0 0 1-2.7 3.5M6.6 6.7A16.6 16.6 0 0 0 2 13s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

function gozEkle(kap){
  (kap||document).querySelectorAll('input[type="password"]').forEach(inp=>{
    if(inp.dataset.gozlu) return;
    inp.dataset.gozlu="1";
    const sar=document.createElement("div");
    sar.className="sifre-kutu";
    inp.parentNode.insertBefore(sar,inp);
    sar.appendChild(inp);
    const b=document.createElement("button");
    b.type="button"; b.className="goz"; b.innerHTML=GOZ_KAPALI;
    b.setAttribute("aria-label","Şifreyi göster");
    b.setAttribute("tabindex","-1");
    b.onclick=()=>{
      const acik = inp.type==="text";
      inp.type = acik ? "password" : "text";
      b.innerHTML = acik ? GOZ_KAPALI : GOZ_ACIK;
      b.setAttribute("aria-label", acik ? "Şifreyi göster" : "Şifreyi gizle");
      inp.focus();
    };
    sar.appendChild(b);
  });
}

/* Ekran her değiştiğinde yeni şifre alanları da yakalansın */
if(typeof MutationObserver!=="undefined"){
  new MutationObserver(()=>gozEkle()).observe(document.documentElement,{childList:true,subtree:true});
}
document.addEventListener("DOMContentLoaded",()=>gozEkle());
setTimeout(()=>gozEkle(),300);
