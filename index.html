        const mb=h(`<button class="btn ok sm">${t("mark_paid")}</button>`);
        mb.onclick=()=>makbuzOnayModal(r.daire_id,y,m,()=>scrAidat(c));
        a.appendChild(mb);
      } else {
        const gb=h(`<button class="iconbtn" title="${t('undo_payment')}">${I.refresh}</button>`);
        gb.onclick=async()=>{
          if(!confirm("Ödeme onayı geri alınsın mı?\n\nBu döneme ait makbuz kalıcı olarak silinecek."))return;
          try{
            let odemeId = null;
            try {
              const { data: od } = await sb.from("odemeler").select("id").eq("site_id", S.site.id).eq("daire_id", r.daire_id).eq("yil", y).eq("ay", m).maybeSingle();
              odemeId = od?.id;
            } catch(e){}

            const imzaYolu=await rpc("makbuz_iptal",{p_daire_id:r.daire_id,p_yil:y,p_ay:m});
            if(imzaYolu) await sb.storage.from("makbuzlar").remove([imzaYolu]);

            if(odemeId){
              await sb.from("kasa_hareketleri").delete().eq("site_id", S.site.id).eq("odeme_id", odemeId);
            }
            toast(t("undo_payment")); scrAidat(c);
          }catch(e){ toast(niceError(e),"err"); }
        };
        a.appendChild(gb);
      }
    }else if(r.benim_mi&&sakinMi()&&r.durum!=="odendi"){
      a.appendChild(guard(h(`<button class="btn sm">${t("i_paid")}</button>`),async()=>{
        await rpc("aidat_beyan_et",{p_yil:y,p_ay:m});
        const dNo = r.etiket ? `Daire ${r.etiket}` : (S.prof.ad || "Bir sakin");
        bildirimGonder({
          alici_rol: "yoneticiler",
          tur: "aidat",
          baslik: `💰 Ödeme Bildirimi: ${dNo}`,
          metin: `${S.prof.ad || "Sakin"} ${m}/${y} dönemi aidatını ödediğini bildirdi.`,
          kaynak_tablo: "odemeler",
          hedef_ekran: "aidat",
          onem: "yuksek"
        });
        toast(t("declared")+" ✓");scrAidat(c);
      }));
    }
    card.appendChild(row);
  });
  c.appendChild(card);
}

let SAK_Q="";
async function scrSakinler(c){
  const y=S.per.y,m=S.per.m;
  const rows=await rpc("daire_detay_listesi",{p_yil:y,p_ay:m});
  c.innerHTML="";
  c.appendChild(periodBar(()=>scrSakinler(c)));
  const search=h(`<div class="field" style="margin-bottom:16px"><input class="inp" id="q" placeholder="${LANG==="tr"?"Sakin, plaka veya daire ara…":LANG==="ru"?"Поиск жителя, номера, квартиры…":LANG==="de"?"Bewohner, Kennzeichen, Wohnung…":"Search resident, plate, unit…"}" value="${esc(SAK_Q)}"></div>`);
  c.appendChild(search);
  const grid=h(`<div class="grid3"></div>`); c.appendChild(grid);
  const draw=()=>{
    grid.innerHTML="";
    const q=SAK_Q.trim().toLowerCase();
    const list=rows.filter(r=>!q||[r.oturan_ad,r.etiket,r.arac_plaka,r.sahip_ad].some(x=>(x||"").toLowerCase().includes(q)));
    if(!list.length){grid.appendChild(h(`<div class="card pad" style="grid-column:1/-1">${empty()}</div>`));return;}
    list.forEach(r=>grid.appendChild(sakinCard(r,()=>scrSakinler(c))));
  };
  $("#q").oninput=(e)=>{SAK_Q=e.target.value;draw();};
  draw();
}

    <div class="between" style="margin-bottom:12px"><div class="row" style="gap:11px">${av(r.oturan_ad)}
      <div><div style="font-weight:700;font-size:15px">${t("units")} ${esc(r.etiket)}</div>
        <div class="eyebrow" style="margin-top:2px">${r.sahiplik==="kiraci"?t("tenant"):t("owner")}</div></div></div>
      <div class="row" style="gap:7px">${lightHtml(r.durum)}${badge(r.durum)}${editBtn}</div></div>

        <div style="font-weight:600">${esc(r.oturan_ad)}</div>
        ${otTel?`<div class="m small mut" style="margin-top:2px">${esc(otTel)}</div>`:""}
        <div class="small mut" style="margin-top:3px">${t("aidat_payer")}: <b style="color:var(--ink)">${odeyenEtiket}</b> ${odeyenAd ? `(${esc(odeyenAd)})` : ''}</div>
      </div>${otTel?`<div class="row" style="gap:6px">${callWa(otTel,wa)}</div>`:""}</div></div>
    ${r.sahiplik==="kiraci"&&(r.sahip_ad||r.sahip_tel)?`<div class="infobox" style="margin-bottom:10px"><div class="k">${t("owner")}</div>
      <div class="between"><div><div style="font-weight:600;font-size:13.5px">${esc(r.sahip_ad||"—")}</div>${r.sahip_tel?`<div class="m small mut">${esc(r.sahip_tel)}</div>`:""}</div>${r.sahip_tel?`<div class="row" style="gap:6px">${callWa(r.sahip_tel,wa)}</div>`:""}</div></div>`:""}
    <div class="infobox" style="margin-bottom:10px"><div class="k">${t("vehicle")}</div>
      ${r.arac_var?`<div class="m" style="font-weight:600">${esc(r.arac_plaka||"—")}</div><div class="small faint" style="margin-top:2px">${[r.arac_model,r.arac_otopark?t("parking")+": "+r.arac_otopark:""].filter(Boolean).map(esc).join(" · ")||"—"}</div>`:`<div class="small faint">${t("no_vehicle")}</div>`}</div>
    <div class="infobox" style="margin-bottom:10px"><div class="k">${t("emergency")}</div>
      <div class="between"><div><div style="font-weight:600;font-size:13.5px">${esc(r.acil_ad)} <span class="faint" style="font-weight:400">(${esc(r.acil_yakinlik)})</span></div>
        <div class="m small mut">${esc(r.acil_tel)}</div></div><div class="row" style="gap:6px">${callWa(r.acil_tel,wa)}</div></div></div>

function daireEditModal(r,refresh){
  const st={oturan:r.oturan_ad||"",oturan_tel:(r.ekstra&&r.ekstra.oturan_tel)||"",sahiplik:r.sahiplik||"sahip",odeyen:r.aidat_odeyen||"sahip",sahip_ad:r.sahip_ad||"",sahip_tel:r.sahip_tel||"",
    arac:!!r.arac_var,plaka:r.arac_plaka||"",model:r.arac_model||"",otopark:r.arac_otopark||"",
    acil_ad:r.acil_ad||"",acil_yak:r.acil_yakinlik||"",acil_tel:r.acil_tel||"",evcil:!!r.evcil_var,evcil_bilgi:r.evcil_bilgi||""};
  const mdl=modal(`<h2 style="font-size:19px;margin-bottom:4px">${t("units")} ${esc(r.etiket)}</h2><p class="small faint" style="margin-bottom:14px">${t("required_all")}</p><div id="mb"></div>`,true);
  const body=mdl.querySelector("#mb");
  let spots=[];
  function draw(){
    const isKiraci = st.sahiplik === "kiraci";
    const odeyenBilgi = st.odeyen === "kiraci"
      ? (isKiraci ? `✓ Makbuzlarda <b>Kiracının (${esc(st.oturan || "Kiracı")})</b> ismi yazar.` : `✓ Makbuzlarda <b>(${esc(st.oturan || "Sakin")})</b> ismi yazar.`)
      : (isKiraci ? `✓ Makbuzlarda <b>Ev Sahibinin (${esc(st.sahip_ad || "Ev Sahibi")})</b> ismi yazar.` : `✓ Makbuzlarda <b>Ev Sahibinin (${esc(st.oturan || "Ev Sahibi")})</b> ismi yazar.`);

    body.innerHTML=`
      <div class="field"><label>${t("you_owner_q")}</label>${segChips("q1",[["sahip",t("owner")],["kiraci",t("tenant")]],st.sahiplik)}</div>
      
      <div class="row" style="gap:10px">
        <div class="field grow"><label>${isKiraci ? (LANG==="tr"?"Kiracı Ad Soyad (Oturan)":"Tenant Name") : (t("resident_info")+" — "+t("name_surname"))}</label>
          <input class="inp" id="oturan" value="${esc(st.oturan)}"></div>
        <div class="field grow"><label>${t("phone")}</label><input class="inp m" id="oturanTel" value="${esc(st.oturan_tel)}"></div>
      </div>

      <div class="field" style="margin-top:6px"><label>${t("who_pays_q")}</label>${segChips("q2",[["sahip",t("owner")],["kiraci",t("tenant")]],st.odeyen)}</div>
      <div class="note" style="margin:8px 0 14px;font-size:12.5px" id="medOdeyenNot">${odeyenBilgi}</div>

      <div id="ownBox"></div>
      <div class="field"><label>${t("vehicle_q")}</label>${segChips("q3",[["1",t("yes")],["0",t("no")]],st.arac?"1":"0")}</div><div id="vehBox"></div>
      <div class="row" style="gap:10px"><div class="field grow"><label>${t("emergency")}</label><input class="inp" id="an" value="${esc(st.acil_ad)}" placeholder="${t('name_surname')}"></div>
        <div class="field" style="max-width:120px"><label>${t("relation")}</label><input class="inp" id="ay" value="${esc(st.acil_yak)}"></div></div>
      <div class="field"><label>${t("phone")}</label><input class="inp m" id="at" value="${esc(st.acil_tel)}"></div>
      <div class="field"><label>${t("pet_q")}</label>${segChips("q4",[["1",t("yes")],["0",t("no")]],st.evcil?"1":"0")}</div><div id="petBox"></div>
      <div class="row" style="gap:10px;margin-top:6px"><div id="sv" class="grow"></div><button class="btn ghost" id="cx">${t("cancel")}</button></div>`;
    const sync=()=>{st.oturan=$("#oturan").value;st.oturan_tel=$("#oturanTel").value;st.acil_ad=$("#an").value;st.acil_yak=$("#ay").value;st.acil_tel=$("#at").value;
      if($("#plaka")){st.plaka=$("#plaka").value;st.model=$("#model").value;st.otopark=$("#otopark").value;}
      if($("#sahipAd"))st.sahip_ad=$("#sahipAd").value;if($("#sahipTel"))st.sahip_tel=$("#sahipTel").value;if($("#petInfo"))st.evcil_bilgi=$("#petInfo").value;};
    body.querySelectorAll("#q1 [data-v]").forEach(b=>b.onclick=()=>{sync();st.sahiplik=b.dataset.v;if(st.sahiplik==="sahip"&&!st.sahip_ad)st.sahip_ad=st.oturan;draw();});
    body.querySelectorAll("#q2 [data-v]").forEach(b=>b.onclick=()=>{sync();st.odeyen=b.dataset.v;draw();});
    body.querySelectorAll("#q3 [data-v]").forEach(b=>b.onclick=()=>{sync();st.arac=b.dataset.v==="1";draw();});
    body.querySelectorAll("#q4 [data-v]").forEach(b=>b.onclick=()=>{sync();st.evcil=b.dataset.v==="1";draw();});
    if(st.sahiplik==="kiraci")$("#ownBox").innerHTML=`<div class="row" style="gap:10px"><div class="field grow"><label>${t("owner_name")}</label><input class="inp" id="sahipAd" value="${esc(st.sahip_ad)}" placeholder="Ev Sahibinin Adı Soyadı"></div><div class="field grow"><label>${t("owner")} ${t("phone")}</label><input class="inp m" id="sahipTel" value="${esc(st.sahip_tel)}" placeholder="+90 5.."></div></div>`;
    if(st.arac)$("#vehBox").innerHTML=`<div class="field"><label>${t("plate")}</label><input class="inp m" id="plaka" value="${esc(st.plaka)}"></div><div class="row" style="gap:10px"><div class="field grow"><label>${t("model")}</label><input class="inp" id="model" value="${esc(st.model)}"></div><div class="field" style="min-width:130px"><label>${t("parking")}</label>${parkSelect(st.otopark,spots)}</div></div>`;
    if(st.evcil)$("#petBox").innerHTML=`<div class="field"><label>${t("pet_info")}</label><input class="inp" id="petInfo" value="${esc(st.evcil_bilgi)}"></div>`;
    
    const otInp = $("#oturan");
    if(otInp) otInp.oninput = () => { st.oturan = otInp.value; syncOdeyenNot(); };
    const shInp = $("#sahipAd");
    if(shInp) shInp.oninput = () => { st.sahip_ad = shInp.value; syncOdeyenNot(); };

    function syncOdeyenNot(){
      const notEl = $("#medOdeyenNot");
      if(!notEl) return;
      const isK = st.sahiplik === "kiraci";
      notEl.innerHTML = st.odeyen === "kiraci"
        ? (isK ? `✓ Makbuzlarda <b>Kiracının (${esc(st.oturan || "Kiracı")})</b> ismi yazar.` : `✓ Makbuzlarda <b>(${esc(st.oturan || "Sakin")})</b> ismi yazar.`)
        : (isK ? `✓ Makbuzlarda <b>Ev Sahibinin (${esc(st.sahip_ad || "Ev Sahibi")})</b> ismi yazar.` : `✓ Makbuzlarda <b>Ev Sahibinin (${esc(st.oturan || "Ev Sahibi")})</b> ismi yazar.`);
    }

    $("#cx").onclick=closeModal;
    $("#sv").appendChild(guard(h(`<button class="btn full">${t("save")}</button>`),async()=>{
      sync();
      if(!st.oturan.trim())throw new Error(isKiraci ? "Kiracının adını soyadını yazın" : t("resident_info"));
      if(st.sahiplik==="kiraci"&&!st.sahip_ad.trim())throw new Error("Ev sahibinin adını soyadını yazın");
      if(st.arac&&!st.plaka.trim())throw new Error(t("plate"));
      if(!st.acil_ad.trim()||!st.acil_yak.trim()||!st.acil_tel.trim())throw new Error(t("emergency"));
      if(st.evcil&&!st.evcil_bilgi.trim())throw new Error(t("pet_info"));
      
      const effectiveSahipAd = st.sahiplik === "sahip" ? st.oturan : (st.sahip_ad || null);

      await rpc("daire_detay_kaydet",{
        p_oturan_ad:st.oturan,
        p_sahiplik:st.sahiplik,
        p_aidat_odeyen:st.odeyen,
        p_sahip_ad:effectiveSahipAd,
        p_sahip_tel:st.sahip_tel||null,
        p_arac_var:st.arac,
        p_arac_plaka:st.plaka||null,
        p_arac_model:st.model||null,
        p_arac_otopark:st.otopark||null,
        p_acil_ad:st.acil_ad,
        p_acil_yakinlik:st.acil_yak,
        p_acil_tel:st.acil_tel,
        p_evcil_var:st.evcil,
        p_evcil_bilgi:st.evcil_bilgi||null,
        p_ekstra:{oturan_tel:st.oturan_tel||""}, 
        p_daire: isYon()? r.daire_id : null
      });

      closeModal();toast(t("save")+" ✓");refresh();
    }));
  }
  parkSpots().then(x=>{spots=x;draw();});
}

/* ================= GÖREVLİ & OPERASYON ================= */
const FREQ={gunluk:1,haftalik:7,iki_haftalik:14,aylik:30};
function SIKLIK(k){const map={gunluk:{tr:"Günlük",en:"Daily",ru:"Ежедн.",de:"Täglich"},haftalik:{tr:"Haftalık",en:"Weekly",ru:"Еженед.",de:"Wöchentl."},iki_haftalik:{tr:"2 haftada bir",en:"Biweekly",ru:"Раз в 2 нед.",de:"Zweiwöch."},aylik:{tr:"Aylık",en:"Monthly",ru:"Ежемес.",de:"Monatl."}};return (map[k]&&(map[k][LANG]||map[k].tr))||k;}
function rutinGecikti(r){if(!r.son_yapilma)return true;return (Date.now()-new Date(r.son_yapilma))/86400000>=(FREQ[r.siklik]||30);}
async function scrOperasyon(c){
  if(["talepler","rutinler","gorevliler"].indexOf(S.sub)<0)S.sub="talepler";
  c.innerHTML=`<div class="subtabs" id="st">
    <button class="subtab ${S.sub==='talepler'?'on':''}" data-s="talepler">${t("tasks")}</button>
    <button class="subtab ${S.sub==='rutinler'?'on':''}" data-s="rutinler">${t("routines")}</button>
    ${(isYon()||isGor())?`<button class="subtab ${S.sub==='gorevliler'?'on':''}" data-s="gorevliler">${t("staff_list")}</button>`:""}
    </div><div id="ob"></div>`;
  c.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;scrOperasyon(c);});
  const ob=$("#ob");
  if(S.sub==="gorevliler")return opGorevliler(ob);
  if(S.sub==="talepler")  return opKayitlar(ob,"talep");
  return opRutinler(ob);
}

      <div class="row" style="gap:10px"><div id="sv" class="grow"></div><button class="btn ghost" id="cx">${t("cancel")}</button></div>`;

    body.querySelectorAll("#roles [data-r]").forEach(b=>b.onclick=()=>{sync();const r=b.dataset.r;st.roller.includes(r)?st.roller=st.roller.filter(z=>z!==r):st.roller.push(r);draw();});
    body.querySelectorAll("#days [data-d]").forEach(b=>b.onclick=()=>{sync();const d=+b.dataset.d;st.gunler.includes(d)?st.gunler=st.gunler.filter(z=>z!==d):st.gunler.push(d);draw();});
    $("#cx").onclick=closeModal;
    $("#sv").appendChild(guard(h(`<button class="btn full">${t("save")}</button>`),async()=>{
      sync(); if(!st.roller.length)throw new Error(t("title_role"));
      if(!st.acil_ad.trim()||!st.acil_yak.trim()||!st.acil_tel.trim())throw new Error(t("emergency"));
      await rpc("gorevli_detay_kaydet",{p_roller:st.roller,p_unvan:st.unvan||null,p_telefon:st.tel||null,p_acil_ad:st.acil_ad,p_acil_yakinlik:st.acil_yak,p_acil_tel:st.acil_tel,p_mesai_bas:st.bas||null,p_mesai_bit:st.bit||null,p_calisma_gun:st.gunler,p_profil:x.profil_id});
      closeModal();toast(t("save")+" ✓");refresh();
    }));
  }
  draw();
}
/* Talep ve bildiri aynı tablodan gelir; yalnızca "tur" alanı farklıdır.
   Ayrı fonksiyon yazmak yerine tek fonksiyon iki türü de çiziyor. */
async function opKayitlar(c, tur){
  const bildiri = tur==="bildiri";
  c.innerHTML=`<div class="loading"><span class="spin"></span></div>`;

  let kayitlar=[], dm={map:{}}, prof={};
  try{
    const r=await sb.from("talepler").select("*")
      .eq("site_id",S.site.id).eq("tur",tur)
      .order("created_at",{ascending:false});
    if(r.error) throw r.error;
    kayitlar=r.data||[];
  }catch(e){
    /* tur sütunu henüz yoksa eski davranışa düş */
    const r=await sb.from("talepler").select("*").eq("site_id",S.site.id)
      .order("created_at",{ascending:false});
    kayitlar=(r.data||[]).filter(x=>(x.tur||"talep")===tur);
  }

  dm=await daireMap();
  const pr=await sb.from("profiller").select("id,ad,rol,daire_id").eq("site_id",S.site.id);
  (pr.data||[]).forEach(p=>prof[p.id]=p);
  const gorevliler=(pr.data||[]).filter(p=>p.rol==="gorevli");

  c.innerHTML=`
    <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="small mut">${bildiri
        ? "Görevlinin üstlenip fotoğrafla tamamlayacağı işler."
        : "Sakinlerin bildirdiği arıza ve sorunlar."}</div>
      ${!isGor()?`<button class="btn sm" id="yeniKayit">${I.plus}<span>${bildiri?"Bildiri aç":"Talep aç"}</span></button>`:""}
    </div>
    <div id="tl"></div>`;

  /* Madde 3.1: görevli talep açamaz, yalnızca görüp işlem yapabilir. */
  if($("#yeniKayit")) $("#yeniKayit").onclick=()=>kayitAcModal(tur,()=>opKayitlar(c,tur));

  const tl=$("#tl");
  if(!kayitlar.length){ tl.innerHTML=`<div class="card pad">${empty(bildiri?"Henüz bildiri yok.":"Henüz talep yok.")}</div>`; return; }

  kayitlar.forEach(x=>{
    const acan=prof[x.acan];
    const dEt=x.daire_id?dm.map[x.daire_id]:(acan?.daire_id?dm.map[acan.daire_id]:"");
    const atanan=prof[x.atanan];
    const mine=x.atanan===S.user.id;
    const kapali=x.durum==="kapandi";

    const card=h(`<div class="card pad-sm" style="margin-bottom:11px"><div class="row" style="gap:12px;align-items:flex-start">
      ${x.foto_url?`<img src="${esc(x.foto_url)}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;cursor:pointer" data-fo>`:`<div class="feed-dot" style="width:44px;height:44px;background:var(--card2);color:var(--mut)">${bildiri?I.tool:I.chat}</div>`}
      <div class="grow"><div class="between"><div class="row" style="gap:7px">
        ${x.kategori?`<span class="badge acc plain">${esc(x.kategori)}</span>`:""}${badgeT(x.durum)}${mine&&!kapali?`<span class="badge wa plain">${LANG==="tr"?"Sende":"You"}</span>`:""}</div>
        <span class="small faint">${timeAgo(x.created_at)}</span></div>
        <div style="margin:7px 0;font-size:14px;line-height:1.45">${esc(x.metin)}</div>
        <div class="small faint">${acan?esc(acan.ad||t("role_sakin")):""}${dEt?" · "+t("units")+" "+esc(dEt):""}${atanan?` · <span style="color:var(--acc2)">${esc(atanan.ad||t("role_gorevli"))}</span>`:""}</div>
        ${kapali&&x.kapatma_foto?`<div style="margin-top:8px"><img src="${esc(x.kapatma_foto)}" style="max-width:180px;border-radius:10px;cursor:pointer" data-kf>
          <div class="small" style="color:var(--ok-tx);margin-top:4px">✓ Tamamlandı${x.kapatma_notu?" — "+esc(x.kapatma_notu):""}</div></div>`
          : (kapali&&x.kapatma_notu?`<div class="small" style="color:var(--ok-tx);margin-top:5px">✓ ${esc(x.kapatma_notu)}</div>`:"")}
        <div class="row wrap" style="gap:8px;margin-top:10px" id="ta-${x.id}"></div></div></div></div>`);

    if(card.querySelector("[data-fo]")) card.querySelector("[data-fo]").onclick=()=>window.open(x.foto_url,"_blank");
    if(card.querySelector("[data-kf]")) card.querySelector("[data-kf]").onclick=()=>window.open(x.kapatma_foto,"_blank");

    const a=card.querySelector(`#ta-${x.id}`);

    if(!kapali){
      /* Yönetici: görevliye atayabilir */
      if(isYon()){
        const sel=h(`<select class="inp" style="max-width:200px;padding:7px 28px 7px 11px;font-size:12.5px"><option value="">${t("assign_staff")}</option>${gorevliler.map(g=>`<option value="${g.id}" ${x.atanan===g.id?"selected":""}>${esc(g.ad||t("role_gorevli"))}</option>`).join("")}</select>`);
        sel.onchange=async()=>{try{
          await sb.from("talepler").update({atanan:sel.value||null,durum:sel.value?"atandi":"acik"}).eq("id",x.id);
          if(sel.value){
            bildirimGonder({
              alici_id:sel.value, tur:"talep_atama",
              baslik:"🛠️ Size Bir Talep Atandı",
              metin:(x.aciklama||x.baslik||"Yeni görev").slice(0,80),
              kaynak_tablo:"talepler", kaynak_id:x.id,
              hedef_ekran:"operasyon", onem:"yuksek"
            });
            if(x.olusturan && x.olusturan!==sel.value){
              bildirimGonder({
                alici_id:x.olusturan, tur:"talep_durum",
                baslik:"🛠️ Talebiniz İşleme Alındı",
                metin:"Bildirdiğiniz konu bir görevliye atandı.",
                kaynak_tablo:"talepler", kaynak_id:x.id,
                hedef_ekran:"operasyon", onem:"normal"
              });
            }
          }
          toast("✓"); opKayitlar(c,tur);
        }catch(e){toast(niceError(e),"err");}};
        a.appendChild(sel);
      }
      /* Görevli ve yönetici: üstlenebilir ve tamamlayabilir */
      if(isGor()||isYon()){
        if(!mine) a.appendChild(guard(h(`<button class="btn sm">${t("take_task")}</button>`),async()=>{
          const r=await sb.rpc("bildiri_ustlen",{p_id:x.id});
          if(r.error) throw r.error;
          toast("Üstlenildi ✓"); opKayitlar(c,tur);
        }));
        a.appendChild(guard(h(`<button class="btn ok sm">${t("close_task")}</button>`),
          async()=>kayitKapatModal(x.id,tur,()=>opKayitlar(c,tur))));
      }
    }

    /* Silme: YALNIZCA yönetici. Görevli kendi açtığını bile silemez —
       hoşuna gitmeyen kaydı silmesini engellemek için. */
    if(isYon()){
      const sil=h(`<button class="iconbtn" title="${t('delete')}">${I.trash}</button>`);
      sil.onclick=async()=>{
        if(!confirm((bildiri?"Bildiri":"Talep")+" silinsin mi? Bu işlem geri alınamaz."))return;
        try{ const {error}=await sb.from("talepler").delete().eq("id",x.id);
          if(error) throw error; toast("Silindi"); opKayitlar(c,tur);
        }catch(e){ toast(niceError(e),"err"); }
      };
      a.appendChild(sil);
    }
    tl.appendChild(card);
  });
}

/* PC ve mobilde kamera açma modalı (getUserMedia desteğiyle) */
async function kameraCekModal(onCapture){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast(LANG==="tr"?"Tarayıcınız doğrudan kamera erişimini desteklemiyor":"Camera access not supported","err");
    return;
  }
  let stream = null;
  const kMdl = modal(`
    <h3 style="font-size:17px;margin-bottom:12px">${LANG==="tr"?"Fotoğraf Çek":"Take Photo"}</h3>
    <div style="position:relative;width:100%;max-width:420px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden;min-height:240px;display:grid;place-items:center">
      <video id="camVideo" autoplay playsinline style="width:100%;height:auto;display:block"></video>
      <canvas id="camCanvas" style="display:none"></canvas>
      <div id="camLoading" class="center"><span class="spin" style="color:var(--acc)"></span></div>
    </div>
    <div class="row wrap" style="gap:10px;margin-top:14px;justify-content:center">
      <button type="button" class="btn" id="camSnapBtn" style="min-width:140px">${LANG==="tr"?"Fotoğrafı Çek":"Capture"}</button>
      <button type="button" class="btn ghost" id="camKapatBtn">${LANG==="tr"?"İptal":"Cancel"}</button>
    </div>
  `);
  
  const video = kMdl.querySelector("#camVideo");
  const canvas = kMdl.querySelector("#camCanvas");
  const loading = kMdl.querySelector("#camLoading");
  const snapBtn = kMdl.querySelector("#camSnapBtn");
  const kapatBtn = kMdl.querySelector("#camKapatBtn");
  
  function durdur(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }
  
  kapatBtn.onclick = () => { durdur(); closeModal(); };
  
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      loading.style.display = "none";
      video.play().catch(()=>{});
    };
  } catch(err) {
    durdur();
    closeModal();
    toast(LANG==="tr"?"Kamera açılamadı veya izin verilmedi":"Camera permission denied or not available","err");
    return;
  }
  
  snapBtn.onclick = () => {
    try {
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, w, h);
      canvas.toBlob((blob) => {
        durdur();
        closeModal();
        if(blob){
          const file = new File([blob], `kamera_${Date.now()}.jpg`, { type: "image/jpeg" });
          onCapture(file);
        }
      }, "image/jpeg", 0.9);
    } catch(err) {
      durdur();
      closeModal();
      console.error(err);
    }
  };
}

/* Madde 5: fotoğraf eklerken kullanıcı galeriden seçmek ya da kamerayla
   anlık çekmek arasında açıkça seçim yapabilmeli — tarayıcının varsayılan
   dosya seçicisine bırakmak yerine iki ayrı düğme. Hem talep açarken hem
   görevli tamamlarken kullanılıyor; tek yerde yazılıp ikisinde de çağrılıyor. */
function fotoAlaniHtml(idOnek, zorunluMu){
  return `<div class="field"><label>${t("photo")} ${zorunluMu
      ? '<span style="color:var(--no-tx)">*</span>'
      : `<span class="faint">(${t("optional")})</span>`}</label>
    <div class="row" style="gap:8px">
      <button type="button" class="btn ghost sm" id="${idOnek}BtnGaleri">${LANG==="tr"?"Galeriden seç":"Choose from gallery"}</button>
      <button type="button" class="btn ghost sm" id="${idOnek}BtnKamera">${LANG==="tr"?"Kamerayla çek":"Take a photo"}</button>
    </div>
    <input type="file" id="${idOnek}Galeri" accept="image/*" style="display:none">
    <input type="file" id="${idOnek}Kamera" accept="image/*" capture="environment" style="display:none">
    <div class="small faint" id="${idOnek}Ad" style="margin-top:6px"></div>
  </div>`;
}
/* mdl içinde fotoAlaniHtml ile çizilen alanı bağlar, seçili dosyayı
   döndüren bir fonksiyon verir. */
function fotoAlaniBagla(mdl, idOnek){
  let secili=null;
  const g=mdl.querySelector("#"+idOnek+"Galeri"), k=mdl.querySelector("#"+idOnek+"Kamera");
  const ad=mdl.querySelector("#"+idOnek+"Ad");
  const btnG=mdl.querySelector("#"+idOnek+"BtnGaleri"), btnK=mdl.querySelector("#"+idOnek+"BtnKamera");
  
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");

  if(btnG) btnG.onclick=()=>g.click();
  if(btnK) {
    btnK.onclick=()=>{
      // Mobilde yerel kamera inputu tetiklenir, PC'de canlı kamera akışı açılır
      if(!isMobile && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        kameraCekModal((file)=>{
          secili = file;
          if(ad) ad.textContent = (LANG==="tr"?"Çekildi: ":"Captured: ") + file.name;
        });
      } else {
        k.click();
      }
    };
  }
  const sec=(inp)=>{
    if(inp.files && inp.files[0]){
      secili=inp.files[0];
      if(ad) ad.textContent=(LANG==="tr"?"Seçildi: ":"Selected: ")+secili.name;
    }
  };
  if(g) g.onchange=()=>sec(g);
  if(k) k.onchange=()=>sec(k);
  return ()=>secili;
}

/* Yeni talep veya bildiri açma — herkes açabilir. */
function kayitAcModal(tur, refresh){
  const bildiri = tur==="bildiri";
  const st={kat:"ariza"};
  const mdl=modal(`
    <h2 style="font-size:19px;margin-bottom:4px">${bildiri?"Yeni bildiri":"Yeni talep"}</h2>
    <p class="small mut" style="margin-bottom:16px">${bildiri
      ? "Yapılması gereken bir iş bildirin. Görevli üstlenip fotoğrafla tamamlayacak."
      : "Arıza ya da sorununuzu bildirin."}</p>

    <div class="field"><label>${t("category")}</label>
      <div class="chips" id="kt">${KATLIST.map(([k,l])=>`<button type="button" class="fchip ${k==='ariza'?'on':''}" data-k="${k}">${l[LANG]||l.tr}</button>`).join("")}</div></div>

    <div class="field"><label>${t("description")}</label>
      <textarea class="inp" id="mt" style="min-height:100px" maxlength="1000"
        placeholder="${bildiri?"Örn. A Blok 4. kat merdiveni kirli":"Ne oldu, nerede?"}"></textarea></div>

    ${fotoAlaniHtml("ka",false)}

    <div id="kaSv"></div>
    <button class="btn ghost full" id="kaCx" style="margin-top:8px">${t("cancel")}</button>
  `);
  mdl.querySelector("#kaCx").onclick=closeModal;
  mdl.querySelectorAll("#kt [data-k]").forEach(b=>b.onclick=()=>{
    st.kat=b.dataset.k;
    mdl.querySelectorAll("#kt [data-k]").forEach(x=>x.classList.toggle("on",x===b));
  });
  const kaFoto=fotoAlaniBagla(mdl,"ka");

  mdl.querySelector("#kaSv").appendChild(guard(h(`<button class="btn full">${t("send")}</button>`),async()=>{
    const metin=mdl.querySelector("#mt").value.trim();
    if(metin.length<3) throw new Error("Açıklama yazın");
    const f=kaFoto();
    const url=f?await uploadFoto(f,"talep"):null;
    const {error, data: yeniTalep}=await sb.from("talepler").insert({
      site_id:S.site.id, daire_id:S.prof.daire_id, acan:S.user.id,
      kategori:katAd(st.kat), metin, foto_url:url, durum:"acik", tur}).select("id").maybeSingle();
    if(error) throw error;

    bildirimGonder({
      alici_rol: "yoneticiler",
      tur: "talep_yeni",
      baslik: `🛠️ Yeni ${bildiri ? "Bildiri" : "Talep"}: ${katAd(st.kat)}`,
      metin: metin.slice(0, 80),
      kaynak_tablo: "talepler",
      kaynak_id: yeniTalep?.id,
      hedef_ekran: "operasyon",
      onem: "normal"
    });

    closeModal(); toast("Gönderildi ✓"); refresh();
  }));
}

/* Kapatma — fotoğraf opsiyonel (Madde 5). Bildiri modülü kaldırıldığında
   bu alan yanlışlıkla "bildiri"ye özel bir koşula bağlıydı ve talep
   tamamlanırken fotoğraf ekleme imkânı tamamen kaybolmuştu; düzeltildi. */
function kayitKapatModal(id, tur, refresh){
  const mdl=modal(`
    <h2 style="font-size:19px;margin-bottom:4px">${t("close_task")}</h2>

    ${fotoAlaniHtml("kk",false)}

    <div class="field"><label>${LANG==="tr"?"Kapanış notu":"Note"} <span class="faint">(${t("optional")})</span></label>

    <div id="kkSv"></div>

  `);
  mdl.querySelector("#kkCx").onclick=closeModal;
  const kkFoto=fotoAlaniBagla(mdl,"kk");

}

/* ================= KASA (gelir & gider — herkese görünür) ================= */
async function scrKasa(c){
  c.innerHTML = `<div class="loading"><span class="spin"></span></div>`;
  const hs = await kasaHareketleriGetir(S.per.y, S.per.m);
  const faturalar = getFisFaturalar();
  const gelir = hs.filter(x=>x.tip==="gelir").reduce((a,x)=>a+Number(x.tutar),0);
  const gider = hs.filter(x=>x.tip==="gider").reduce((a,x)=>a+Number(x.tutar),0);
  const bakiye = gelir - gider;

  c.innerHTML = "";
  c.appendChild(periodBar(()=>scrKasa(c)));
  const wrap = h(`<div></div>`);
  wrap.innerHTML = `<div class="statline">
      <div class="card stat"><div class="k">${t("net_balance")}</div><div class="v display m" style="color:${bakiye>=0?'var(--ok-tx)':'var(--no-tx)'}">${money(bakiye)}</div></div>
      <div class="card stat"><div class="k">${t("total_income")}</div><div class="v display m" style="color:var(--ok-tx)">${money(gelir)}</div></div>
      <div class="card stat"><div class="k">${t("total_expense")}</div><div class="v display m" style="color:var(--no-tx)">${money(gider)}</div></div></div>
    <div class="card pad"><div class="sectitle"><h2>${t("nav_kasa")}</h2>${isYon()?`<div class="row" style="gap:8px"><button class="btn ghost sm" id="ag">+ ${t("income")}</button><button class="btn sm" id="ax">+ ${t("expense")}</button></div>`:`<span class="badge acc plain">${LANG==="tr"?"Şeffaf":LANG==="ru"?"Прозрачно":LANG==="de"?"Transparent":"Transparent"}</span>`}</div>
      ${!hs.length?empty():`<div id="hl"></div>`}</div>`;
  c.appendChild(wrap);
  if(isYon()){$("#ag").onclick=()=>kasaModal("gelir",()=>scrKasa(c));$("#ax").onclick=()=>kasaModal("gider",()=>scrKasa(c));}
  if(hs.length){const hl=$("#hl");
    hs.forEach(x=>{
      const gel=x.tip==="gelir";
      const bagliFatura = faturalar.find(f => f.gider_id === x.id || (f.tutar === Number(x.tutar) && f.tarih === x.tarih));
      const row=h(`<div class="lrow"><div class="feed-dot" style="width:38px;height:38px;background:${gel?'var(--ok-soft)':'var(--no-soft)'};color:${gel?'var(--ok)':'var(--no)'}">${I.wallet}</div>
        <div class="grow"><div class="t1">${esc(x.aciklama||(gel?t("income"):t("expense")))}</div>
        <div class="t2">${new Date(x.tarih).toLocaleDateString(LANG==="tr"?"tr-TR":LANG)}${x.kategori?" · "+esc(x.kategori):""}${x.kaynak==="aidat"?" · "+(LANG==="tr"?"aidat":"dues"):""}</div></div>
        <div class="row" style="gap:8px;align-items:center">
          ${bagliFatura ? `<button class="btn sm ghost fat-btn" style="padding:2px 8px;font-size:11px" title="Fiş / Faturayı Görüntüle">📄 Fatura</button>` : ''}
          <div class="amt" style="color:${gel?'var(--ok-tx)':'var(--no-tx)'}">${gel?"+":"−"}${moneyM(x.tutar)}</div>
        </div>
        <div id="kd-${x.id}"></div></div>`);
      
      if(bagliFatura){
        row.querySelector(".fat-btn").onclick = () => pdfOnizleModal(bagliFatura);
      }

      if(isYon()&&x.kaynak!=="aidat"){
        const del=h(`<button class="iconbtn">${I.trash}</button>`);
        del.onclick=async()=>{
          if(!confirm("Sil?"))return;
          try{
            await sb.from("kasa_hareketleri").delete().eq("id",x.id);
            toast("✓");
            scrKasa(c);
          }catch(e){toast(niceError(e),"err");}
        };
        row.querySelector(`#kd-${x.id}`).appendChild(del);
      }
      hl.appendChild(row);
    });
  }
}

  const isGider = tip === "gider";

  const mdl=modal(`<h2 style="font-size:19px;margin-bottom:14px">${tip==="gelir"?t("income"):t("expense")}</h2>

    <div class="field"><label>${t("description")}</label><input class="inp" id="ac" placeholder="${tip==="gider"?(LANG==="tr"?"Asansör bakımı":"Elevator service"):(LANG==="tr"?"Aidat dışı gelir":"Other income")}"></div>

          <option value="Personel & Maaş">Personel & Maaş</option>
          <option value="Yönetim & Danışmanlık">Yönetim & Danışmanlık</option>
          <option value="Diğer Gider">Diğer Gider</option>
        </select>
        ` : `<input class="inp" id="kt" placeholder="Aidat dışı gelir">`}
      </div>
      <div class="field grow"><label>${LANG==="tr"?"Tarih":"Date"}</label><input class="inp" id="tr" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>

    ${isGider ? `
    <!-- Fiş / Fatura Belge Ekleme Bölümü -->
    <div style="border-top:1px solid var(--line);padding-top:12px;margin-top:10px;margin-bottom:14px">
      <div class="between" style="margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <label style="font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px">
          📄 Fiş / Fatura Görseli <span class="small faint" style="font-weight:400">(${t("optional")})</span>
        </label>
        <div class="row" style="gap:6px">
          <label class="btn sm ghost" style="cursor:pointer;margin:0" title="Fotoğraf veya PDF Yükle">
            📷 Görsel / PDF Ekle
            <input type="file" id="inpKasaGorsel" accept="image/*,application/pdf" style="display:none">
          </label>
          <button class="btn sm ghost" type="button" id="btnKasaTara" title="Eğikliği düzelt ve tara">📐 Tara (CamScanner)</button>
        </div>
      </div>

      <!-- Yüklenen Belge Önizleme Kartı -->
      <div id="kasaScanPreview" style="display:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px">
        <div class="between" style="align-items:center">
          <div class="row" style="gap:10px;align-items:center;min-width:0">
            <div id="kasaScanThumb" style="width:42px;height:42px;border-radius:6px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)">
              <span style="font-size:20px">📄</span>
            </div>
            <div style="min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="kasaScanTitle">Belge Eklendi</div>
              <div class="small faint" id="kasaScanMeta"></div>
            </div>
          </div>
          <button class="iconbtn" type="button" id="btnKasaScanSil" style="color:var(--no);flex:none;width:32px;height:32px" title="Belgeyi Kaldır">✕</button>
        </div>
      </div>

      <div class="row" style="gap:10px;margin-top:8px">
        <div class="field grow"><label>Firma / Kurum Adı <span class="faint">(Opsiyonel)</span></label><input class="inp sm" id="kasaFirma" placeholder="Örn. Enerjisa / Schindler / Koçtaş"></div>
        <div class="field grow"><label>Fiş/Fatura No <span class="faint">(Opsiyonel)</span></label><input class="inp sm m" id="kasaFisNo" placeholder="Örn. A01294"></div>
      </div>
    </div>
    ` : ''}

    <div class="row" style="gap:10px"><div id="sv" class="grow"></div><button class="btn ghost" id="cx">${t("cancel")}</button></div>`);
  
  mdl.querySelector("#cx").onclick=closeModal;
  tutarOnizleme("kasaTutar","kasaTutarOn");

  if(isGider){
    const scanPrev = mdl.querySelector("#kasaScanPreview");
    const scanTitle = mdl.querySelector("#kasaScanTitle");
    const scanMeta = mdl.querySelector("#kasaScanMeta");
    const scanThumb = mdl.querySelector("#kasaScanThumb");
    const scanSil = mdl.querySelector("#btnKasaScanSil");
    const fileInp = mdl.querySelector("#inpKasaGorsel");

    function updatePreview(res){
      tarananBelge = res;
      if(!res){
        scanPrev.style.display = "none";
        return;
      }
      scanPrev.style.display = "block";
      scanTitle.textContent = res.name || (res.pageCount ? `Taranan Belge (${res.pageCount} Sayfa)` : "Fiş / Fatura Görseli");
      scanMeta.textContent = `${boyutYaz(res.fileSize || 0)} · Belge Hazır`;
      if(res.pages && res.pages[0]){
        scanThumb.innerHTML = `<img src="${res.pages[0]}" style="width:100%;height:100%;object-fit:cover">`;
      } else {
        scanThumb.innerHTML = `<span style="font-size:20px">📄</span>`;
      }
    }

    if(fileInp){
      fileInp.onchange = async(e) => {
        const f = e.target.files && e.target.files[0];
        if(!f) return;
        try {
          if(f.type === "application/pdf"){
            const reader = new FileReader();
            reader.onload = () => {
              updatePreview({
                pdfDataUrl: reader.result,
                pages: [],
                pageCount: 1,
                fileSize: f.size,
                name: f.name,
                isPdf: true
              });
              toast("PDF faturası eklendi ✓");
            };
            reader.readAsDataURL(f);
          } else {
            // Görsel dosyasını optimize et ve yükle
            const comp = await compressImageFile(f, 1600, 0.85);
            if(comp){
              updatePreview({
                pdfDataUrl: comp.dataUrl,
                pages: [comp.dataUrl],
                pageCount: 1,
                fileSize: comp.size,
                name: f.name
              });
              toast("Görsel eklendi ✓");
            }
          }
        } catch(err){
          console.error("Dosya yukleme hatasi:", err);
          toast("Dosya yüklenemedi: " + (err.message || err), "err");
        }
      };
    }

    mdl.querySelector("#btnKasaTara").onclick = () => {
      camScannerModal({
        onComplete: (res) => {
          updatePreview(res);
          toast("Belge tarandı ve PDF hazırlandı ✓");
        }
      });
    };

    scanSil.onclick = () => {
      updatePreview(null);
      if(fileInp) fileInp.value = "";
    };
  }

  mdl.querySelector("#sv").appendChild(guard(h(`<button class="btn full ${tip==="gider"?"":"ok"}">${t("save")}</button>`),async()=>{
    const tutar=tutarOku($("#kasaTutar").value);
    if(isNaN(tutar)||tutar<=0)throw new Error(LANG==="tr"?"Geçerli bir tutar girin.":"Enter a valid amount.");
    
    const aciklama = $("#ac").value.trim() || null;
    const kategori = $("#kt").value.trim() || null;
    const tarih = $("#tr").value;

    const { data: gData, error }=await sb.from("kasa_hareketleri").insert({
      site_id:S.site.id,
      tip,
      tutar,
      aciklama,
      kategori,
      kaynak: isGider && tarananBelge ? "fatura" : "manuel",
      tarih,
      olusturan:S.user.id
    }).select("id").maybeSingle();
    
    if(error) throw error;

    // Fatura belgesi eklenmişse arşive ve belgeler tablosuna ekle
    if(isGider && tarananBelge){
      const firma = $("#kasaFirma") ? $("#kasaFirma").value.trim() : "";
      const fisNo = $("#kasaFisNo") ? $("#kasaFisNo").value.trim() : "";
      const faturaId = "fat_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
      const baslik = firma ? `${firma} Faturası` : (aciklama || "Gider Faturası");

      const fatObj = {
        id: faturaId,
        site_id: S.site.id,
        gider_id: gData ? gData.id : null,
        baslik,
        firma,
        fis_no: fisNo,
        tutar,
        tarih,
        kategori,
        aciklama,
        pdfData: tarananBelge.pdfDataUrl,
        fileSize: tarananBelge.fileSize || (tarananBelge.pdfDataUrl ? tarananBelge.pdfDataUrl.length : 0),
        pageCount: tarananBelge.pageCount || 1,
        pages: tarananBelge.pages || (tarananBelge.pdfDataUrl ? [tarananBelge.pdfDataUrl] : []),
        created_at: new Date().toISOString()
      };

      try {
        saveFisFatura(fatObj);
      } catch(e){
        console.error("Local storage kayit hatasi:", e);
      }

      try{
        await sb.from("belgeler").insert({
          site_id: S.site.id,
          baslik,
          kategori: "fatura",
          dosya_yolu: `faturalar/${faturaId}.pdf`,
          dosya_boyut: fatObj.fileSize,
          aciklama: (firma ? firma + " · " : "") + (fisNo ? `No: ${fisNo} · ` : "") + `${tutar} TL`,
          herkese_acik: false,
          olusturan: S.user.id
        });
      }catch(e){
        console.error("Belgeler insert hatasi:", e);
      }
    }

    closeModal();
    toast(LANG==="tr" ? (tarananBelge ? "Gider ve fatura belgesi kaydedildi ✓" : "Gider kaydedildi ✓") : "Saved ✓");
    refresh();
  }));
}

let ZIY_F="hepsi";
async function scrZiyaret(c){
  const [zR,dm]=await Promise.all([
    sb.from("ziyaretciler").select("*").eq("site_id",S.site.id).order("created_at",{ascending:false}).limit(200),
    daireMap(),
  ]);
  const zs=zR.data||[];
  const say={beklenen:zs.filter(z=>z.durum==="beklenen").length,icerde:zs.filter(z=>z.durum==="icerde").length,cikti:zs.filter(z=>z.durum==="cikti").length};
  c.innerHTML=`<div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="chips" id="zf">
        <button class="fchip ${ZIY_F==='hepsi'?'on':''}" data-f="hepsi">${t("all")}</button>
        <button class="fchip ${ZIY_F==='beklenen'?'on':''}" data-f="beklenen">${t("waiting")} · ${say.beklenen}</button>
        <button class="fchip ${ZIY_F==='icerde'?'on':''}" data-f="icerde">${t("inside")} · ${say.icerde}</button>
        <button class="fchip ${ZIY_F==='cikti'?'on':''}" data-f="cikti">${t("left")} · ${say.cikti}</button></div>
      <div class="row" style="gap:8px">
        ${(sakinMi()||isGor()||isYon())?`<button class="btn sm" id="ann">${I.plus}<span>${t("announce_visitor")}</span></button>`:""}</div></div>
    <div class="note" style="margin-bottom:14px">${LANG==="tr"?"Beklenen ziyaretçiyi önceden bildir; güvenlik kapıda seni aramadan içeri alır. Tüm giriş-çıkışları herkes görür.":LANG==="ru"?"Заранее сообщите об ожидаемом госте; охрана впустит без звонка. Все входы-выходы видны всем.":LANG==="de"?"Erwartete Besucher vorab ankündigen; die Sicherheit lässt sie ohne Anruf ein. Alle Ein-/Austritte sind für alle sichtbar.":"Announce expected visitors in advance; security lets them in without calling you. Everyone sees all entries/exits."}</div>
    <div class="card pad"><div id="zl" class="kolon2"></div></div>`;
  c.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ZIY_F=b.dataset.f;scrZiyaret(c);});
  if($("#ann"))$("#ann").onclick=()=>ziyaretModal("beklenen",dm,()=>scrZiyaret(c));
  const list=ZIY_F==="hepsi"?zs:zs.filter(z=>z.durum===ZIY_F);
  const zl=$("#zl");
  if(!list.length){zl.innerHTML=empty();return;}
  list.forEach(z=>{
    const et=z.daire_id?dm.map[z.daire_id]:null;
    const lc=z.durum==="icerde"?"ok":z.durum==="cikti"?"":"wa";
    const badgeC=z.durum==="icerde"?"ok":z.durum==="cikti"?"mutb":"wa";
    const badgeL=z.durum==="icerde"?t("inside"):z.durum==="cikti"?t("left"):t("waiting");
    const times=[z.giris_zamani?"↓ "+fmtDateTime(z.giris_zamani):"",z.cikis_zamani?"↑ "+fmtDateTime(z.cikis_zamani):"",(z.durum==="beklenen"&&z.beklenen_zaman)?"⌛ "+fmtDateTime(z.beklenen_zaman):""].filter(Boolean).join(" · ");
    const row=h(`<div class="vcard ${z.durum}">
      <div class="vhead">
        <div class="feed-dot" style="width:38px;height:38px;flex:none;background:var(--card2);color:var(--ink2)">${I.door}</div>
        <div class="grow" style="min-width:0">
          <div class="t1">${esc(z.ad)}${z.firma?` <span class="faint" style="font-weight:400">· ${esc(z.firma)}</span>`:""}</div>
          <div class="t2">${et?t("units")+" "+esc(et)+" · ":""}${z.aciklama?esc(z.aciklama)+" · ":""}${times||timeAgo(z.created_at)}</div>
        </div>
        <span class="badge ${badgeC}">${badgeL}</span>
      </div>
      <div class="vact" id="za-${z.id}"></div></div>`);
    const a=row.querySelector(`#za-${z.id}`);
    if(z.tel)a.insertAdjacentHTML("beforeend",callWa(z.tel,""));
    if(isGor()||isYon()){
      if(z.durum==="beklenen")a.appendChild(guard(h(`<button class="btn sm ok">${t("log_entry")}</button>`),async()=>{await sb.from("ziyaretciler").update({durum:"icerde",giris_zamani:new Date().toISOString()}).eq("id",z.id);toast("✓");scrZiyaret(c);}));
      else if(z.durum==="icerde")a.appendChild(guard(h(`<button class="btn sm ghost">${t("log_exit")}</button>`),async()=>{await sb.from("ziyaretciler").update({durum:"cikti",cikis_zamani:new Date().toISOString()}).eq("id",z.id);toast("✓");scrZiyaret(c);}));
    }
    if(z.kaydeden===S.user.id||isYon()){const del=h(`<button class="iconbtn">${I.trash}</button>`);del.onclick=async()=>{if(!confirm("Sil?"))return;try{await sb.from("ziyaretciler").delete().eq("id",z.id);toast("✓");scrZiyaret(c);}catch(e){toast(niceError(e),"err");}};a.appendChild(del);}
    if(!a.children.length)a.remove();
    zl.appendChild(row);
  });
}

      <label>${mode==="beklenen"
        ? (LANG==="tr"?"Beklenen zaman":"Expected time")
        : (LANG==="tr"?"Giriş zamanı":"Entry time")}
        <span class="faint">(${mode==="beklenen"?t("optional"):(LANG==="tr"?"geçmiş kayıt için değiştirin":"change for past entries")})</span></label>
      <input class="inp" id="bz" type="datetime-local" value="${mode==="beklenen"?"":simdiYerel()}">
      <div class="small faint" id="bzNot" style="margin-top:5px;min-height:16px"></div>
    </div>
    <div class="field"><label>${t("description")} <span class="faint">(${t("optional")})</span></label><input class="inp" id="ac" placeholder="${LANG==="tr"?"Örn. Televizyon tamircisi":"e.g. TV repair"}"></div>
    <div class="row" style="gap:10px"><div id="sv" class="grow"></div><button class="btn ghost" id="cx">${t("cancel")}</button></div>`);
  mdl.querySelector("#cx").onclick=closeModal;

  /* Seçilen zamana göre kaydın hangi durumda açılacağını önceden bildir. */
  (function zamanNotu(){
    const i=mdl.querySelector("#bz"), n=mdl.querySelector("#bzNot");
    if(!i||!n) return;
    const ciz=()=>{
      if(!i.value){ n.textContent=""; return; }
      const f=new Date(i.value).getTime()-Date.now();
      n.textContent = f > 5*60*1000  ? "Bekleniyor olarak kaydedilecek"
                    : f < -2*60*60*1000 ? "Ziyaret tamamlanmış (çıktı) olarak kaydedilecek"
                    : "İçeride olarak kaydedilecek";
    };
    i.addEventListener("input",ciz); i.addEventListener("change",ciz); ciz();
  })();

  mdl.querySelector("#sv").appendChild(guard(h(`<button class="btn full">${mode==="beklenen"?t("send"):t("save")}</button>`),async()=>{
    const ad=$("#ad").value.trim();if(!ad)throw new Error(t("name_surname"));
    const rec={site_id:S.site.id,ad,firma:$("#fr").value.trim()||null,tel:$("#tl").value.trim()||null,
      daire_id:$("#dd")?.value||null,aciklama:$("#ac").value.trim()||null,kaydeden:S.user.id};
    /* Durum, seçilen zamana göre belirlenir — hangi düğmeye basıldığına değil.
       Gelecek bir saat girildiyse ziyaretçi henüz gelmemiştir (beklenen).
       Geçmiş bir saat girildiyse ziyaret olup bitmiştir (çıktı).
       Şu ana yakınsa içeridedir. */
    const zaman = $("#bz")?.value;
    const dt    = zaman ? new Date(zaman) : new Date();
    const simdi = Date.now();
    const fark  = dt.getTime() - simdi;          // pozitif = gelecek

    if(fark > 5*60*1000){                        // 5 dakikadan fazla ileride
      rec.durum="beklenen"; rec.beklenen=true;
      rec.beklenen_zaman=dt.toISOString();
    } else if(fark < -2*60*60*1000){             // 2 saatten fazla geçmişte
      rec.durum="cikti"; rec.beklenen=false;
      rec.giris_zamani=dt.toISOString();
      rec.cikis_zamani=dt.toISOString();
    } else {                                     // şu an civarı
      rec.durum="icerde"; rec.beklenen=false;
      rec.giris_zamani=dt.toISOString();
    }
    const {error}=await sb.from("ziyaretciler").insert(rec);if(error)throw error;
    closeModal();toast("✓");refresh();
  }));
}

async function toplantiList(c){
  c.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  const [tR,kR,pR]=await Promise.all([
    sb.from("toplantilar").select("*").eq("site_id",S.site.id).order("zaman",{ascending:false}),
    sb.from("toplanti_katilim").select("toplanti_id,profil_id,durum").eq("site_id",S.site.id),
    sb.from("profiller").select("id,ad,daire_id").eq("site_id",S.site.id),
  ]);
  const toplantilar=tR.data||[]; const kat=kR.data||[];
  const profMap={}; (pR.data||[]).forEach(p=>profMap[p.id]=p);
  const dm=await daireMap();

  c.innerHTML=`${isYon()?`<div class="sectitle"><h2>${t("meetings")}</h2><button class="btn sm" id="add">${t("new_meeting")}</button></div>`:""}<div id="tl"></div>`;
  if(isYon())$("#add").onclick=()=>toplantiModal(()=>toplantiList(c));
  const tl=$("#tl");
  if(!toplantilar.length){tl.innerHTML=`<div class="card pad">${empty()}</div>`;return;}

  const secenekler=[
    {kod:"katiliyor",  metin:t("attend")||"Katılıyorum",     renk:"var(--ok)"},
    {kod:"katilmiyor", metin:t("not_attend")||"Katılmıyorum",  renk:"var(--no)"},
    {kod:"kararsiz",   metin:t("unsure")||"Kararsızım",       renk:"var(--warn,#e6a23c)"}
  ];

  toplantilar.forEach(m=>{
    const rows=kat.filter(k=>k.toplanti_id===m.id);
    const toplam=rows.length;
    const mine=rows.find(r=>r.profil_id===S.user.id)?.durum;
    const oyVerdim=Boolean(mine);
    let seciliDurum=mine||"katiliyor";
    let duzenleme=!oyVerdim;

    const card=h(`<div class="card pad" style="margin-bottom:12px">
      <div class="between" style="align-items:flex-start;gap:10px;margin-bottom:6px">
        <div style="min-width:0">
          <div style="font-weight:600;font-size:16px">${esc(m.baslik)}</div>
          ${m.gundem?`<div class="small muted" style="margin-top:4px;white-space:pre-wrap;line-height:1.5">${esc(m.gundem)}</div>`:""}
        </div>
        <span class="badge ok">${LANG==="tr"?"Açık":"Open"}</span>
      </div>

      <div class="small faint" style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap">
        ${m.zaman?`<span>${t("datetime")}: <b>${fmtDateTime(m.zaman)}</b></span>`:""}
        ${m.yer?`<span>${t("place")}: <b>${esc(m.yer)}</b></span>`:""}
      </div>

      <div id="tp-govde-${m.id}"></div>
      <div class="vact" id="tp-eylem-${m.id}" style="justify-content:flex-start;margin-top:12px"></div>
    </div>`);

    const govde=card.querySelector(`#tp-govde-${m.id}`);
    const eylem=card.querySelector(`#tp-eylem-${m.id}`);

    function ciz(){
      if(duzenleme){
        govde.innerHTML=secenekler.map(s=>`
          <label class="row" style="gap:10px;align-items:center;padding:9px 0;cursor:pointer;border-bottom:1px solid var(--line)">
            <input type="radio" name="tp-${m.id}" value="${s.kod}"
              ${seciliDurum===s.kod?"checked":""} style="width:18px;height:18px;flex:none">
            <span>${esc(s.metin)}</span>
          </label>`).join("");

        govde.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
          seciliDurum=inp.value;
        });
      } else {
        govde.innerHTML=secenekler.map(s=>{
          const secimRows=rows.filter(r=>r.durum===s.kod);
          const n=secimRows.length;
          const yuzde=toplam?Math.round(n/toplam*100):0;
          const isMine=mine===s.kod;
          return `<div style="margin-bottom:10px">
            <div class="between" style="font-size:14px;margin-bottom:4px">
              <span>${esc(s.metin)}${isMine?` <span class="badge ok" style="margin-left:4px">${t("a_oyum")}</span>`:""}</span>
              <span class="m faint">${n} · %${yuzde}</span>
            </div>
            <div class="prog"><i style="width:${yuzde}%;background:${isMine?'var(--acc)':s.renk}"></i></div>
          </div>`;
        }).join("")+`<div class="small faint" style="margin-top:8px">${toplam} ${t("a_toplam")}</div>`;
      }

      eylem.innerHTML="";
      if(duzenleme){
        eylem.appendChild(guard(h(`<button class="btn sm">${t("a_oyver")}</button>`),async()=>{
          if(!seciliDurum) throw new Error("Bir seçenek işaretleyin");
          const {error}=await sb.from("toplanti_katilim").upsert({
            toplanti_id:m.id,
            profil_id:S.user.id,
            site_id:S.site.id,
            durum:seciliDurum
          });
          if(error) throw error;
          toast("Oyunuz kaydedildi ✓");
          toplantiList(c);
        }));
        if(oyVerdim){
          const v=h(`<button class="btn sm ghost">${t("cancel")}</button>`);
          v.onclick=()=>{ duzenleme=false; ciz(); };
          eylem.appendChild(v);
        }
      } else {
        const degistirBtn=h(`<button class="btn sm ghost">${oyVerdim?t("a_degistir"):t("a_oyver")}</button>`);
        degistirBtn.onclick=()=>{ duzenleme=true; ciz(); };
        eylem.appendChild(degistirBtn);
      }

      if(toplam>0){
        const kimlerBtn=h(`<button class="btn sm ghost">${t("a_kimler")}</button>`);
        kimlerBtn.onclick=()=>{
          const katilimciListesi=rows.map(r=>{
            const p=profMap[r.profil_id];
            const d=(p && p.daire_id)?dm.map[p.daire_id]:"";
            const secimMetin=secenekler.find(s=>s.kod===r.durum)?.metin||r.durum;
            return {
              ad: (p && p.ad)?p.ad:(LANG==="tr"?"Kullanıcı":"User"),
              daire: d,
              secim: secimMetin
            };
          });

          modal(`<h2 style="font-size:19px;margin-bottom:12px">${t("a_kimler")}</h2>
            <div style="max-height:50vh;overflow:auto">
              ${katilimciListesi.map(x=>`
                <div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)">
                  <div>
                    <span style="font-weight:500">${esc(x.ad)}</span>
                    ${x.daire?`<span class="small faint" style="margin-left:6px">· ${esc(x.daire)}</span>`:""}
                  </div>
                  <span class="small faint" style="font-weight:600">${esc(x.secim)}</span>
                </div>`).join("") || empty()}
            </div>
            <button class="btn ghost full" style="margin-top:14px" onclick="document.getElementById('modalHost').innerHTML=''">${t("close")}</button>`);
        };
        eylem.appendChild(kimlerBtn);
      }

      if(isYon()){
        const silBtn=h(`<button class="iconbtn" title="${t('delete')}">${I.trash}</button>`);
        silBtn.onclick=async()=>{
          if(!confirm("Toplantı ve katılım oyları silinsin mi?")) return;
          try{
            const {error}=await sb.from("toplantilar").delete().eq("id",m.id);
            if(error) throw error;
            toast("Silindi ✓");
            toplantiList(c);
          }catch(e){ toast(niceError(e),"err"); }
        };
        eylem.appendChild(silBtn);
      }
    }

    ciz();
    tl.appendChild(card);
  });
}

async function scrKodlar(c){
  const st={rol:"sakin",daire:""};
  const [dm,kR]=await Promise.all([daireMap(),sb.from("davet_kodlari").select("*").eq("site_id",S.site.id).eq("iptal",false).order("created_at",{ascending:false})]);
  const dolu=new Set();
  const pr=await sb.from("profiller").select("daire_id").eq("site_id",S.site.id).eq("rol","sakin");(pr.data||[]).forEach(p=>p.daire_id&&dolu.add(p.daire_id));
  c.innerHTML=`<div class="grid2 yapisik" style="align-items:start">
    <div class="card pad"><h2 style="font-size:16px;margin-bottom:14px">${t("gen_code")}</h2>
      <div class="field"><label>${LANG==="tr"?"Rol":"Role"}</label><div class="chips" id="rl"><button class="fchip on" data-r="sakin">${t("role_sakin")}</button><button class="fchip" data-r="gorevli">${t("role_gorevli")}</button></div></div>
      <div id="dbox" class="field"><label>${t("units")}</label><select class="inp" id="dd"><option value="">${LANG==="tr"?"Daire seç":"Select unit"}</option>${dm.list.map(d=>{const et=(d.blok?d.blok+"-":"")+d.no;return `<option value="${d.id}">${et}${dolu.has(d.id)?" ✓":""}</option>`;}).join("")}</select></div>
      <div class="field"><label>${t("name_surname")} <span class="faint" id="adNot">(${t("optional")})</span></label>
        <input class="inp" id="ad" maxlength="80" placeholder="Kodu kime vereceksiniz?">
        <div class="small faint" style="margin-top:5px">Kodun kime ait olduğunu sonradan bulabilmek için yazın.</div></div>
      <div id="sv"></div></div>
    <div class="card pad"><h2 style="font-size:16px;margin-bottom:12px">${t("active_codes")}</h2><div id="kl" class="kolon2"></div></div></div>`;
  c.querySelectorAll("#rl [data-r]").forEach(b=>b.onclick=()=>{st.rol=b.dataset.r;c.querySelectorAll("#rl [data-r]").forEach(x=>x.classList.toggle("on",x===b));$("#dbox").style.display=st.rol==="sakin"?"":"none";
    const an=$("#adNot"); if(an) an.textContent = st.rol==="gorevli" ? "(zorunlu)" : "("+t("optional")+")";});
  $("#sv").appendChild(guard(h(`<button class="btn full">${t("gen_code")}</button>`),async()=>{
    if(st.rol==="sakin"&&!$("#dd").value)throw new Error(LANG==="tr"?"Daire seç.":"Select unit.");
    /* Görevli kodunda ad zorunlu: daire bağı olmadığı için başka türlü
       hangi kodun kime ait olduğu anlaşılamıyor. */
    if(st.rol==="gorevli"&&$("#ad").value.trim().length<2)
      throw new Error("Görevlinin adını yazın. Kodun kime ait olduğu böyle bilinir.");
    const kod=await rpc("kod_uret",{p_rol:st.rol,p_daire:st.rol==="sakin"?$("#dd").value:null,p_ad:$("#ad").value.trim()||null});
    kodGosterModal(kod,st.rol);scrKodlar(c);
  }));
  const kl=$("#kl");
  if(!(kR.data||[]).length){kl.innerHTML=empty();}
  else kR.data.forEach(k=>{
    const et=k.daire_id?dm.map[k.daire_id]:"";
    const row=h(`<div class="lrow"><div class="feed-dot" style="width:36px;height:36px;background:var(--acc-soft);color:var(--acc2)">${k.rol==="gorevli"?I.shield:I.users}</div>
      <div class="grow"><div class="t1 m" style="letter-spacing:2px">${k.kod}</div><div class="t2">${t("role_"+k.rol)}${et?" · "+t("units")+" "+et:""}${k.ad?" · "+esc(k.ad):""}</div></div>
      <button class="iconbtn" title="${t('copy')}" data-cp>${I.copy}</button>
      <button class="iconbtn" title="Şifreyi sıfırla" data-sf>${I.key}</button>
      <button class="iconbtn" title="${t('delete')}" data-ip>${I.trash}</button></div>`);
    row.querySelector("[data-cp]").onclick=()=>copyText(k.kod);

    /* Şifre sıfırlama sunucuda yapılır — service_role gerektiriyor,
       tarayıcıya konulamaz. Netlify Function çağrılır. */
    row.querySelector("[data-sf]").onclick=async()=>{
      if(!confirm(`${k.kod} kodunun şifresi sıfırlansın mı?\n\nŞifre yeniden kodun kendisi olur. Kullanıcı bir sonraki girişte yeni şifre belirler.`)) return;
      try{
        const {data:{session}}=await sb.auth.getSession();
        const y=await fetch("/api/sifre-sifirla",{
          method:"POST",
          headers:{ "Content-Type":"application/json",
                    Authorization:"Bearer "+(session?.access_token||"") },
          body:JSON.stringify({kod_id:k.id})
        });
        const j=await y.json().catch(()=>({}));
        if(!y.ok) throw new Error(j.hata||j.ipucu||"Sıfırlanamadı");
        toast("Şifre sıfırlandı ✓");
        alert(`${k.kod}\n\nŞifre yeniden koda döndü. Kullanıcı bu kodu hem giriş kodu hem şifre olarak kullanacak, ardından yeni şifre belirleyecek.`);
      }catch(e){ toast(niceError(e),"err"); }
    };

    /* Kod silme = kişi silme. Kod bir kişiye bağlıysa o kişinin bütün
       verisi de silinir; bağlı kimse yoksa yalnızca kod iptal edilir. */
    row.querySelector("[data-ip]").onclick=async()=>{
      try{
        /* Bu kodu kullanmış bir profil var mı? */
        let sahip=null;
        if(k.daire_id){
          const {data:pl}=await sb.from("profiller")
            .select("id,ad,rol").eq("site_id",S.site.id).eq("daire_id",k.daire_id).eq("rol",k.rol);
          sahip=(pl||[])[0]||null;
        }

        if(sahip){
          kisiSilModal(sahip.id, sahip.ad, async()=>{
            try{ await sb.from("davet_kodlari").update({iptal:true}).eq("id",k.id); }catch(e){}
            scrKodlar(c);
          });
          return;
        }

        if(!confirm(`${k.kod} kodu iptal edilsin mi?\n\nBu kodla henüz giriş yapılmamış. Yalnızca kod iptal edilecek.`)) return;
        await sb.from("davet_kodlari").update({iptal:true}).eq("id",k.id);
        toast("Kod iptal edildi"); scrKodlar(c);
      }catch(e){ toast(niceError(e),"err"); }
    };
    kl.appendChild(row);
  });
}

function getMuhasebeciBilgileri(siteId){
  try{
    const sid = siteId || S.site?.id;
    if(sid){
      const d = localStorage.getItem(`kp_${sid}_muhasebeci`);
      if(d) return JSON.parse(d);
    }
    const gen = localStorage.getItem("kp_son_muhasebeci");
    if(gen) return JSON.parse(gen);
  }catch(e){}
  return { ad: "", eposta: "", tel: "", unvan: "Mali Müşavir / Muhasebeci" };
}

function saveMuhasebeciBilgileri(data, siteId){
  try{
    const sid = siteId || S.site?.id;

      localStorage.setItem(`kp_${sid}_muhasebeci`, JSON.stringify(data));
    }
    localStorage.setItem("kp_son_muhasebeci", JSON.stringify(data));
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   BELGE ARŞİVİ
   Dosyalar "belgeler" kovasında <site_id>/... yolunda tutulur.
   Kova özeldir; indirme imzalı geçici bağlantıyla yapılır.
   ═══════════════════════════════════════════════════════════════ */
const BELGE_KAT={yonetim_plani:"Yönetim planı",sigorta:"Sigorta poliçesi",rapor:"Rapor",
  sozlesme:"Sözleşme",tutanak:"Tutanak",fatura:"Fatura",ruhsat:"Ruhsat",diger:"Diğer"};
let BELGE_F="hepsi";

function boyutYaz(b){ if(!b) return "—";
  const k=1024; if(b<k) return b+" B";
  if(b<k*k) return (b/k).toFixed(0)+" KB";
  return (b/k/k).toFixed(1)+" MB"; }

async function scrBelge(c){
  const canSeeMakbuz = !isGor();
  const canSeeFatura = isYon();
  const validSubs = ["belgeler"];
  if(canSeeMakbuz) validSubs.push("makbuzlar");
  if(canSeeFatura) validSubs.push("fatura");

  if(!validSubs.includes(S.sub)){
    S.sub = "belgeler";
  }

  c.innerHTML = `
    <div class="subtabs" id="st" style="margin-bottom:16px">
      <button class="subtab ${S.sub==='belgeler'?'on':''}" data-s="belgeler">${I.folder} <span>${t("b_belgeler")}</span></button>
      ${canSeeMakbuz ? `<button class="subtab ${S.sub==='makbuzlar'?'on':''}" data-s="makbuzlar">${I.receipt} <span>${t("b_makbuzlar")}</span></button>` : ''}
      ${canSeeFatura ? `<button class="subtab ${S.sub==='fatura'?'on':''}" data-s="fatura"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> <span>Fiş / Fatura</span></button>` : ''}
    </div>
    <div id="belgeGovde"></div>
  `;

  c.querySelectorAll("[data-s]").forEach(b => {
    b.onclick = () => {
      S.sub = b.dataset.s;
      scrBelge(c);
    };
  });

  const govde = c.querySelector("#belgeGovde") || c;
  if(S.sub === "makbuzlar" && canSeeMakbuz){
    await scrMakbuzlarSekmesi(govde);
  } else if(S.sub === "fatura" && canSeeFatura){
    await scrFisFaturaSekmesi(govde);
  } else {
    await scrBelgelerListesi(govde, c);
  }
}

    .order("created_at", {ascending: false});
  if(error){
    c.innerHTML = `<div class="card pad"><p class="small" style="color:var(--no)">${esc(niceError(error))}</p></div>`;

  }
  const hepsi = data || [];

  c.innerHTML = `
    <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div class="chips" id="bf">
        <button class="fchip ${BELGE_F==='hepsi'?'on':''}" data-f="hepsi">${t("all")} · ${hepsi.length}</button>

    <div class="card pad"><div id="bl" class="kolon2"></div></div>
  `;

  c.querySelectorAll("[data-f]").forEach(b => {
    b.onclick = () => {
      BELGE_F = b.dataset.f;
      scrBelgelerListesi(c, anaKap);
    };
  });
  if(c.querySelector("#bnew")) {
    c.querySelector("#bnew").onclick = () => belgeModal(() => scrBelgelerListesi(c, anaKap));
  }

  const list = BELGE_F === "hepsi" ? hepsi : hepsi.filter(b => b.kategori === BELGE_F);

  if(!list.length){
    bl.innerHTML = empty(t("b_bos"));

  }

  list.forEach(b => {
    const row = h(`<div class="vcard">
      <div class="vhead">
        <div class="feed-dot" style="width:38px;height:38px;flex:none;background:var(--card2);color:var(--ink2)">${I.folder}</div>

          <div class="t2">${esc(BELGE_KAT[b.kategori]||b.kategori)} · ${esc(boyutYaz(b.dosya_boyut))} · ${fmtDate(b.created_at)}${b.aciklama ? " · " + esc(b.aciklama) : ""}</div>
        </div>
      </div>
      <div class="vact" id="ba-${b.id}"></div>
    </div>`);

    const a = row.querySelector(`#ba-${b.id}`);
    a.appendChild(guard(h(`<button class="btn sm ghost">${I.dl} ${t("b_indir")}</button>`), async() => {
      const {data: sg, error: se} = await sb.storage.from("belgeler").createSignedUrl(b.dosya_yolu, 120);
      if(se) throw se;
      window.open(sg.signedUrl, "_blank");
    }));

    if(isYon()){
      const del = h(`<button class="iconbtn" title="${t("delete")}">${I.trash}</button>`);
      del.onclick = async() => {
        if(!confirm(`"${b.baslik}" silinsin mi? Bu işlem geri alınamaz.`)) return;
        try{
          await sb.storage.from("belgeler").remove([b.dosya_yolu]);
          const {error: de} = await sb.from("belgeler").delete().eq("id", b.id);
          if(de) throw de;
          toast("Silindi");
          scrBelgelerListesi(c, anaKap);
        }catch(e){
          toast(niceError(e), "err");
        }
      };
      a.appendChild(del);
    }
    bl.appendChild(row);
  });
}

/* ═══════════════════════════════════════════════════════════════
   MAKBUZLAR ALT SEKMESİ
   - Sakinler yalnızca kendi adına kesilen makbuzları görür.
   - Yönetici / Yardımcı / Blok Yöneticisi tüm site makbuzlarını görür.
   - Görevlilerde makbuzlar alt sekmesi bulunmaz (scrBelge içinde filtrelenir).
   ═══════════════════════════════════════════════════════════════ */
async function scrMakbuzlarSekmesi(c){
  c.innerHTML = `<div class="loading"><span class="spin"></span></div>`;

  if(isYon()){
    // ————————— YÖNETİCİ GÖRÜNÜMÜ (TÜM SİTE MAKBUZLARI) —————————
    let hamListe = [];
    try{
      const r = await sb.rpc("tum_makbuzlar", { p_yil: null, p_ay: null });
      if(r.error) throw r.error;
      hamListe = r.data || [];
    }catch(e){
      try{
        const { data: dbData, error: dbErr } = await sb.from("makbuzlar").select("*").eq("site_id", S.site.id).order("yil", { ascending: false }).order("ay", { ascending: false });
        if(!dbErr && dbData) hamListe = dbData;
        else throw e;
      }catch(err){
        c.innerHTML = `<div class="card pad"><p class="small" style="color:var(--no-tx)">${esc(niceError(err))}</p></div>`;
        return;
      }
    }

    const yillar = [...new Set(hamListe.map(m => m.yil).filter(Boolean))].sort((a, b) => b - a);
    let seciliYil = "hepsi";
    let seciliAy = "hepsi";
    let aramaMetni = "";
    let sadeceBenim = false;

    function cizYoneticiMakbuz(){
      let filtrelenmis = hamListe;
      if(seciliYil !== "hepsi") filtrelenmis = filtrelenmis.filter(m => String(m.yil) === String(seciliYil));
      if(seciliAy !== "hepsi") filtrelenmis = filtrelenmis.filter(m => String(m.ay) === String(seciliAy));
      if(sadeceBenim && S.prof?.daire_id) filtrelenmis = filtrelenmis.filter(m => m.daire_id === S.prof.daire_id);
      if(aramaMetni){
        const q = aramaMetni.toLocaleLowerCase("tr");
        filtrelenmis = filtrelenmis.filter(m => 
          (m.makbuz_no && m.makbuz_no.toLocaleLowerCase("tr").includes(q)) ||
          (m.odeyen_ad && m.odeyen_ad.toLocaleLowerCase("tr").includes(q)) ||
          (m.daire_metin && m.daire_metin.toLocaleLowerCase("tr").includes(q)) ||
          (m.imzalayan_ad && m.imzalayan_ad.toLocaleLowerCase("tr").includes(q))
        );
      }

      const toplamTutar = filtrelenmis.reduce((acc, m) => acc + (Number(m.tutar) || 0), 0);

      c.innerHTML = `
        <div class="note" style="margin-bottom:14px">
          Site genelinde kesilen tüm resmî aidat makbuzları burada arşivlenir. Sakinler sadece kendi adlarına kesilen makbuzları görürken, yönetim tüm geçmiş makbuz kayıtlarına, arama seçeneklerine ve hukuki geçerliliği olan imzalı PDF dökümlerine buradan ulaşabilir.
        </div>

        <div class="statline" style="margin-bottom:16px">
          <div class="card stat">
            <div class="k">Toplam Kesilen Makbuz</div>
            <div class="v m">${hamListe.length} <span class="small faint" style="font-size:13px">adet</span></div>
          </div>
          <div class="card stat">
            <div class="k">Filtrelenen Makbuz</div>
            <div class="v m">${filtrelenmis.length} <span class="small faint" style="font-size:13px">adet</span></div>
          </div>
          <div class="card stat">
            <div class="k">Tahsilat Tutarı</div>
            <div class="v m" style="color:var(--ok-tx)">${money(toplamTutar)}</div>
          </div>
        </div>

        <div class="card pad" style="margin-bottom:16px">
          <div class="row wrap" style="gap:10px;align-items:center;margin-bottom:14px">
            <div class="grow" style="min-width:200px">
              <input type="text" class="inp" id="tmAramaInp" placeholder="Sakin adı, daire no veya makbuz no ile ara..." value="${esc(aramaMetni)}">
            </div>
            ${yillar.length > 1 ? `
            <div style="min-width:110px">
              <select class="inp" id="tmYilSel">
                <option value="hepsi" ${seciliYil==='hepsi'?'selected':''}>Tüm Yıllar</option>
                ${yillar.map(y => `<option value="${y}" ${String(seciliYil)===String(y)?'selected':''}>${y}</option>`).join("")}
              </select>
            </div>` : ''}
            <div style="min-width:130px">
              <select class="inp" id="tmAySel">
                <option value="hepsi" ${seciliAy==='hepsi'?'selected':''}>Tüm Aylar</option>
                ${AY_ADLARI.map((a, idx) => `<option value="${idx+1}" ${String(seciliAy)===String(idx+1)?'selected':''}>${a}</option>`).join("")}
              </select>
            </div>
            ${sakinMi() ? `
            <button class="fchip ${sadeceBenim?'on':''}" id="tmBenimBtn" style="height:42px;display:inline-flex;align-items:center">
              ${sadeceBenim ? '✓ Kendi Dairem' : 'Kendi Dairem'}
            </button>` : ''}
          </div>

          <div id="tmListeAlan"></div>
        </div>
      `;

      const inp = c.querySelector("#tmAramaInp");
      if(inp){
        inp.oninput = () => { aramaMetni = inp.value.trim(); cizListeElemanlari(); };
      }
      const ySel = c.querySelector("#tmYilSel");
      if(ySel) ySel.onchange = () => { seciliYil = ySel.value; cizYoneticiMakbuz(); };
      const aSel = c.querySelector("#tmAySel");
      if(aSel) aSel.onchange = () => { seciliAy = aSel.value; cizYoneticiMakbuz(); };
      const bBtn = c.querySelector("#tmBenimBtn");
      if(bBtn) bBtn.onclick = () => { sadeceBenim = !sadeceBenim; cizYoneticiMakbuz(); };

      function cizListeElemanlari(){
        const alan = c.querySelector("#tmListeAlan");
        if(!alan) return;

        let filtered = hamListe;
        if(seciliYil !== "hepsi") filtered = filtered.filter(m => String(m.yil) === String(seciliYil));
        if(seciliAy !== "hepsi") filtered = filtered.filter(m => String(m.ay) === String(seciliAy));
        if(sadeceBenim && S.prof?.daire_id) filtered = filtered.filter(m => m.daire_id === S.prof.daire_id);
        if(aramaMetni){
          const q = aramaMetni.toLocaleLowerCase("tr");
          filtered = filtered.filter(m => 
            (m.makbuz_no && m.makbuz_no.toLocaleLowerCase("tr").includes(q)) ||
            (m.odeyen_ad && m.odeyen_ad.toLocaleLowerCase("tr").includes(q)) ||
            (m.daire_metin && m.daire_metin.toLocaleLowerCase("tr").includes(q)) ||
            (m.imzalayan_ad && m.imzalayan_ad.toLocaleLowerCase("tr").includes(q))
          );
        }

        if(!filtered.length){
          alan.innerHTML = empty(hamListe.length ? "Aramanıza uygun makbuz bulunamadı." : "Henüz kesilmiş makbuz bulunmuyor.");
          return;
        }

        alan.innerHTML = `<div class="kolon2" id="tmGrid"></div>`;
        const grid = alan.querySelector("#tmGrid");

        filtered.forEach(m => {
          const item = h(`
            <div class="vcard" style="cursor:pointer">
              <div class="vhead">
                <div class="feed-dot" style="width:40px;height:40px;flex:none;background:var(--ok-soft);color:var(--ok-tx)">${I.receipt}</div>
                <div class="grow" style="min-width:0">
                  <div class="between" style="gap:6px">
                    <div class="t1" style="font-weight:700">${esc(m.odeyen_ad || "—")} <span class="badge mutb">${esc(m.daire_metin)}</span></div>
                    <span class="badge ok plain small">İmzalı</span>
                  </div>
                  <div class="t2" style="margin-top:3px">
                    <b>${AY_ADLARI[m.ay-1]} ${m.yil}</b> · <span class="m" style="color:var(--ok-tx);font-weight:700">${money(m.tutar)}</span> · <span class="m" style="font-size:11.5px;color:var(--mut)">${esc(m.makbuz_no)}</span>
                  </div>
                  <div class="small faint" style="margin-top:2px">
                    Ödeme: ${fmtDate(m.odeme_tarihi)} ${m.imzalayan_ad ? `· Onaylayan: ${esc(m.imzalayan_ad)}` : ''}
                  </div>
                </div>
              </div>
              <div class="vact" style="margin-top:8px">
                <button class="btn sm ghost mkPdfBtn" title="Resmî PDF Olarak Görüntüle ve Yazdır">${I.dl} PDF / Yazdır</button>
                <button class="btn sm mkDetayBtn">${I.receipt} Makbuzu Aç</button>
              </div>
            </div>
          `);

          item.onclick = (e) => {
            if(e.target.closest(".mkPdfBtn")){
              e.stopPropagation();
              makbuzGoster(m, true);
            } else {
              makbuzGoster(m);
            }
          };

          grid.appendChild(item);
        });
      }

      cizListeElemanlari();
    }

    cizYoneticiMakbuz();

  } else {
    // ————————— KAT SAKİNİ GÖRÜNÜMÜ (YALNIZCA KENDİ MAKBUZLARI) —————————
    let list = [];
    try{
      const r = await sb.rpc("makbuzlarim");
      if(r.error) throw r.error;
      list = r.data || [];
    }catch(e){
      try{
        if(S.prof?.daire_id){
          const { data: dbData, error: dbErr } = await sb.from("makbuzlar").select("*")
            .eq("site_id", S.site.id)
            .eq("daire_id", S.prof.daire_id)
            .order("yil", { ascending: false })
            .order("ay", { ascending: false });
          if(!dbErr && dbData) list = dbData;
          else throw e;
        } else {
          list = [];
        }
      }catch(err){
        c.innerHTML = `<div class="card pad"><p class="small" style="color:var(--no-tx)">${esc(niceError(err))}</p></div>`;
        return;
      }
    }

    const toplamTutar = list.reduce((acc, m) => acc + (Number(m.tutar) || 0), 0);

    c.innerHTML = `
      <div class="note" style="margin-bottom:14px">
        Adınıza kesilen resmî dijital aidat makbuzları burada güvenle saklanır. Herhangi bir hukuki uyuşmazlık veya resmî işlemde PDF olarak görüntüleyebilir, indirebilir ve ibraz edebilirsiniz.
      </div>

      <div class="statline" style="margin-bottom:16px">
        <div class="card stat">
          <div class="k">Adınıza Kesilen Makbuz</div>
          <div class="v m">${list.length} <span class="small faint" style="font-size:13px">adet</span></div>
        </div>
        <div class="card stat">
          <div class="k">Toplam Ödenen Tutar</div>
          <div class="v m" style="color:var(--ok-tx)">${money(toplamTutar)}</div>
        </div>
      </div>

      <div class="card pad">
        <div class="sectitle">
          <h2>${I.receipt} Aidat Makbuzlarım</h2>
          <span class="small faint">${list.length} kayıt</span>
        </div>
        <div id="sakinMakbuzAlan"></div>
      </div>
    `;

    const alan = c.querySelector("#sakinMakbuzAlan");
    if(!list.length){
      alan.innerHTML = empty("Henüz adınıza kesilmiş bir makbuz bulunmamaktadır. Aidat ödemeniz yönetim tarafından onaylandığında resmî imzalı makbuzunuz anında buraya eklenir.");
      return;
    }

    alan.innerHTML = `<div class="kolon2" id="smGrid"></div>`;
    const grid = alan.querySelector("#smGrid");

    list.forEach(m => {
      const item = h(`
        <div class="vcard" style="cursor:pointer">
          <div class="vhead">
            <div class="feed-dot" style="width:40px;height:40px;flex:none;background:var(--ok-soft);color:var(--ok-tx)">${I.receipt}</div>
            <div class="grow" style="min-width:0">
              <div class="between">
                <div class="t1" style="font-size:15px;font-weight:700">${AY_ADLARI[m.ay-1]} ${m.yil}</div>
                <span class="badge ok plain small">İmzalı & Onaylı</span>
              </div>
              <div class="t2" style="margin-top:4px">
                Tutar: <b style="color:var(--ok-tx);font-size:15px">${money(m.tutar)}</b> · <span class="m" style="font-size:11.5px;color:var(--mut)">${esc(m.makbuz_no)}</span>
              </div>
              <div class="small faint" style="margin-top:3px">
                Ödeme Tarihi: ${fmtDate(m.odeme_tarihi)} ${m.imzalayan_ad ? `· Onaylayan: ${esc(m.imzalayan_ad)}` : ''}
              </div>
            </div>
          </div>
          <div class="vact" style="margin-top:10px">
            <button class="btn sm ghost mkPdfBtn" title="Resmî PDF Olarak Görüntüle ve Yazdır">${I.dl} PDF / Yazdır</button>
            <button class="btn sm mkDetayBtn">${I.receipt} Makbuzu Aç</button>
          </div>
        </div>
      `);

      item.onclick = (e) => {
        if(e.target.closest(".mkPdfBtn")){
          e.stopPropagation();
          makbuzGoster(m, true);
        } else {
