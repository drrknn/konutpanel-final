/* ═══════════════════════════════════════════════════════════════
   BİLDİRİM ZİLİ, SESLER VE CİHAZ BİLDİRİMLERİ (WEB PUSH)
   ═══════════════════════════════════════════════════════════════ */
let BLDR_ZAMANLAYICI=null;
let BLDR_SON_SAYAC=null;
let BLDR_SES_CTX=null;

function bldrSesCtxAl(){
  if(!BLDR_SES_CTX){
    BLDR_SES_CTX=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(BLDR_SES_CTX.state==="suspended"){
    BLDR_SES_CTX.resume().catch(()=>{});
  }
  return BLDR_SES_CTX;
}

function bildirimSesCal(){
  try{
    const ctx = bldrSesCtxAl();
    if(!ctx) return;
    const now = ctx.currentTime;

    // Konut Panel Yüksek Sesli & Uzun İmzalı Bildirim Melodisi (~2.3 Saniye)
    // 4 Aşamalı Kristal Arpej & Zengin Akustik Rezonans
    const notalar = [
      { f: 392.00, t: 0,    d: 0.85, v: 0.55 }, // G4
      { f: 523.25, t: 0.16, d: 0.95, v: 0.65 }, // C5
      { f: 659.25, t: 0.32, d: 1.15, v: 0.70 }, // E5
      { f: 783.99, t: 0.48, d: 1.80, v: 0.75 }, // G5 (Zirve)
      { f: 1046.50, t: 0.48, d: 1.70, v: 0.50 }, // C6 (Harmonik Çan)
      { f: 1567.98, t: 0.52, d: 1.50, v: 0.30 }  // G6 (Kristal Parıltı)
    ];

    notalar.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(n.f, now + n.t);
      gain.gain.setValueAtTime(0.001, now + n.t);
      gain.gain.linearRampToValueAtTime(n.v, now + n.t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d);
    });
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   WEB PUSH ABONELİĞİ
   İzin "granted" olduğunda cihazı sunucuya kaydeder. Bu kayıt
   olmadan uygulama kapalıyken bildirim GELMEZ; izin tek başına
   yeterli değildir.
   ═══════════════════════════════════════════════════════════════ */

function vapidAnahtariCevir(base64){
  const dolgu = "=".repeat((4 - (base64.length % 4)) % 4);
  const duz = (base64 + dolgu).replace(/-/g, "+").replace(/_/g, "/");
  const ham = atob(duz);
  const dizi = new Uint8Array(ham.length);
  for(let i = 0; i < ham.length; i++) dizi[i] = ham.charCodeAt(i);
  return dizi;
}

let PUSH_ABONE_DENENDI = false;

async function pushAboneOl(){
  try{
    if(Notification.permission !== "granted") return;
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return;

    const vapid = (CFG && CFG.VAPID_PUBLIC_KEY) || "";
    if(!vapid){
      console.warn("[push] VAPID_PUBLIC_KEY tanımlı değil — push aboneliği atlandı");
      return;
    }

    const reg = await navigator.serviceWorker.ready;
    let abonelik = await reg.pushManager.getSubscription();
    if(!abonelik){
      abonelik = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidAnahtariCevir(vapid)
      });
    }

    const { data:{ session } } = await sb.auth.getSession();
    if(!session?.access_token) return;   // giriş yoksa sonra tekrar denenir

    await fetch("/.netlify/functions/push-abone", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token
      },
      body: JSON.stringify({
        abonelik: abonelik.toJSON(),
        cihaz_adi: navigator.userAgent.slice(0, 120)
      })
    });
    PUSH_ABONE_DENENDI = true;
  }catch(e){
    console.warn("[push] abonelik kurulamadı:", e);
  }
}

/* ═══════════════════════════════════════════════════════════════
   İZİN DEĞİŞİKLİĞİNİ İZLE
   TWA ve tarayıcıda izin durumunu izler, kullanıcı kapatmışsa
   banner'ı tekrar tekrar ekrana basarak kullanıcıyı kilitlemez.
   ═══════════════════════════════════════════════════════════════ */
function bildirimIzniIzle(){
  if(!("Notification" in window)) return;

  const kontrol = () => {
    bildirimBannerGuncelle();
    if(Notification.permission === "granted" && !PUSH_ABONE_DENENDI) pushAboneOl();
  };

  if(navigator.permissions?.query){
    navigator.permissions.query({ name: "notifications" }).then((durum) => {
      durum.onchange = kontrol;
    }).catch(()=>{});
  }

  document.addEventListener("visibilitychange", () => { if(!document.hidden) kontrol(); });
  window.addEventListener("focus", kontrol);

  let sayac = 0;
  const zamanlayici = setInterval(() => {
    kontrol();
    if(++sayac >= 10 || Notification.permission === "granted") clearInterval(zamanlayici);
  }, 1000);
}

async function bildirimIzniIste(sessiz=false){
  if(!("Notification" in window)){
    if(!sessiz) toast("Cihazınızda bildirim özelliği desteklenmiyor.", "err");
    return false;
  }
  if(Notification.permission === "granted"){
    sessionStorage.setItem("bl_banner_closed", "1");
    bildirimBannerGuncelle();
    if(!sessiz) toast("Cihaz bildirimleri zaten açık ✓");
    return true;
  }
  if(Notification.permission === "denied"){
    if(!sessiz){
      modal(`
        <div style="text-align:center;padding:12px 6px">
          <div style="width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:rgba(239,68,68,.12);color:#ef4444;display:flex;align-items:center;justify-content:center;font-size:26px">🔕</div>
          <h2 style="font-size:18px;margin-bottom:8px">Bildirim İzni Gerekli</h2>
          <p class="mut small" style="line-height:1.6;margin-bottom:14px;text-align:left">
            Cihazınızda veya tarayıcınızda bildirimler kapalı görünüyor. Açmak için:
          </p>
          <div style="background:var(--card2,#181824);border:1px solid var(--line,#2a2a3c);border-radius:10px;padding:12px;text-align:left;font-size:12.5px;line-height:1.6;margin-bottom:16px">
            <b>1. Android Uygulamasında:</b><br>
            Telefonunuzun <b>Ayarlar &gt; Uygulamalar &gt; Konut Panel &gt; Bildirimler</b> menüsünden bildirimlere izin verin.<br><br>
            <b>2. Tarayıcı / Chrome:</b><br>
            Üstteki adres çubuğundaki <b>kilit/ayar 🔒</b> simgesine dokunun &gt; <b>İzinler &gt; Bildirimler &gt; İzin Ver</b> yapın.
          </div>
          <div class="row" style="gap:8px">
            <button class="btn full" id="blTekrarDeneBtn" style="background:var(--acc);color:#fff">İzni Kontrol Et / Aç</button>
            <button class="btn full" style="background:var(--card2);border:1px solid var(--line)" onclick="sessionStorage.setItem('bl_banner_closed','1');localStorage.setItem('bl_banner_dismissed_until',String(Date.now()+86400000));bildirimBannerGuncelle();closeModal()">Kapat</button>
          </div>
        </div>
      `);
      const td = $("#blTekrarDeneBtn");
      if(td) {
        td.onclick = async () => {
          td.disabled = true;
          td.textContent = "Kontrol Ediliyor…";
          try {
            const p = await Notification.requestPermission();
            if(p === "granted" || Notification.permission === "granted"){
              closeModal();
              toast("Cihaz bildirimleri başarıyla açıldı! ✓");
              bildirimSesCal();
              sessionStorage.setItem("bl_banner_closed", "1");
              bildirimBannerGuncelle();
              cihazBildirimiGonder("Konut Panel Bildirimleri Açıldı 🔔", "Yeni aidat, makbuz ve duyurulardan anında haberdar olacaksınız.");
              pushAboneOl();
              return;
            }
          } catch(e){}
          closeModal();
          toast("Bildirim izni henüz algılanamadı. Lütfen telefon ayarlarından bildirimleri açtığınızdan emin olun.", "err");
          bildirimBannerGuncelle();
        };
      }
    }
    return false;
  }

  try{
    let perm;
    try {
      const p = Notification.requestPermission();
      if (p && typeof p.then === "function") {
        perm = await p;
      } else {
        perm = await new Promise(resolve => Notification.requestPermission(resolve));
      }
    } catch(errReq) {
      perm = await new Promise(resolve => Notification.requestPermission(resolve));
    }

    if(perm === "granted"){
      toast("Cihaz bildirimleri başarıyla açıldı! ✓");
      bildirimSesCal();
      sessionStorage.setItem("bl_banner_closed", "1");
      bildirimBannerGuncelle();
      try {
        cihazBildirimiGonder("Konut Panel Bildirimleri Açıldı 🔔", "Yeni aidat, makbuz ve duyurulardan anında haberdar olacaksınız.");
        pushAboneOl();
      } catch(e){}
      return true;
    } else {
      sessionStorage.setItem("bl_banner_closed", "1");
      localStorage.setItem("bl_banner_dismissed_until", String(Date.now() + 86400000));
      bildirimBannerGuncelle();
      if(!sessiz) {
        if(perm === "denied") {
          toast("Bildirim izni verilmedi. Ayarlardan dilediğiniz zaman açabilirsiniz.");
        } else {
          toast("Bildirim izni ertelendi.");
        }
      }
      return false;
    }
  }catch(e){

async function cihazBildirimiGonder(baslik, metin, url = "/"){
  bildirimSesCal();

  const origin = window.location.origin || "";

  try{

      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(baslik || "Konut Panel", {

        badge: badgeUrl
      });

function bildirimRealtimeBaslat(){
  if(!S.user?.id) return;
  if(BLDR_REALTIME_CH){
    try{ sb.removeChannel(BLDR_REALTIME_CH); }catch(e){}
  }
  try{
    BLDR_REALTIME_CH = sb.channel(`realtime:bildirimler:${S.user.id}`)
      .on(

        {
          event: 'INSERT',

async function bildirimGonder({ alici_id, alici_rol, tur, baslik, metin, kaynak_tablo, kaynak_id, hedef_ekran, onem = "normal" }){
  if(!S.site?.id){ console.warn("[bildirim] site bilgisi yok, atlandı"); return; }
  console.log("[bildirim] çağrıldı:", { alici_id, alici_rol, tur, baslik });
  try{
    let aliciIds = [];
    if(alici_id){
      aliciIds = [alici_id];
    } else if(alici_rol === "yoneticiler"){
      const { data } = await sb.from("profiller")
        .select("id")
        .eq("site_id", S.site.id)
        .in("rol", ["yonetici", "yonetici_yrd", "blok_yonetici"]);
      aliciIds = (data || []).map(p => p.id);
    } else if(alici_rol === "sakinler"){
      const { data } = await sb.from("profiller")
        .select("id")
        .eq("site_id", S.site.id)
        .eq("rol", "sakin");
      aliciIds = (data || []).map(p => p.id);
    } else if(alici_rol === "gorevliler"){
      const { data } = await sb.from("profiller")
        .select("id")
        .eq("site_id", S.site.id)
        .eq("rol", "gorevli");
      aliciIds = (data || []).map(p => p.id);
    }

    /* Cihaz bildirimi (web push).
       aliciIds boş olsa bile çalışır: alıcıları sunucu service_role ile
       çözer. İstemcide RLS yüzünden sakin, yönetici profillerini
       göremiyor ve liste boş dönüyordu. */
    pushTetikle({
      aliciIds: aliciIds.filter(uid => uid !== S.prof?.id),
      alici_rol,
      baslik: baslik || "Konut Panel",
      metin: metin || "",
      hedef_ekran: hedef_ekran || "panel",
      tur: tur || "sistem",
      onem
    });

    if(!aliciIds.length){
      console.warn("[bildirim] istemcide alıcı bulunamadı (RLS) — uygulama içi bildirim yazılmadı, push sunucudan gönderildi");
      return;
    }

    const rows = aliciIds.map(uid => ({
      site_id: S.site.id,
      alici_id: uid,
      tur: tur || "sistem",
      baslik: baslik || "Konut Panel",
      metin: metin || "",
      kaynak_tablo: kaynak_tablo || null,
      kaynak_id: kaynak_id || null,
      hedef_ekran: hedef_ekran || "panel",
      onem: onem || "normal",
      okundu: false
    }));

    /* Uygulama içi bildirim — ayrı try, push'u etkilemesin */
    try{
      const { error } = await sb.from("bildirimler").insert(rows);
      if(error) console.warn("[bildirim] tabloya yazılamadı:", error.message);
    }catch(e){
      console.warn("[bildirim] tabloya yazılamadı:", e);
    }
  }catch(e){
    console.warn("[bildirim] gönderilemedi:", e);
  }
}

/* ═══════════════════════════════════════════════════════════════
   PUSH TETİKLEME
   bildirimGonder() her çağrıldığında devreye girer; ayrı ayrı
   olaylara kod eklemeye gerek yoktur. Hata olursa sessiz geçer —
   push başarısız diye uygulama içi bildirim kaybolmamalı.
   ═══════════════════════════════════════════════════════════════ */
async function pushTetikle({ aliciIds, alici_rol, baslik, metin, hedef_ekran, tur, onem }){
  try{
    if(!aliciIds?.length && !alici_rol){ console.warn("[push] hedef yok, atlandı"); return; }
    if(!S.site?.id){ console.warn("[push] site bilgisi yok, atlandı"); return; }

    const { data:{ session } } = await sb.auth.getSession();
    if(!session?.access_token){ console.warn("[push] oturum yok, atlandı"); return; }

    const y = await fetch("/.netlify/functions/push-gonder", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token
      },
      body: JSON.stringify({
        site_id: S.site.id,
        kullanici_idler: aliciIds?.length ? aliciIds : undefined,
        alici_rol: aliciIds?.length ? undefined : alici_rol,
        baslik,
        govde: metin,
        url: "/uygulama#" + (hedef_ekran || "panel"),
        tur,
        etiket: "konutpanel-" + (tur || "genel"),
        onemli: onem === "yuksek"
      })
    });
    const sonuc = await y.json().catch(() => ({}));
    console.log("[push] sonuç:", y.status, sonuc);
  }catch(e){
    console.warn("[push] gönderilemedi:", e);
  }
}

async function bildirimSayacTazele(){
  const rozet=$("#zilRozet"); if(!rozet) return;
  try{
    const r=await sb.rpc("bildirim_okunmamis");
    if(r.error) throw r.error;
    const d=(r.data&&r.data[0])||{toplam:0,yuksek:0};
    const n=Number(d.toplam||0);

    if(BLDR_SON_SAYAC !== null && n > BLDR_SON_SAYAC){
      // Yeni bir bildirim geldi!
      cihazBildirimiGonder("Konut Panel 🔔", "Yeni bir bildiriminiz var.");
    }
    BLDR_SON_SAYAC = n;

    if(n>0){
      rozet.textContent = n>9 ? "9+" : String(n);
      rozet.style.display="";
      rozet.style.background = Number(d.yuksek||0)>0 ? "var(--no)" : "var(--acc)";
    } else {
      rozet.style.display="none";
    }
  }catch(e){ rozet.style.display="none"; }
}

    const r=await sb.rpc("bildirim_tercih_kaydet",{p_tercih:tercih});
    if(r.error) throw r.error;
    closeModal(); toast("Bildirim tercihleri kaydedildi ✓");
  }));
}


/* ═══════════════════════════════════════════════════════════════
   DİJİTAL MAKBUZ VE İMZA (Madde 10-15)

   Akış: yönetici "Ödendi işaretle" der → bu modal açılır → site ve
   daire bilgisi otomatik doldurulur → yönetici imza atar (zorunlu,
   parmak veya mouse) → "Makbuzu Kes ve Onayla" → tek RPC çağrısıyla
   hem makbuz oluşur hem aidat durumu "Ödendi" olur (atomik).
   ═══════════════════════════════════════════════════════════════ */

async function makbuzOnayModal(daireId, yil, ay, refresh){
  let bilgi=null;
  try{
    const r=await sb.rpc("makbuz_hazirlik",{p_daire_id:daireId,p_yil:yil,p_ay:ay});
    if(r.error) throw r.error;
    bilgi=(r.data&&r.data[0])||null;
  }catch(e){ return toast(niceError(e),"err"); }
  if(!bilgi) return toast("Bilgi alınamadı","err");

  if(bilgi.zaten_makbuz_var){
    toast("Bu dönem için zaten makbuz kesilmiş","err");
    return;
  }

  let dd=null;
  try{
    const { data }=await sb.from("daire_detay").select("oturan_ad, sahiplik, aidat_odeyen, sahip_ad").eq("daire_id", daireId).maybeSingle();
    dd=data;
  }catch(e){}

  const isSahipOdeyen = dd ? (dd.aidat_odeyen === "sahip") : true;
  const odeyenAd = dd 
    ? (isSahipOdeyen 
        ? (dd.sahip_ad || (dd.sahiplik === "sahip" ? dd.oturan_ad : "") || dd.oturan_ad || bilgi.odeyen_ad || "Ev Sahibi")
        : (dd.oturan_ad || bilgi.odeyen_ad || "Kiracı"))
    : (bilgi.odeyen_ad || "—");
  const odeyenUnvan = isSahipOdeyen ? "Ev Sahibi" : "Kiracı";
  const tamOdeyenMetin = `${odeyenAd} (${odeyenUnvan})`;

  const mdl=modal(`
    <h2 style="font-size:19px;margin-bottom:4px">${I.receipt} Dijital Makbuz</h2>
    <p class="small mut" style="margin-bottom:16px">${AY_ADLARI[ay-1]} ${yil} · ${esc(bilgi.daire_metin)}</p>

    <div class="infobox" style="margin-bottom:16px;padding:16px">
      <div style="text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)">
        <div style="font-weight:700;font-size:16px">${esc(bilgi.site_ad)}</div>
        ${bilgi.site_adres?`<div class="small faint" style="margin-top:2px">${esc(bilgi.site_adres)}</div>`:""}
      </div>
      <div style="font-size:13.5px;line-height:2">
        <div class="between"><span class="faint">Ödeyen</span><span><b>${esc(odeyenAd)}</b> <span class="badge plain small" style="margin-left:4px">${odeyenUnvan}</span></span></div>
        <div class="between"><span class="faint">Daire</span><span>${esc(bilgi.daire_metin)}</span></div>
        <div class="between"><span class="faint">Dönem</span><span>${AY_ADLARI[ay-1]} ${yil}</span></div>
        <div class="between"><span class="faint">Ödeme tarihi</span><span>${fmtDate(new Date())}</span></div>
        ${bilgi.site_iban?`<div class="between"><span class="faint">IBAN</span><span class="m" style="font-size:12px">${esc(bilgi.site_iban)}</span></div>`:""}
      </div>
    </div>

    <div class="field"><label>Tahsil edilen tutar</label>
      <input class="inp m" id="mkTutar" inputmode="decimal" value="${bilgi.onerilen_tutar||""}" placeholder="0">
      <div class="small faint" id="mkTutarOn" style="margin-top:5px;min-height:16px"></div></div>

    <div class="field">
      <label>İmza <span style="color:var(--no-tx)">*</span></label>
      <div class="small faint" style="margin-bottom:8px">Kutunun içine parmağınızla ya da mouse ile imza atın.</div>
      <div style="position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;touch-action:none">
        <canvas id="mkImza" style="display:block;width:100%;height:170px;cursor:crosshair"></canvas>
        <div id="mkImzaIpucu" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;pointer-events:none">Buraya imza atın</div>
      </div>
      <button type="button" class="btn ghost sm" id="mkTemizle" style="margin-top:8px">${I.refresh} Temizle</button>
    </div>

    <div class="note" style="margin:14px 0">İmza tamamlandıktan sonra makbuz kesinleşir ve düzenlenemez. Makbuz sakinin ve yöneticinin arşivine otomatik eklenir.</div>

    <div id="mkSv"></div>
    <button class="btn ghost full" id="mkCx" style="margin-top:8px">${t("cancel")}</button>
  `, true);
  mdl.querySelector("#mkCx").onclick=closeModal;
  tutarOnizleme("mkTutar","mkTutarOn");

  /* ————— İmza canvas'ı: parmak + mouse ————— */
  const canvas=mdl.querySelector("#mkImza");
  const ipucu=mdl.querySelector("#mkImzaIpucu");
  const ctx=canvas.getContext("2d");
  let cizildi=false, ciziyor=false, sonX=0, sonY=0;

  function boyutlandir(){
    const oran=window.devicePixelRatio||1;
    const kutu=canvas.getBoundingClientRect();
    canvas.width=kutu.width*oran; canvas.height=kutu.height*oran;
    ctx.scale(oran,oran);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111827";
  }
  boyutlandir();

  function konum(e){
    const kutu=canvas.getBoundingClientRect();
    const nokta=e.touches?e.touches[0]:e;
    return {x:nokta.clientX-kutu.left, y:nokta.clientY-kutu.top};
  }
  function baslat(e){ e.preventDefault(); ciziyor=true; const p=konum(e); sonX=p.x; sonY=p.y; if(ipucu)ipucu.remove(); }
  function ciz(e){
    if(!ciziyor) return; e.preventDefault();
    const p=konum(e);
    ctx.beginPath(); ctx.moveTo(sonX,sonY); ctx.lineTo(p.x,p.y); ctx.stroke();
    sonX=p.x; sonY=p.y; cizildi=true;
  }
  function bitir(){ ciziyor=false; }

  canvas.addEventListener("mousedown",baslat);
  canvas.addEventListener("mousemove",ciz);
  window.addEventListener("mouseup",bitir);
  canvas.addEventListener("touchstart",baslat,{passive:false});
  canvas.addEventListener("touchmove",ciz,{passive:false});
  canvas.addEventListener("touchend",bitir);

  mdl.querySelector("#mkTemizle").onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    cizildi=false;
    if(!mdl.querySelector("#mkImzaIpucu")){
      const yeni=document.createElement("div");
      yeni.id="mkImzaIpucu";
      yeni.style.cssText="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;pointer-events:none";
      yeni.textContent="Buraya imza atın";
      canvas.parentElement.appendChild(yeni);
    }
  };

  mdl.querySelector("#mkSv").appendChild(guard(h(`<button class="btn ok full">Makbuzu Kes ve Onayla</button>`),async()=>{
    if(!cizildi) throw new Error("Devam etmek için imza atın");
    const tutar=tutarOku(mdl.querySelector("#mkTutar").value);
    if(isNaN(tutar)||tutar<=0) throw new Error("Geçerli bir tutar girin");

    /* Canvas → PNG blob → Storage. Yükleme başarılı olup RPC başarısız
       olursa yetim dosya kalmasın diye geri temizleniyor. */
    const blob=await new Promise(res=>canvas.toBlob(res,"image/png"));
    if(!blob) throw new Error("İmza kaydedilemedi, tekrar deneyin");

    const yol=`${S.site.id}/${daireId}/${crypto.randomUUID()}.png`;
    const {error:ue}=await sb.storage.from("makbuzlar").upload(yol,blob,{contentType:"image/png",upsert:false});
    if(ue) throw ue;

    try{
      const r=await sb.rpc("makbuz_olustur_ve_onayla",{
        p_daire_id:daireId, p_yil:yil, p_ay:ay, p_tutar:tutar, p_imza_yolu:yol});
      if(r.error) throw r.error;

      // makbuzlar tablosundaki odeyen_ad alanını doğru ödeyen adıyla güncelle
      try {
        await sb.from("makbuzlar").update({ odeyen_ad: tamOdeyenMetin })
          .eq("site_id", S.site.id).eq("daire_id", daireId).eq("yil", yil).eq("ay", ay);
      }catch(e){}

      // Kasa hareketlerine anında gelir kaydı olarak işle
      try {
        const { data: od } = await sb.from("odemeler").select("id")
          .eq("site_id", S.site.id)
          .eq("daire_id", daireId)
          .eq("yil", yil)
          .eq("ay", ay)
          .maybeSingle();
        await aidatKasaKaydiEkle(od?.id, daireId, yil, ay, tutar, bilgi.daire_metin);
      } catch(ke){
        console.warn("Kasa aidat hareketi eklenemedi:", ke);
      }

      // Sakine bildirim gönder
      try {
        const { data: sakProf } = await sb.from("profiller").select("id").eq("site_id", S.site.id).eq("daire_id", daireId).maybeSingle();
        if(sakProf?.id){
          bildirimGonder({
            alici_id: sakProf.id,
            tur: "aidat",
            baslik: "🧾 Makbuzunuz Hazırlandı",
            metin: `${AY_ADLARI[ay-1]} ${yil} dönemi aidat makbuzunuz onaylandı.`,
            kaynak_tablo: "makbuzlar",
            hedef_ekran: "belge",
            onem: "normal"
          });
        }
      }catch(e){}

      closeModal();
      toast("Makbuz kesildi ✓ · "+((r.data&&r.data[0]&&r.data[0].makbuz_no)||""));
      refresh();
    }catch(err){
      await sb.storage.from("makbuzlar").remove([yol]).catch(()=>{});
      throw err;
    }
  }));
}
